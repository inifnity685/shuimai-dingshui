        '</header>' +
        '<aside class="bpools" aria-label="四池水盂">' +
          '<div class="bpools__head"><span>四池水盂</span><b id="bt-transfer-count">调剂 2</b></div>' +
          '<div class="bpools__grid">' + poolHTML + '</div>' +
        '</aside>' +
        '<section class="bscene" id="bscene" aria-label="战局">' +
          '<div class="bscene__art" aria-hidden="true">' + artBackdrop(app.day) + '</div>' +
          '<div class="bscene__veil" aria-hidden="true"></div>' +
          '<div class="bscene__objective"><span class="bscene__obj-kicker">本日目标</span><span id="bt-objective-full">' + esc(objective.full) + '</span></div>' +
          '<div class="benemies" id="benemies"></div>' +
          '<div class="bscene__hint" id="bt-hint"></div>' +
        '</section>' +
        '<aside class="bside" aria-label="水情简报与战报">' +
          '<section class="bside__doc">' +
            '<div class="bside__redhead">水情简报</div>' +
            '<div class="bside__meta"><span>' + esc(day.title || '') + '</span><span class="bside__stamp">' + artStamp(day.stamp || '阅') + '</span></div>' +
            '<p class="bside__line">' + esc(((day.brief && day.brief.lines) || [])[0] || '') + '</p>' +
            '<p class="bside__line">' + esc(((day.brief && day.brief.lines) || [])[1] || '') + '</p>' +
            '<p class="bside__annotation">' + esc((day.brief && day.brief.annotation) || '') + '</p>' +
          '</section>' +
          '<section class="bside__logwrap">' +
            '<div class="bside__loghead"><span>战报</span><i class="bside__rule"></i></div>' +
            '<ol class="blog" id="blog"></ol>' +
          '</section>' +
        '</aside>' +
        '<footer class="bbottom">' +
          '<div class="btray btray--left">' +
            '<div class="btray__row"><span>牌堆</span><b id="bt-deck">0</b><span class="btray__sep">/</span><span>弃牌</span><b id="bt-discard">0</b></div>' +
            '<div class="btray__row"><span>耗水</span><b id="bt-spent">0</b><span class="btray__sep">/</span><span>浊用</span><b id="bt-muddyused">0</b></div>' +
            '<button type="button" class="btray__transfer" data-act="transfer">调剂水权</button>' +
          '</div>' +
          '<div class="bhand" id="bhand" aria-label="手牌"></div>' +
          '<div class="btray btray--right">' +
            '<div class="btray__hint" id="bt-hand-hint">点手牌出牌</div>' +
            '<button type="button" class="btn-end" data-act="end-turn">' +
              '<span class="btn-end__label">结束回合</span><span class="btn-end__sub">敌方将行动</span>' +
            '</button>' +
          '</div>' +
        '</footer>' +
        '<div class="card-pop" id="cardPop" hidden></div>' +
      '</div>';

    app.el = {
      turn: $('#bt-turn'), poll: $('#bt-poll'), shield: $('#bt-shield'),
      save: $('#bt-save'), transferCount: $('#bt-transfer-count'),
      deck: $('#bt-deck'), discard: $('#bt-discard'), spent: $('#bt-spent'),
      muddysed: $('#bt-muddyused'), hand: $('#bhand'), enemies: $('#benemies'),
      log: $('#blog'), scene: $('#bscene'), hint: $('#bt-hint'),
      handHint: $('#bt-hand-hint'), pop: $('#cardPop'),
      objectiveFull: $('#bt-objective-full'),
      pools: {}
    };
    POOL_KEYS.forEach(function (key) {
      var root = $('.pool--' + key, app.root);
      if (!root) return;
      app.el.pools[key] = {
        root: root,
        clean: $('[data-part="clean"]', root),
        muddy: $('[data-part="muddy"]', root),
        warn: $('[data-part="warn"]', root),
        red: $('[data-part="red"]', root),
        eff: $('[data-part="eff"]', root),
        water: $('[data-part="water"]', root),
        max: $('[data-part="max"]', root),
        warnNum: $('[data-part="warnNum"]', root),
        redNum: $('[data-part="redNum"]', root),
        muddyNum: $('[data-part="muddyNum"]', root),
        effNum: $('[data-part="effNum"]', root)
      };
    });
    syncBattle(true);
  }

  function objectiveText(day) {
    var win = day && day.win;
    if (!win) return { short: '谈判', full: '四方会商 · 水权分配' };
    if (win.type === 'purifyAll') return { short: '净化全部', full: '清空全部怪物污染值' };
    if (win.type === 'purifyMain') return { short: '净化本体', full: '清空本体污染值，分身自散' };
    if (win.type === 'below') return { short: '压至 ' + win.value, full: '将指定怪物污染值压至 ' + win.value + ' 以下' };
    return { short: '取胜', full: '完成本日目标' };
  }

  /* ---------- 战斗同步 ---------- */

  function syncBattle(force) {
    if (app.screen !== 'battle' || !app.state) return;
    var st = app.state;
    try {
      if (app.el.turn) app.el.turn.textContent = st.turn;
      var poll = 0;
      st.enemies.forEach(function (e) { if (e.alive) poll += num(e.pollution); });
      if (app.el.poll) app.el.poll.textContent = poll;
      if (app.el.shield) app.el.shield.textContent = num(st.shield);
      if (app.el.transferCount) app.el.transferCount.textContent = '调剂 ' + num(st.transfersLeft);
      if (app.el.deck) app.el.deck.textContent = (st.deck || []).length;
      if (app.el.discard) app.el.discard.textContent = (st.discard || []).length;
      if (app.el.spent) app.el.spent.textContent = num(st.waterSpent);
      if (app.el.muddysed) app.el.muddysed.textContent = num(st.stats && st.stats.muddyUsed);
      if (app.el.save) app.el.save.textContent = app.save ? ('存档 · 第' + cnDay(app.save.day) + '日') : '无存档';
      syncPools();
      syncEnemies();
      renderHand();
      syncTargetClasses();
      appendLog();
      updateEndTurnState();
      syncSurgeHint();
      if (app.el.scene) app.el.scene.classList.toggle('is-lost', st.phase === 'lost');
    } catch (e) {
      if (force) throw e;
      freeze();
    }
  }

  /* 翻涌预警：systemic 每 N 回合在敌方阶段触发（判定用当前回合号），
     故在玩家回合 T 时预测 (T+1)%N===0，提醒"下回合将翻涌"，避免新玩家第 7 天被掏空 */
  function syncSurgeHint() {
    var el = app.el.hint;
    if (!el) return;
    var st = app.state;
    if (!st || st.phase !== 'battle') { el.textContent = ''; return; }
    var names = [];
    (st.enemies || []).forEach(function (e) {
      if (!e || !e.alive) return;
      (e.traits || []).forEach(function (t) {
        if (!t || t.type !== 'systemic') return;
        var every = Math.max(1, Math.floor(num(t.every) || 1));
        if ((num(st.turn) + 1) % every === 0) {
          if (names.indexOf(e.name) < 0) names.push(e.name || '怪物');
        }
      });
    });
    el.textContent = names.length
      ? '下回合 ' + names.join('、') + ' 将翻涌：四池清水一成转浊（护甲无效）'
      : '';
    el.classList.toggle('is-warn', names.length > 0);
  }

  function freeze() {
    toast('界面同步失手，已稳住墨色。', 'warn');
  }

  function syncPools() {
    var st = app.state;
    POOL_KEYS.forEach(function (key) {
      var els = app.el.pools[key];
      if (!els) return;
      var info;
      try { info = engine().poolInfo(st, key); } catch (e) { info = null; }
      if (!info) return;
      var denom = Math.max(1, num(info.cap), num(info.water));
      var cleanH = clamp((num(info.clean) / denom) * 100, 0, 100);
      var muddyH = clamp((num(info.muddy) / denom) * 100, 0, 100);
      var waterH = clamp((num(info.water) / denom) * 100, 0, 100);
      var warnB = clamp((num(info.warn) / denom) * 100, 0, 100);
      var redB = clamp((num(info.red) / denom) * 100, 0, 100);
      var effB = clamp((num(info.effCap) / denom) * 100, 0, 100);
      els.clean.style.height = cleanH + '%';
      els.muddy.style.height = muddyH + '%';
      els.muddy.style.bottom = cleanH + '%';
      els.warn.style.bottom = warnB + '%';
      els.red.style.bottom = redB + '%';
      els.eff.style.bottom = effB + '%';
      els.water.textContent = num(info.water);
      els.max.textContent = '/' + num(info.cap);
      if (els.warnNum) els.warnNum.textContent = '警 ' + num(info.warn);
      if (els.redNum) els.redNum.textContent = '红 ' + num(info.red);
      els.muddyNum.textContent = '浊 ' + num(info.muddy);
      els.effNum.textContent = '效 ' + num(info.effCap);
      var belowRed = num(info.water) > 0 && num(info.water) < num(info.red);
      var belowWarn = num(info.water) < num(info.warn);
      els.root.classList.toggle('is-below-red', belowRed);
      els.root.classList.toggle('is-below-warn', belowWarn);
      els.root.classList.toggle('is-empty', num(info.water) <= 0);
      els.root.classList.toggle('is-overflow', num(info.overflow) > 0);
      els.root.dataset.tooltip = poolName(key) + ' ' + num(info.water) + '/' + num(info.cap) +
        ' · 清 ' + num(info.clean) + ' · 浊 ' + num(info.muddy) + ' · 效 ' + num(info.effCap);
      if (waterH !== undefined) els.root.dataset.water = num(info.water);
    });
  }

  /* ---------- 怪物 ---------- */

  function enemyIntent(enemy) {
    if (!enemy) return { text: '', kind: '' };
    if (enemy.sealTurns > 0) return { text: '封印中 · 余 ' + enemy.sealTurns + ' 回合', kind: 'good' };
    var mod = 0;
    ((app.state && app.state.debuffs) || []).forEach(function (d) { mod += num(d.amount); });
    var parts = [];
    (enemy.traits || []).forEach(function (t) {
      if (t.type === 'pollute') parts.push('转浊 ' + poolShort(t.pool) + ' ' + Math.max(0, num(t.amount) + mod));
      else if (t.type === 'steal') parts.push('夺水 ' + poolShort(t.pool) + ' ' + Math.max(0, num(t.amount) + mod));
      else if (t.type === 'eatMax') parts.push('削' + poolShort(t.pool) + '上限 ' + Math.max(0, num(t.amount) + mod));
      else if (t.type === 'split') parts.push('每 ' + num(t.every || 2) + ' 回合分裂');
      else if (t.type === 'sealPool') parts.push('封' + poolShort(t.pool) + '池 ' + Math.round(num(t.share) * 100) + '%');
      else if (t.type === 'occupy') parts.push('占用' + poolShort(t.pool) + '上限 ' + num(t.amount));
      else if (t.type === 'systemic') parts.push('每 ' + num(t.every || 3) + ' 回合翻涌');
    });
    return { text: parts.length ? parts.join(' · ') : '按兵不动', kind: '' };
  }

  function traitText(t) {
    if (!t) return '';
    if (t.type === 'pollute') return '每回合：' + poolName(t.pool) + ' 清水转浊 ' + num(t.amount);
    if (t.type === 'steal') return '每回合：' + poolName(t.pool) + ' 水 -' + num(t.amount);
    if (t.type === 'eatMax') return '每回合：' + poolName(t.pool) + ' 上限 -' + num(t.amount);
    if (t.type === 'split') return '每 ' + num(t.every || 2) + ' 回合分裂一个分身（占 ' + poolName(t.pool) + ' 上限 ' + num(t.amount) + '，至多 ' + num(t.max) + '）';
    if (t.type === 'sealPool') return '存活时：' + poolName(t.pool) + ' 有效上限 -' + Math.round(num(t.share) * 100) + '%';
    if (t.type === 'occupy') return '占用：' + poolName(t.pool) + ' 有效上限 -' + num(t.amount);
    if (t.type === 'systemic') return '每 ' + num(t.every || 3) + ' 回合：四池清水一成转浊（护甲无效）';
    return '';
  }

  function enemySig() {
    var st = app.state;
    if (!st) return '';
    return st.enemies.map(function (e) { return e.uid + (e.alive ? '+' : '-') + (e.isClone ? 'c' : 'm'); }).join(',');
  }

  function isBossEnemy(e) {
    if (!e) return false;
    if (e.isBoss) return true;
    if (e.id === 'zhuolong') return true;
    return (e.traits || []).some(function (t) { return t.type === 'systemic'; });
  }

  function renderEnemies() {
    if (!app.el.enemies || !app.state) return;
    var list = app.state.enemies;
    var html = list.map(function (e) {
      var dead = !e.alive || num(e.pollution) <= 0;
      var pct = clamp((num(e.pollution) / Math.max(1, num(e.maxPollution))) * 100, 0, 100);
      var intent = enemyIntent(e);
      var cloneTag = e.isClone && String(e.name || '').indexOf('分身') < 0
        ? '<span class="enemy__clone-tag">分身</span>' : '';
      return '<div class="enemy' + (dead ? ' is-dead' : '') + (e.isClone ? ' enemy--clone' : '') +
          (isBossEnemy(e) ? ' enemy--boss' : '') + '" data-enemy-uid="' + esc(e.uid) + '" data-act="enemy-info" ' +
          'role="button" tabindex="0" aria-label="' + esc(e.name + '：污染值 ' + num(e.pollution) + '，' + intent.text) + '" ' +
          'title="' + esc(e.name) + '">' +
        '<div class="enemy__art">' + artEnemy(e.art || e.id) + '<span class="enemy__stain" aria-hidden="true"></span></div>' +
        '<div class="enemy__plate">' +
          '<div class="enemy__name">' + esc(e.name) + cloneTag + '</div>' +
          '<div class="enemy__sub">' + esc(e.subtitle || '') + '</div>' +
        '</div>' +
        '<div class="enemy__poll">' +
          '<div class="enemy__bar"><i data-part="bar" style="width:' + pct + '%"></i></div>' +
          '<b class="enemy__num" data-part="num">' + num(e.pollution) + '</b>' +
        '</div>' +
        '<div class="enemy__traits" data-part="traits">' + esc(traitLine(e)) + '</div>' +
        '<div class="enemy__intent ' + (intent.kind ? 'is-' + intent.kind : '') + '" data-part="intent">意图 · ' + esc(intent.text) + '</div>' +
        '<div class="enemy__seal" data-part="seal"' + (num(e.sealTurns) > 0 ? '' : ' hidden') + '>封<b>' + num(e.sealTurns) + '</b></div>' +
      '</div>';
    }).join('');
    app.el.enemies.innerHTML = html || '<div class="benemies__empty">此处无物。</div>';
    app.enemySig = enemySig();
  }

  function traitLine(enemy) {
    var first = (enemy.traits || [])[0];
    var txt = traitText(first);
    if ((enemy.traits || []).length > 1) txt += ' 等';
    return txt;
  }

  function syncEnemies() {
    if (!app.state) return;
    if (enemySig() !== app.enemySig) { renderEnemies(); return; }
    app.state.enemies.forEach(function (e) {
      var root = $('.enemy[data-enemy-uid="' + e.uid + '"]', app.root);
      if (!root) return;
      var dead = !e.alive || num(e.pollution) <= 0;
      root.classList.toggle('is-dead', dead);
      root.classList.toggle('is-sealed', num(e.sealTurns) > 0);
      var bar = $('[data-part="bar"]', root);
      var numEl = $('[data-part="num"]', root);
      var seal = $('[data-part="seal"]', root);
      var intent = $('[data-part="intent"]', root);
      var traits = $('[data-part="traits"]', root);
      if (bar) bar.style.width = clamp((num(e.pollution) / Math.max(1, num(e.maxPollution))) * 100, 0, 100) + '%';
      if (numEl) numEl.textContent = num(e.pollution);
      if (seal) {
        seal.hidden = num(e.sealTurns) <= 0;
        var b = $('b', seal);
        if (b) b.textContent = num(e.sealTurns);
      }
      var it = enemyIntent(e);
      if (intent) intent.textContent = '意图 · ' + it.text;
      if (traits) traits.textContent = traitLine(e);
    });
  }

  /* ---------- 战报日志 ---------- */

  function appendLog() {
    var st = app.state;
    var ol = app.el.log;
    if (!ol || !st) return;
    var log = st.log || [];
    if (log.length < app.logCount) {
      ol.innerHTML = '';
      app.logCount = 0;
    }
    for (var i = app.logCount; i < log.length; i++) {
      var item = log[i] || {};
      var li = document.createElement('li');
      li.className = 'blog__item blog__item--' + (item.kind || 'info');
      var t = item.turn ? '<span class="blog__turn">' + num(item.turn) + '</span>' : '<span class="blog__turn">·</span>';
      li.innerHTML = t + '<span class="blog__text">' + esc(item.text || '') + '</span>';
      ol.appendChild(li);
    }
    app.logCount = log.length;
    /* 超限裁剪时必须同步回退计数器，使「计数器 == DOM 条数」恒成立；
       否则长战局里计数器停在高位、日志长度一回落就触发全量重绘闪烁 */
    while (ol.children.length > LOG_DOM_MAX) {
      ol.removeChild(ol.firstChild);
      if (app.logCount > 0) app.logCount -= 1;
    }
    ol.scrollTop = ol.scrollHeight;
  }

  function updateEndTurnState() {
    var btn = $('.btn-end', app.root);
    if (!btn || !app.state) return;
    var won = app.state.phase !== 'battle';
    btn.disabled = won;
    btn.classList.toggle('is-disabled', won);
  }

  /* ============================== 手牌 ============================== */

  function evalCard(handIndex) {
    var out = {
      idx: handIndex, def: null, playable: false, useMuddy: false,
      reason: '', cost: null, redHalf: false, muddyHalf: false,
      cutoffPool: null, tags: [], needsMuddy: false, target: 'none'
    };
    var st = app.state;
    if (!st || !st.hand) return out;
    var inst = st.hand[handIndex];
    if (!inst) return out;
    var def = cardDef(inst.id);
    out.def = def;
    if (!def) { out.reason = '牌面缺失'; return out; }
    out.target = def.target || 'none';
    try {
      var E = engine();
      var c0 = E.canPlay(st, handIndex, { useMuddy: false });
      var c1 = null;
      if (!c0 || c0.ok !== true) c1 = E.canPlay(st, handIndex, { useMuddy: true });
      if (c0 && c0.ok === true) {
        out.playable = true; out.cost = c0.cost || resolveCostOf(def, st, false); out.useMuddy = false;
      } else if (c1 && c1.ok === true) {
        out.playable = true; out.cost = c1.cost || resolveCostOf(def, st, true); out.useMuddy = true; out.needsMuddy = true;
      } else {
        out.cost = (c0 && c0.cost) || resolveCostOf(def, st, false);
        out.reason = (c0 && c0.reason) || '不可打出';
      }
    } catch (e) {
      out.reason = '结算异常';
    }
    var cost = out.cost || {};
    var byPool = cost.byPool || def.cost || {};
    if (isAny(cost.muddyByPool)) { out.muddyHalf = true; out.tags.push('浊补'); }
    if (num(cost.warnPenalty) > 0) out.tags.push('警戒 +' + num(cost.warnPenalty));
    if (num(cost.discount) > 0) out.tags.push('折 -' + num(cost.discount));
    /* 红线减半 / 浊水减半提示 */
    var st2 = app.state;
    if (def.kind !== 'policy' && st2 && st2.pools[def.school] && num(st2.pools[def.school].water) < num(st2.pools[def.school].red) && !(st2.flags && st2.flags.ignoreRed)) {
      out.redHalf = true;
    }
    if (out.muddyHalf || out.redHalf) out.tags.push('效果减半');
    /* 断水预警 */
    if (out.playable && st2 && st2.pools) {
      Object.keys(byPool).forEach(function (k) {
        if (!out.cutoffPool && st2.pools[k] && num(st2.pools[k].water) - num(byPool[k]) <= 0) out.cutoffPool = k;
      });
    }
    return out;
  }

  function resolveCostOf(def, st, useMuddy) {
    try {
      var r = engine().resolveCost(st, def, { useMuddy: !!useMuddy });
      if (r) return r;
    } catch (e) {}
    return { total: sumCost(def && def.cost), byPool: clone((def && def.cost) || {}), muddyByPool: {}, warnPenalty: 0, discount: 0 };
  }

  function costHTML(cost, def) {
    var byPool = (cost && cost.byPool) || (def && def.cost) || {};
    var muddy = (cost && cost.muddyByPool) || {};
    var keys = POOL_KEYS.filter(function (k) { return byPool[k] != null && num(byPool[k]) > 0; });
    if (!keys.length) return '<span class="card__cost-free">无偿</span>';
    return keys.map(function (k) {
      var base = def && def.cost && def.cost[k] != null ? num(def.cost[k]) : null;
      var now = num(byPool[k]);
      var up = base != null && now > base;
      var down = base != null && now < base;
      var mud = num(muddy[k]);
      var tip = '基础 ' + (base == null ? now : base);
      if (up) tip += ' · 警戒线以下 +' + (now - base);
      if (down) tip += ' · 折扣 -' + (base - now);
      if (mud > 0) tip += ' · 浊水补足 ' + mud + ' 点（效果减半，浊气上涨）';
      return '<span class="cost cost--' + k + (up ? ' is-up' : '') + (down ? ' is-down' : '') + (mud > 0 ? ' has-muddy' : '') + '" title="' + esc(tip) + '">' +
        '<i class="cost__drop"></i><b>' + now + '</b><em>' + esc(poolShort(k)) + '</em>' +
        (mud > 0 ? '<i class="cost__muddy">浊</i>' : '') +
      '</span>';
    }).join('');
  }

  function cardHTML(ev, handIndex, isNew) {
    var def = ev.def;
    if (!def) return '';
    var school = def.school || 'cheng';
    var isPolicy = def.kind === 'policy' || school === 'policy';
    var cls = 'card' + (isPolicy ? ' card--policy' : ' card--school-' + school) +
      (ev.playable ? '' : ' is-disabled') +
      (isNew ? ' card--enter' : '');
    if (app.target && app.target.handIndex === handIndex) cls += ' is-targeting';
    var reason = '';
    if (!ev.playable) reason = '<span class="card__reason">' + esc(ev.reason || '不可打出') + '</span>';
    var tags = ev.tags.slice();
    if (ev.target === 'enemy') tags.push('选敌');
    else if (ev.target === 'pool') tags.push('选池');
    var tagsHTML = tags.length
      ? '<span class="card__tags">' + tags.map(function (t) { return '<i>' + esc(t) + '</i>'; }).join('') + '</span>'
      : '';
    var seal = esc(def.seal || '水');
    return '<button type="button" class="' + cls + '" data-act="card" data-idx="' + handIndex + '" ' +
      'title="' + esc(def.name + '：' + (def.text || '')) + '" ' +
      'aria-label="' + esc(def.name) + '，' + esc(def.text || '') + '">' +
      '<span class="card__wash" aria-hidden="true"></span>' +
      (isPolicy ? '<span class="card__redhead">制</span>' : '<span class="card__schoolbar"></span>') +
      '<span class="card__seal" aria-hidden="true">' + seal + '</span>' +
      '<span class="card__cost">' + costHTML(ev.cost, def) + '</span>' +
      '<span class="card__name' + (isPolicy ? ' card__name--v' : '') + '">' + esc(def.name) + '</span>' +
      '<span class="card__kind">' + esc(KIND_NAME[def.kind] || '咒术') + ' · ' + esc(schoolShort(school)) + '</span>' +
      '<span class="card__text">' + cardTextHTML(def.text || '') + '</span>' +
      tagsHTML + reason +
    '</button>';
  }

  function shortText(text) {
    return text.length > 76 ? text.slice(0, 75) + '…' : text;
  }
  /* 卡牌核心效果：把数值/效果词加粗，增强扫读 */
  function highlightCardText(text) {
    var t = esc(String(text == null ? '' : text));
    t = t.replace(/([+\-]?\d+(?:\.\d+)?\s*(?:点|回合|张|层|次|%|格))/g, '<b>$1</b>');
    t = t.replace(/([+\-]\s*\d+(?:\.\d+)?)/g, '<b>$1</b>');
    t = t.replace(/(净化|封印|护甲|上限|水量|伤害|驱散|回复|抽牌)/g, '<b>$1</b>');
    return t;
  }
  function cardTextHTML(text) { return highlightCardText(shortText(String(text == null ? '' : text))); }

  function renderHand() {
    var st = app.state;
    var hand = app.el.hand;
    if (!hand || !st) return;
    var uids = {};
    var html = '';
    (st.hand || []).forEach(function (inst, i) {
      var isNew = !app.handUids[inst.uid];
      uids[inst.uid] = true;
      html += cardHTML(evalCard(i), i, isNew);
    });
    if (!html) html = '<div class="bhand__empty">手牌已尽。结束回合，待水脉补给。</div>';
    hand.innerHTML = html;
    app.handUids = uids;
    syncTargetClasses();
    if (app.popIndex != null && !st.hand[app.popIndex]) hidePopover();
  }

  function updateHandHint() {
    var el = app.el.handHint;
    if (!el) return;
    if (app.target) {
      el.innerHTML = '<span class="hint--cinnabar">' + (app.target.type === 'enemy' ? '选择怪物' : '选择水盂') + ' · Esc 取消</span>';
    } else {
      el.textContent = '点手牌出牌';
    }
  }

  /* ============================== 卡牌详情浮层 ============================== */

  function showPopover(handIndex, anchor) {
    var st = app.state;
    if (!st || !st.hand[handIndex]) return;
    var ev = evalCard(handIndex);
    var def = ev.def;
    if (!def) return;
    var pop = app.el.pop;
    if (!pop || !anchor) return;
    app.popIndex = handIndex;
    var cost = ev.cost || {};
    var byPool = cost.byPool || def.cost || {};
    var costLines = POOL_KEYS.filter(function (k) { return byPool[k] != null && num(byPool[k]) > 0; }).map(function (k) {
      var base = def.cost && def.cost[k] != null ? num(def.cost[k]) : null;
      var extra = base != null && num(byPool[k]) !== base ? (num(byPool[k]) > base ? '（+' + (num(byPool[k]) - base) + '）' : '（-' + (base - num(byPool[k])) + '）') : '';
      return '<li><span>' + esc(poolName(k)) + '</span><b>' + num(byPool[k]) + '</b><em>' + extra + '</em></li>';
    }).join('');
    if (!costLines) costLines = '<li><span>无需取水</span><b>0</b><em></em></li>';
    var muddyLines = '';
    if (isAny(cost.muddyByPool)) {
      muddyLines = POOL_KEYS.filter(function (k) { return num(cost.muddyByPool && cost.muddyByPool[k]) > 0; }).map(function (k) {
        return '<li class="is-warn"><span>' + esc(poolName(k)) + ' 浊水补足</span><b>' + num(cost.muddyByPool[k]) + '</b><em>效果减半 · 浊气涨</em></li>';
      }).join('');
    }
    var stateLine = ev.playable
      ? '<span class="pop__ok">可以打出</span>'
      : '<span class="pop__no">' + esc(ev.reason || '不可打出') + '</span>';
    var effects = (def.effects || []).map(function (ef) { return effectText(ef); }).filter(Boolean).join('；');
    var halve = '';
    if (ev.redHalf) halve += '<span class="pop__token is-red">红线以下 · 效果 ×0.5</span>';
    if (ev.muddyHalf) halve += '<span class="pop__token is-red">浊水施术 · 效果 ×0.5</span>';
    if (ev.cutoffPool) halve += '<span class="pop__token is-bad">此举将使' + esc(poolName(ev.cutoffPool)) + '断水</span>';
    pop.innerHTML =
      '<div class="pop__head">' +
        '<span class="pop__kind">' + esc(KIND_NAME[def.kind] || '咒术') + ' · ' + esc(schoolName(def.school)) + '</span>' +
        '<span class="pop__seal">' + esc(def.seal || '水') + '</span>' +
        '<h3 class="pop__name">' + esc(def.name) + '</h3>' +
      '</div>' +
      '<ul class="pop__cost">' + costLines + muddyLines + '</ul>' +
      '<p class="pop__text">' + highlightCardText(effects || def.text || '') + '</p>' +
      '<p class="pop__flavor">' + esc(def.flavor || '') + '</p>' +
      '<div class="pop__tokens">' + halve + '</div>' +
      '<div class="pop__foot">' + stateLine +
        (ev.playable && ev.target === 'none' ? '<button type="button" class="pop__play" data-act="play-card" data-idx="' + handIndex + '">打出</button>' : '') +
        (ev.playable && ev.target !== 'none' ? '<span class="pop__tip">' + (ev.target === 'enemy' ? '点怪物以施术' : '点水盂以施术') + '</span>' : '') +
      '</div>';
    pop.hidden = false;
    requestAnimationFrame(function () {
      if (!pop || !anchor) return;
      var rect = anchor.getBoundingClientRect();
      var pw = pop.offsetWidth || 280;
      var ph = pop.offsetHeight || 240;
      var left = rect.left + rect.width / 2 - pw / 2;
      left = clamp(left, 12, Math.max(12, window.innerWidth - pw - 12));
      var top = rect.top - ph - 12;
      if (top < 66) top = Math.min(window.innerHeight - ph - 12, rect.bottom + 12);
      pop.style.left = left + 'px';
      pop.style.top = Math.max(12, top) + 'px';
    });
  }

  function hidePopover() {
    var pop = app.el.pop;
    if (pop) pop.hidden = true;
    app.popIndex = null;
  }

  function closePopover() { hidePopover(); }

  function effectText(ef) {
    if (!ef) return '';
    if (ef.type === 'purify') return (ef.target === 'all' ? '净化全部 ' : '净化 ') + num(ef.amount) + ' 点';
    if (ef.type === 'cleanse') return '净化' + (ef.pool === 'all' ? '四池' : poolName(ef.pool)) + '浊水 ' + num(ef.amount);
    if (ef.type === 'shield') return '护甲 +' + num(ef.amount);
    if (ef.type === 'seal') return '封印 ' + num(ef.turns) + ' 回合';
    if (ef.type === 'debuff') return '怪物干扰 ' + num(ef.amount) + '，' + num(ef.turns) + ' 回合';
    if (ef.type === 'draw') return '抽 ' + num(ef.amount) + ' 张';
    if (ef.type === 'addWater') return poolName(ef.pool) + '水 +' + num(ef.amount);
    if (ef.type === 'addMuddy') return poolName(ef.pool) + '浊水 +' + num(ef.amount);
    if (ef.type === 'addMax') return poolName(ef.pool) + '上限 ' + (num(ef.amount) > 0 ? '+' : '') + num(ef.amount);
    if (ef.type === 'moveMax') return poolName(ef.from) + '上限 -' + num(ef.amount) + '，' + poolName(ef.to) + '上限 +' + num(ef.amount);
    if (ef.type === 'reducePollutionCap') return '怪物污染上限 -' + num(ef.amount);
    if (ef.type === 'discountNext') return '下张牌费用 -' + num(ef.amount);
    if (ef.type === 'flag') {
      if (ef.key === 'ignoreRed') return '本回合不受红线减半';
      if (ef.key === 'halfCost') return '费用减半';
      return FLAG_NAMES[ef.key] ? ('制度：' + FLAG_NAMES[ef.key]) : '另立制度';
    }
    if (ef.type === 'polluteAll') return '全部怪物污染 +' + num(ef.amount);
    return '';
  }

  /* ============================== 目标选择 ============================== */

  function setTargeting(handIndex, type) {
    app.target = { handIndex: handIndex, type: type };
    syncTargetClasses();
    updateHandHint();
    var cardEl = $('.card[data-idx="' + handIndex + '"]', app.root);
    if (cardEl) showPopover(handIndex, cardEl);
  }

  function cancelTarget() {
    if (!app.target) return;
    app.target = null;
    syncTargetClasses();
    updateHandHint();
    hidePopover();
  }

  function syncTargetClasses() {
    var screen = $('.screen--battle', app.root);
    if (!screen) return;
    screen.classList.toggle('is-targeting-enemy', !!(app.target && app.target.type === 'enemy'));
    screen.classList.toggle('is-targeting-pool', !!(app.target && app.target.type === 'pool'));
    $$('.card', screen).forEach(function (c) {
      c.classList.toggle('is-targeting', !!app.target && num(c.dataset.idx) === app.target.handIndex);
    });
  }

  /* ============================== 出牌 ============================== */

  function onCardClick(handIndex) {
    var st = app.state;
    if (!st || st.phase !== 'battle') { toast('战局已定', 'info'); return; }
    if (app.target && app.target.handIndex === handIndex) {
      /* 再点同一张：目标唯一则直接打出 */
      var alive = st.enemies.filter(function (e) { return e.alive && num(e.pollution) > 0; });
      if (app.target.type === 'enemy' && alive.length === 1) {
        doPlay(handIndex, { enemyUid: alive[0].uid, useMuddy: evalCard(handIndex).useMuddy });
        return;
      }
      if (app.target.type === 'pool') {
        toast('请选择一座水盂', 'info');
        return;
      }
      if (app.target.type === 'enemy') { toast('请选择一名怪物', 'info'); return; }
    }
    var ev = evalCard(handIndex);
    if (!ev.playable) { toast(ev.reason || '不可打出', 'warn'); return; }
    if (ev.target === 'none') {
      tryPlay(handIndex, { useMuddy: ev.useMuddy });
      return;
    }
    setTargeting(handIndex, ev.target);
    toast(ev.target === 'enemy' ? '选择一名怪物' : '选择一座水盂', 'info');
  }

  function tryPlay(handIndex, opts) {
    var ev = evalCard(handIndex);
    if (!ev.playable) { toast(ev.reason || '不可打出', 'warn'); return; }
    var o = opts || {};
    /* 借浊水须先确认（效果减半 + 浊气上涨），断水须再确认（本日即败）；
       两级确认依次弹出，确认结果记在 opts 上，避免重复弹窗 */
    if (ev.needsMuddy && !o.muddyConfirmed) { showMuddyConfirm(handIndex, o); return; }
    if (ev.cutoffPool && !o.cutoffConfirmed) { showCutoffConfirm(ev.cutoffPool, handIndex, o); return; }
    var final = clone(o);
    if (final.useMuddy == null) final.useMuddy = !!ev.useMuddy;
    doPlay(handIndex, final);
  }

  function showMuddyConfirm(handIndex, opts) {
    var ev = evalCard(handIndex);
    var muddy = 0;
    var m = (ev.cost && ev.cost.muddyByPool) || {};
    Object.keys(m).forEach(function (k) { muddy += num(m[k]); });
    var pools = Object.keys(m).filter(function (k) { return num(m[k]) > 0; }).map(poolName).join('、');
    app.pendingPlay = { handIndex: handIndex, opts: opts || {} };
    openModal(
      '<div class="modal__head">' +
        '<span class="modal__kicker">朱批 · 借浊</span>' +
        '<h2>清水不足</h2>' +
        '<p class="modal__prompt">清水不够施术，须自' + (pools ? esc(pools) : '池中') + '借浊水 ' + muddy + ' 点。</p>' +
      '</div>' +
      '<div class="cutoff">' +
        '<p>仍要打出《' + esc((ev.def || {}).name || '此牌') + '》？</p>' +
        '<p class="cutoff__warn">借浊 ' + muddy + ' 点：此牌效果减半，且浊气上涨。</p>' +
      '</div>' +
      '<div class="modal__actions">' +
        '<button type="button" class="btn btn--ghost" data-act="modal-close">收回</button>' +
        '<button type="button" class="btn btn--danger" data-act="muddy-yes">借浊打出</button>' +
      '</div>',
      'modal--cutoff modal--muddy'
    );
  }

  function showCutoffConfirm(poolKey, handIndex, opts) {
    app.pendingPlay = { handIndex: handIndex, opts: opts || {} };
    openModal(
      '<div class="modal__head">' +
        '<span class="modal__kicker">朱批 · 断水</span>' +
        '<h2>此举将断水</h2>' +
        '<p class="modal__prompt">打出此牌后，' + esc(poolName(poolKey)) + '水量将见底。断水即刻，全城皆停。</p>' +
      '</div>' +
      '<div class="cutoff">' +
        '<p>仍要打出《' + esc((evalCard(handIndex).def || {}).name || '此牌') + '》？</p>' +
        '<p class="cutoff__warn">水脉中断，本日即败。</p>' +
      '</div>' +
      '<div class="modal__actions">' +
        '<button type="button" class="btn btn--ghost" data-act="modal-close">收回</button>' +
        '<button type="button" class="btn btn--danger" data-act="cutoff-yes">仍要打出</button>' +
      '</div>',
      'modal--cutoff'
    );
  }

  function doPlay(handIndex, opts) {
    var st = app.state;
    if (!st) return;
    opts = opts || {};
    var inst = st.hand[handIndex];
    if (!inst) return;
    var cardEl = $('.card[data-idx="' + handIndex + '"]', app.root);
    var srcRect = cardEl ? cardEl.getBoundingClientRect() : null;
    var targetEl = null;
    if (opts.enemyUid) targetEl = $('.enemy[data-enemy-uid="' + opts.enemyUid + '"]', app.root);
    else if (opts.pool) targetEl = $('.pool--' + opts.pool, app.root);
    var r;
    try { r = engine().playCard(st, handIndex, opts); }
    catch (e) { toast('水脉紊乱：' + ((e && e.message) || e), 'bad'); return; }
    if (!r || !r.ok) { toast((r && r.error) || '不可打出', 'warn'); return; }
    sfx('pluck');
    app.target = null;
    hidePopover();
    syncBattle();
    if (srcRect && targetEl) inkSplash(srcRect, targetEl.getBoundingClientRect());
    playEvents(r.events);
    appendLog();
    afterAction();
  }

  function onEnemyClick(uid) {
    if (app.target && app.target.type === 'enemy') {
      var idx = app.target.handIndex;
      var ev = evalCard(idx);
      var opts = { enemyUid: uid, useMuddy: ev.useMuddy };
      app.target = null;
      tryPlay(idx, opts);
      return;
    }
    showEnemyDetail(uid);
  }

  function onPoolClick(key) {
    if (app.target && app.target.type === 'pool') {
      var idx = app.target.handIndex;
      var ev = evalCard(idx);
      app.target = null;
      tryPlay(idx, { pool: key, useMuddy: ev.useMuddy });
      return;
    }
    showPoolDetail(key);
  }

  /* ---------- 敌方 / 池详情 ---------- */

  function showEnemyDetail(uid) {
    var st = app.state;
    if (!st) return;
    var e = null;
    st.enemies.forEach(function (x) { if (x.uid === uid) e = x; });
    if (!e) return;
    var traits = (e.traits || []).map(function (t) { return '<li>' + esc(traitText(t)) + '</li>'; }).join('');
    var intent = enemyIntent(e);
    openModal(
      '<div class="modal__head">' +
        '<span class="modal__kicker">' + (e.isClone ? '分身' : '怪物') + '</span>' +
        '<h2>' + esc(e.name) + '</h2>' +
        '<p class="modal__prompt">' + esc(e.subtitle || '') + '</p>' +
      '</div>' +
      '<div class="detail">' +
        '<div class="detail__art">' + artEnemy(e.art || e.id) + '</div>' +
        '<div class="detail__body">' +
          '<div class="detail__stat"><span>污染值</span><b>' + num(e.pollution) + '</b><em>/' + num(e.maxPollution) + '</em></div>' +
          '<div class="detail__stat"><span>封印</span><b>' + (num(e.sealTurns) > 0 ? num(e.sealTurns) + ' 回合' : '无') + '</b></div>' +
          '<div class="detail__stat"><span>当前意图</span><b class="is-ink">' + esc(intent.text) + '</b></div>' +
          (traits ? '<ul class="detail__traits">' + traits + '</ul>' : '') +
          '<p class="detail__desc">' + esc(e.desc || '') + '</p>' +
          '<p class="detail__flavor">' + esc(e.flavor || '') + '</p>' +
        '</div>' +
      '</div>',
      'modal--detail'
    );
  }

  function showPoolDetail(key) {
    var st = app.state;
    if (!st) return;
    var info;
    try { info = engine().poolInfo(st, key); } catch (e) { return; }
    var meta = poolMeta(key);
    var rows = [
      ['水量', num(info.water) + ' / ' + num(info.cap)],
      ['清水', num(info.clean)],
      ['浊水', num(info.muddy)],
      ['有效上限', num(info.effCap) + (num(info.occupied) || num(info.seal) ? '（占用 ' + num(info.occupied) + ' · 封 ' + num(info.seal) + '）' : '')],
      ['警戒线', num(info.warn)],
      ['红线', num(info.red)],
      ['溢出', num(info.overflow)]
    ];
    openModal(
      '<div class="modal__head">' +
        '<span class="modal__kicker">水盂</span>' +
        '<h2>' + esc(meta.name || key) + '</h2>' +
        '<p class="modal__prompt">' + esc(meta.desc || '') + '</p>' +
      '</div>' +
      '<div class="detail">' +
        '<div class="detail__body detail__body--wide">' +
          '<dl class="detail__dl">' + rows.map(function (r) {
            return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(String(r[1])) + '</dd></div>';
          }).join('') + '</dl>' +
          '<p class="detail__desc">水量 ≤ 0 即断水；低于红线，本系咒术效果减半；低于警戒线，取水加价 1 点。</p>' +
        '</div>' +
      '</div>',
      'modal--detail'
    );
  }

  /* ============================== 水权调剂 ============================== */

  function pickTransferFrom() {
    var st = app.state;
    var best = 'cheng', bestClean = -1;
    POOL_KEYS.forEach(function (k) {
      var p = st.pools[k];
      var clean = num(p.water) - num(p.muddy);
      if (clean > bestClean) { bestClean = clean; best = k; }
    });
    return best;
  }
  function pickTransferTo(from) {
    var st = app.state;
    var best = null, bestRatio = 2;
    POOL_KEYS.forEach(function (k) {
      if (k === from) return;
      var p = st.pools[k];
      var ratio = num(p.cap) > 0 ? num(p.water) / num(p.cap) : 1;
      if (ratio < bestRatio) { bestRatio = ratio; best = k; }
    });
    return best || (from === 'cheng' ? 'di' : 'cheng');
  }

  function openTransferModal(presetFrom) {
    if (app.screen !== 'battle' || !app.state || app.state.phase !== 'battle') return;
    var from = presetFrom || pickTransferFrom();
    app.transfer = { from: from, to: pickTransferTo(from), amount: 3, mode: 'plan' };
    renderTransferModal();
  }

  function transferPreview() {
    var t = app.transfer || { from: 'cheng', to: 'di', amount: 3, mode: 'plan' };
    var st = app.state || { pools: {}, transfersLeft: 0 };
    var from = st.pools[t.from] || { water: 0, muddy: 0, warn: 0 };
    var to = st.pools[t.to] || { water: 0, muddy: 0, warn: 0 };
    var mode = t.mode === 'urgent' ? 'urgent' : 'plan';
    var amount = clamp(num(t.amount), 1, mode === 'urgent' ? 12 : 5);
    var loss = 0.3;
    if (mode === 'urgent') loss = 0.5;
    else if (num(from.water) > num(from.warn) && num(to.water) > num(to.warn)) loss = 0.1;
    var received = Math.max(0, Math.floor(amount * (1 - loss)));
    var toInfo = { effCap: num(to.cap) };
    try { toInfo = engine().poolInfo(st, t.to); } catch (e) {}
    var room = Math.max(0, num(toInfo.effCap) - num(to.water));
    var actual = Math.min(received, room);
    var spill = received - actual;
    var clean = num(from.water) - num(from.muddy);
    var reasons = [];
    if (t.from === t.to) reasons.push('不可同池调剂');
    if (num(st.transfersLeft) <= 0) reasons.push('今日调剂额度已尽');
    if (clean < amount) reasons.push('清水不足 ' + amount + ' 点');
    if (mode === 'plan' && amount > 5) reasons.push('计划调剂单次至多 5 点');
    if (mode === 'urgent' && amount > 12) reasons.push('紧急调剂单次至多 12 点');
    return {
      mode: mode, amount: amount, loss: loss, received: received, actual: actual, spill: spill,
      clean: clean, ok: reasons.length === 0, reasons: reasons
    };
  }

  function renderTransferModal() {
    var st = app.state;
    if (!st) return;
    var t = app.transfer;
    /* 模式切换后滑杆 max 变化（plan=5 / urgent=12），先把内部 amount 夹到当前模式区间，
       避免 UI 显示值与内部状态短暂不一致 */
    t.amount = clamp(num(t.amount), 1, t.mode === 'urgent' ? 12 : 5);
    var pv = transferPreview();
    function chips(which) {
      return POOL_KEYS.map(function (k) {
        var p = st.pools[k];
        var active = t[which] === k;
        var info = null;
        try { info = engine().poolInfo(st, k); } catch (e) {}
        return '<button type="button" class="chip' + (active ? ' is-on' : '') + '" data-act="tr-' + which + '" data-k="' + k + '">' +
          '<span class="chip__short">' + esc(poolShort(k)) + '</span>' +
          '<span class="chip__name">' + esc(poolName(k)) + '</span>' +
          '<span class="chip__num">' + num(info && info.water) + '/' + num(info && info.cap) + '</span>' +
        '</button>';
      }).join('');
    }
    var maxAmount = pv.mode === 'urgent' ? 12 : 5;
    openModal(
      '<div class="modal__head">' +
        '<span class="modal__kicker">水权调剂</span>' +
        '<h2>调此补彼</h2>' +
        '<p class="modal__prompt">只调清水。计划损耗三成（两池皆在警戒线之上时一成）；紧急损耗五成。今日余 ' + num(st.transfersLeft) + ' 次。</p>' +
      '</div>' +
      '<div class="transfer">' +
        '<div class="transfer__row"><span class="transfer__label">自</span><div class="transfer__chips">' + chips('from') + '</div></div>' +
        '<div class="transfer__row"><span class="transfer__label">至</span><div class="transfer__chips">' + chips('to') + '</div></div>' +
        '<div class="transfer__amount">' +
          '<div class="transfer__amount-head"><span>调剂数量</span><b id="tr-amount">' + pv.amount + '</b><em>点</em></div>' +
          '<input type="range" min="1" max="' + maxAmount + '" value="' + pv.amount + '" data-act="tr-range" aria-label="调剂数量">' +
          '<div class="transfer__amount-ticks"><span>1</span><span>' + maxAmount + '</span></div>' +
        '</div>' +
        '<div class="transfer__modes">' +
          '<button type="button" class="mode' + (pv.mode === 'plan' ? ' is-on' : '') + '" data-act="tr-mode" data-mode="plan"><b>计划调剂</b><small>损耗 ' + (pv.mode === 'plan' ? Math.round(pv.loss * 100) + '%' : '30% / 10%') + '</small></button>' +
          '<button type="button" class="mode' + (pv.mode === 'urgent' ? ' is-on' : '') + '" data-act="tr-mode" data-mode="urgent"><b>紧急调剂</b><small>损耗 50%</small></button>' +
        '</div>' +
        '<div class="transfer__preview">' +
          '<div><span>损耗</span><b>' + (pv.amount - pv.received) + '</b></div>' +
          '<div><span>实到</span><b>' + pv.actual + '</b></div>' +
          '<div><span>溢出</span><b class="' + (pv.spill > 0 ? 'is-bad' : '') + '">' + pv.spill + '</b></div>' +
        '</div>' +
        (pv.spill > 0 ? '<p class="transfer__warn">受池将溢出 ' + pv.spill + ' 点，溢出即成浊气。</p>' : '') +
        (!pv.ok ? '<p class="transfer__warn is-bad">' + esc(pv.reasons.join('；')) + '</p>' : '') +
      '</div>' +
      '<div class="modal__actions">' +
        '<button type="button" class="btn btn--ghost" data-act="modal-close">收回</button>' +
        '<button type="button" class="btn btn--ink" data-act="tr-confirm"' + (pv.ok ? '' : ' disabled') + '>下调令</button>' +
      '</div>',
      'modal--transfer'
    );
  }

  function updateTransferModalValues() {
    var pv = transferPreview();
    var amountEl = $('#tr-amount');
    if (amountEl) amountEl.textContent = pv.amount;
    var preview = $('.transfer__preview', app.overlay);
    if (preview) {
      preview.innerHTML =
        '<div><span>损耗</span><b>' + (pv.amount - pv.received) + '</b></div>' +

  function confirmTransfer() {
    var t = app.transfer;
    if (!t || !app.state) return;
    var pv = transferPreview();
    if (!pv.ok) { toast(pv.reasons.join('；'), 'warn'); return; }
    var r;
    try { r = engine().transfer(app.state, { from: t.from, to: t.to, amount: pv.amount, mode: pv.mode }); }
    catch (e) { toast('水脉紊乱：' + ((e && e.message) || e), 'bad'); return; }
    if (!r || !r.ok) { toast((r && r.error) || '调剂不成', 'warn'); return; }
    closeModal();
    syncBattle();
    playEvents(r.events);
    appendLog();
    afterAction();

  /* ============================== 结束回合 / 胜负流转 ============================== */

  function endTurn() {
    var st = app.state;
    if (!st || st.phase !== 'battle') return;
    cancelTarget();
    hidePopover();
    sfx('knock');
    var r;
    try { r = engine().endTurn(st); }
    catch (e) { toast('水脉紊乱：' + ((e && e.message) || e), 'bad'); return; }
    if (!r || !r.ok) { toast((r && r.error) || '回合未能结束', 'warn'); return; }
    syncBattle();
    playEvents(r.events);
    appendLog();
    afterAction();
  }

  function afterAction() {
    syncBattle();
    var st = app.state;
    if (!st) return;
    if (st.phase === 'won' && !app.phaseHandled) {
      app.phaseHandled = true;
      setTimeout(function () { if (app.screen === 'battle' && app.state && app.state.phase === 'won') winBattle(); }, 820);
    } else if (st.phase === 'lost' && !app.phaseHandled) {
      app.phaseHandled = true;
      setTimeout(function () { if (app.screen === 'battle' && app.state && app.state.phase === 'lost') loseBattle(); }, 980);
    }
  }

  function summarizeSafe(st) {
    if (!st) return { cleanTotal: 0, muddyTotal: 0, pollutionTotal: 0 };
    try {
      var s = engine().summarize(st);
      if (s) return s;
    } catch (e) {}
    var clean = 0, muddy = 0, pollution = 0;
    POOL_KEYS.forEach(function (k) {
      var info = null;
      try { info = engine().poolInfo(st, k); } catch (e) { info = null; }
      if (info) { clean += num(info.clean); muddy += num(info.muddy); }
    });
    (st.enemies || []).forEach(function (e) { if (e.alive) pollution += num(e.pollution); });
    return { cleanTotal: clean, muddyTotal: muddy, pollutionTotal: pollution, muddyRatio: clean + muddy > 0 ? muddy / (clean + muddy) : 0 };
  }

  function winBattle() {
    var st = app.state;
    if (!st) return;
    var stats = summarizeSafe(st);
    var carry;
    try { carry = engine().finishBattle(st); } catch (e) { carry = clone(app.carry || emptyCarry()); carry.day = app.day + 1; }
    if (!carry || typeof carry !== 'object') carry = clone(app.carry || emptyCarry());
    var day = dayData(app.day) || {};
    app.finalState = st;
    app.result = {
      kind: 'battle', state: st, stats: stats, day: app.day,
      startCarry: clone(app.carry),
      carry: carry, choice: day.choice || null,
      phase: 'choice', chosen: null, reply: '', log: []
    };
    app.carry = carry;
    app.screen = 'result';
    hidePopover();
    closeModal();
    stampFX('准');
    renderResult();
    updateDebug();
  }

  function loseBattle() {
    var st = app.state;
    if (!st) return;
    var reason = 'cutoff', pool = null;
    try {
      var cs = engine().checkStatus(st);
      if (cs && cs.reason) { reason = cs.reason; pool = cs.pool || null; }
    } catch (e) {}
    if (reason !== 'cutoff' && reason !== 'timeout') {
      reason = 'timeout';
      POOL_KEYS.forEach(function (k) { if (st.pools[k] && num(st.pools[k].water) <= 0 && !pool) { reason = 'cutoff'; pool = k; } });
    }
    app.loseInfo = { reason: reason, pool: pool };
    app.screen = 'lose';
    inkFlood();
    sfx('thud');
    renderLose();
    updateDebug();
  }

  function renderLose() {
    var day = dayData(app.day) || {};
    var info = app.loseInfo || { reason: 'cutoff' };
    var reasonText = info.reason === 'cutoff'
      ? ((info.pool ? poolName(info.pool) + '见底，' : '') + '水脉中断，全城皆停。')
      : '期限已过，浊气未压至红线以下。';
    app.root.innerHTML =
      '<div class="screen screen--lose">' +
        '<div class="screen__paper" aria-hidden="true"><i class="ds-corner ds-corner--tl"></i><i class="ds-corner ds-corner--tr"></i><i class="ds-corner ds-corner--bl"></i><i class="ds-corner ds-corner--br"></i></div>' +
        '<div class="lose__wash" aria-hidden="true"></div>' +
        '<div class="lose__stage">' +
          '<article class="doc doc--lose">' +
            '<header class="doc__head">' +
              '<div class="doc__redhead is-bad">介休县水脉调度司 · 驳文</div>' +
              '<div class="doc__meta"><span>第' + cnDay(app.day) + '日 · ' + esc(day.chapter || '') + '</span><span class="doc__no">驳回</span></div>' +
            '</header>' +
            '<div class="doc__body">' +
              '<h1 class="doc__title">' + (info.reason === 'cutoff' ? '断水' : '逾期') + '</h1>' +
              '<p class="doc__sub">' + esc(reasonText) + '</p>' +
              '<p class="lose__outro">' + esc(day.outroLose || '水没保住。') + '</p>' +
              '<p class="lose__annotation"><span class="brief__mark">批</span>未达标。着即重办。</p>' +
            '</div>' +
            '<footer class="doc__foot doc__foot--center">' +
              '<div class="lose__actions">' +
                '<button type="button" class="btn btn--ghost" data-act="menu">返回主菜单</button>' +
                '<button type="button" class="btn btn--ink" data-act="retry">重试本日</button>' +
              '</div>' +
            '</footer>' +
          '</article>' +
          '<div class="lose__stamp">' + artStamp('驳') + '</div>' +
        '</div>' +
      '</div>';
  }

  function retryDay() {
    if (app.snapshot && app.snapshot.carry) {
      app.carry = clone(app.snapshot.carry);
      app.carry.day = app.day;
      /* 重试另起牌序：默认种子是固定的（12345 + (日-1)*1000），
         若不换种子，重试会抽到完全一样的手牌，"再抽一次"无从谈起。
         QA 用 ?seed= 锁定时保持可复现。 */
      var opts = gameOptions();
      if (app.seed == null) opts.seed = freshSeed();
      var r = null;
      try { r = engine().createGame(app.day, app.carry, opts); } catch (e) {}
      if (r && r.ok) {
        app.state = r.state;
        app.finalState = null;
        var day = dayData(app.day) || {};
        toast(app.seed == null ? '回到本日起点 · 另起一副牌' : '回到本日起点', 'info');
        /* 与 briefGo 同构：有赴任前抉择的日子先弹抉择 */
        if (day.preChoice) {
          app.pendingPreChoice = { choice: day.preChoice, optionId: null };
          showPreChoiceModal();
        } else {
          startBattleFromState();
        }
        return;
      }
    }
    startDay(app.day);
  }

  /* 新种子：不写入 app.seed，避免污染后续日子的默认种子 */
  var _seedTick = 0;
  function freshSeed() {
    _seedTick += 1;
    return ((Date.now() & 0x7fffffff) ^ (_seedTick * 2654435761)) | 0;
  }

  /* ============================== 结算 + 核心抉择 ============================== */

  function carryDeltaText(startCarry, nowCarry) {
    var a = startCarry || emptyCarry();
    var b = nowCarry || emptyCarry();
    var bits = [];
    var dd = num(b.debt) - num(a.debt);
    var dr = num(b.reserve) - num(a.reserve);
    var ds = num(b.score) - num(a.score);
    if (dd) bits.push('水债 ' + (dd > 0 ? '+' : '') + dd);
    if (dr) bits.push('蓄水 ' + (dr > 0 ? '+' : '') + dr);
    if (ds) bits.push('考绩 ' + (ds > 0 ? '+' : '') + ds);
    if (!bits.length) bits.push('水账持平');
    return bits.join(' · ');
  }

  function resultMetrics(r) {
    if (r.kind === 'negotiation') {
      return [
        ['会商', (r.log || []).length + ' 席'],
        ['水债', num(app.carry && app.carry.debt)],
        ['蓄水', num(app.carry && app.carry.reserve)],
        ['考绩', num(app.carry && app.carry.score)]
      ];
    }
    var st = r.state || {};
    var poll = 0;
    (st.enemies || []).forEach(function (e) { if (e.alive) poll += num(e.pollution); });
    return [
      ['净除污染', num(st.stats && st.stats.purified)],
      ['余浊气', poll],
      ['本日耗水', num(st.waterSpent)],
      ['用兵回合', num(st.turn)]
    ];
  }

  function renderResult() {
    var r = app.result;
    if (!r) { showMenu(); return; }
    app.screen = 'result';
    var day = dayData(r.day) || {};
    var metrics = resultMetrics(r).map(function (m) {
      return '<div class="report__cell"><span>' + esc(m[0]) + '</span><b>' + esc(String(m[1])) + '</b></div>';
    }).join('');
    var narr = '';
    if (r.kind === 'battle') {
      var s = r.stats || summarizeSafe(r.state);
      narr = '<p class="report__outro">' + esc(day.outroWin || '') + '</p>' +
        '<p class="report__line">剩余浊水 ' + num(s.muddyTotal) + ' 点 · 清水结余 ' + num(s.cleanTotal) + ' 点' +
        ' · 本日浊水占比 ' + Math.round(num(s.muddyRatio) * 100) + '%</p>';
    } else {
      narr = '<p class="report__outro">' + esc(day.outroWin || '四方会商已毕。') + '</p>' +
        '<p class="report__line">四席已过，水权账目如上。</p>';
    }
    var choice = r.choice;
    var choiceHTML = '';
    if (r.phase === 'chosen') {
      choiceHTML =
        '<div class="choice choice--done">' +
          '<span class="choice__kicker">已批示</span>' +
          '<blockquote class="choice__reply">' + esc(r.reply || '') + '</blockquote>' +
          (r.chosen ? '<p class="choice__picked">' + esc(r.chosen.label || '') + '</p>' : '') +
          '<div class="choice__next">' +
            '<button type="button" class="btn btn--ink" data-act="' + (r.day >= 7 ? 'result-ending' : 'result-next') + '">' +
              (r.day >= 7 ? '呈报结局' : '次日赴任') + '</button>' +
          '</div>' +
        '</div>';
    } else if (choice && choice.options && choice.options.length) {
      var opts = choice.options.map(function (o, i) {
        var no = ['壹', '贰', '叁', '肆', '伍', '陆'][i] || String(i + 1);
        return '<button type="button" class="choice__opt" data-act="choice" data-opt="' + esc(o.id) + '">' +
          '<span class="choice__no">' + no + '</span>' +
          '<span class="choice__label">' + esc(o.label) + '</span>' +
          '<span class="choice__detail">' + esc(o.detail || '') + '</span>' +
          '<span class="choice__go">批 示</span>' +
        '</button>';
      }).join('');
      choiceHTML =
        '<div class="choice">' +
          '<div class="choice__head">' +
            '<span class="choice__kicker">核心抉择</span>' +
            '<h2>' + esc(choice.title || '抉择') + '</h2>' +
            '<p>' + esc(choice.prompt || '') + '</p>' +
          '</div>' +
          '<div class="choice__opts">' + opts + '</div>' +
        '</div>';
    } else {
      choiceHTML =
        '<div class="choice choice--none">' +
          '<span class="choice__kicker">无核心抉择</span>' +
          '<p>本日无待批之事。</p>' +
          '<button type="button" class="btn btn--ink" data-act="' + (r.day >= 7 ? 'result-ending' : 'result-next') + '">' +
            (r.day >= 7 ? '呈报结局' : '次日赴任') + '</button>' +
        '</div>';
    }
    app.root.innerHTML =
      '<div class="screen screen--result">' +
        '<div class="screen__paper" aria-hidden="true"><i class="ds-corner ds-corner--tl"></i><i class="ds-corner ds-corner--tr"></i><i class="ds-corner ds-corner--bl"></i><i class="ds-corner ds-corner--br"></i></div>' +
        '<div class="result__stage">' +
          '<article class="doc doc--report">' +
            '<header class="doc__head">' +
              '<div class="doc__redhead">介休县水脉调度司 · ' + (r.kind === 'battle' ? '战报' : '谈判纪要') + '</div>' +
              '<div class="doc__meta"><span>第' + cnDay(r.day) + '日 · ' + esc(day.chapter || '') + '</span><span class="doc__no">' + (r.kind === 'battle' ? '报' : '议') + '</span></div>' +
            '</header>' +
            '<div class="doc__body">' +
              '<h1 class="doc__title">' + (r.kind === 'battle' ? '本日战报' : '四方纪要') + '</h1>' +
              '<div class="report__grid">' + metrics + '</div>' +
              narr +
              '<div class="report__carry"><span>跨日结算</span><b>' + esc(carryDeltaText(r.startCarry, app.carry)) + '</b></div>' +
            '</div>' +
            '<div class="report__stamp">' + artStamp(r.kind === 'battle' ? '准' : '议') + '</div>' +
          '</article>' +
          '<div class="result__side">' + choiceHTML + '</div>' +
        '</div>' +
      '</div>';
    updateDebug();
  }

  function describeCarryEffects(effects) {
    var bits = [];
    (effects || []).forEach(function (ef) {
      if (!ef) return;
      var amt = num(ef.amount);
      var sign = amt > 0 ? '+' : '';
      if (ef.type === 'maxDelta') { if (amt) bits.push(poolName(ef.pool) + '上限 ' + sign + amt); }
      else if (ef.type === 'debt') { bits.push('浊气之债 ' + sign + amt); }
      else if (ef.type === 'reserve') { bits.push('储备 ' + sign + amt); }
      else if (ef.type === 'score') { bits.push('考绩 ' + sign + amt); }
      else if (ef.type === 'flag') { bits.push('制度：' + (FLAG_NAMES[ef.key] || '一项制度安排')); }
      else if (ef.type === 'poolNow') { bits.push(poolName(ef.pool) + '水 ' + sign + amt); }
      else if (ef.type === 'enemyNow') {
        var en = null;
        try { en = content().enemies[ef.enemyId]; } catch (e) { en = null; }
        bits.push((en && en.name ? en.name : '怪物') + '污染 ' + sign + num(ef.pollution));
      }
    });
    return bits;
  }

  function chooseOption(optionId) {
    var r = app.result;
    if (!r || r.phase === 'chosen') return;
    var choice = r.choice;
    if (!choice) { toast('此日无抉择', 'info'); return; }
    var opt = null;
    (choice.options || []).forEach(function (o) { if (o.id === optionId) opt = o; });
    if (!opt) return;
    try {
      var res = engine().applyChoiceEffects(app.carry, opt.effects || []);
      if (res && res.carry) app.carry = res.carry;
    } catch (e) {
      toast('批文未落地：' + ((e && e.message) || e), 'bad');
    }
    var bits = describeCarryEffects(opt.effects || []);
    if (bits.length) toast(bits.join('；'), 'info');
    app.carry.choiceLog = (app.carry.choiceLog || []).concat([{ day: r.day, optionId: opt.id }]);
    r.phase = 'chosen';
    r.chosen = opt;
    r.reply = opt.reply || '……知道了。';
    stampFX(r.day >= 7 ? '结' : '准');
    renderResult();
    saveProgress();
  }

  function nextAfterResult() {
    var r = app.result;
    if (!r) { showMenu(); return; }
    if (r.day >= 7) { showEnding(); return; }
    startDay(r.day + 1);
  }

  /* ============================== 第 5 天 · 四方谈判 ============================== */

  function negotiationData(day) {
    if (day && day.negotiation) return day.negotiation;
    try { return content().negotiation || null; } catch (e) { return null; }
  }

  function startNegotiation(day) {
    var data = negotiationData(day);
    if (!data || !data.rounds || !data.rounds.length) {
      toast('谈判文书未至，改由本司批示。', 'info');
      app.carry = app.carry || emptyCarry();
      app.carry.day = Math.min(7, app.day + 1);
      startDay(app.day + 1);
      return;
    }
    app.carry = app.carry || emptyCarry();
    app.negotiation = {
      data: data, day: day, round: 0, phase: 'round', log: [],
      startCarry: clone(app.carry), reply: ''
    };
    app.screen = 'negotiation';
    renderNegotiation();
    updateDebug();
  }

  function negoRiskText() {
    var c = app.carry || emptyCarry();
    var risks = [];
    var flags = c.flags || {};
    if (num(c.debt) >= 10) risks.push('水债 ' + num(c.debt) + '：第七日浊龙王初始污染将更高。');
    else if (num(c.debt) === 0) risks.push('水债已清：第七日尚可一搏。');
    if (flags.industryLimit || flags.industryCut) risks.push('工业园受限，来年税赋有忧。');
    if (flags.cityAngry) risks.push('城建局衔怨，来年请款必多。');
    if (flags.farmAngry) risks.push('北塬农户有怨，粮价恐起。');
    if (flags.pipeFixed) risks.push('管网已修，第四日漏损或可减。');
    if (flags.pipeBroken) risks.push('管网未修，漏损仍在地下。');
    POOL_KEYS.forEach(function (k) {
      if (num(c.maxDelta[k]) < 0) risks.push(poolName(k) + '上限 ' + num(c.maxDelta[k]) + '，来年配水更紧。');
    });
    if (!risks.length) risks.push('四方无大怨，来年可期。');
    return risks;
  }

  /* 水债纵深：让玩家在每轮答复后看到"水债 → 第七日浊龙王起手"的换算 */
  function negoDebtLine() {
    var c = app.carry || emptyCarry();
    var debt = num(c.debt);
    var boss = 80;
    try { boss = engine().finalBossPollution(c); } catch (e) { boss = clamp(80 + Math.round(debt / 2), 80, 100); }
    var extra = boss - 80;
    return '当前水债 ' + debt + ' 点 · 第七日浊龙王起手浊气 ' + boss + '/100' +
      (extra > 0 ? '（较 80 起手 +' + extra + '，再添 ' + Math.max(0, 40 - debt) + ' 点即封顶）' : '（尚未超出 80 起手）');
  }

  function chooseNegoOption(optionId) {
    var n = app.negotiation;
    if (!n || n.phase !== 'round') return;
    var round = n.data.rounds[n.round];
    if (!round) return;
    var opt = null;
    (round.options || []).forEach(function (o) { if (o.id === optionId) opt = o; });
    if (!opt) return;
    try {
      var res = engine().applyChoiceEffects(app.carry, opt.effects || []);
      if (res && res.carry) app.carry = res.carry;
    } catch (e) {
      toast('批文未落地：' + ((e && e.message) || e), 'bad');
    }
    app.carry.choiceLog = (app.carry.choiceLog || []).concat([{ day: app.day, dept: round.dept, optionId: opt.id }]);
    n.log.push({ dept: round.dept, label: opt.label, reply: opt.reply || '' });
    n.reply = opt.reply || '';
    n.phase = 'reply';
    renderNegotiation();
  }

  function negoNext() {
    var n = app.negotiation;
    if (!n) return;
    if (n.round + 1 >= n.data.rounds.length) {
      n.phase = 'summary';
    } else {
      n.round += 1;
      n.phase = 'round';
    }
    renderNegotiation();
  }

  function finishNegotiation() {
    var day = dayData(app.day) || {};
    var startCarry = app.negotiation ? app.negotiation.startCarry : clone(app.carry);
    var log = app.negotiation ? app.negotiation.log : [];
    app.carry = app.carry || emptyCarry();
    app.carry.day = Math.min(7, app.day + 1);
    hidePopover();
    if (day.choice) {
      app.result = {
        kind: 'negotiation', state: null, stats: null, day: app.day,
        startCarry: startCarry, carry: app.carry, choice: day.choice,
        phase: 'choice', chosen: null, reply: '', log: log
      };
      app.screen = 'result';
      stampFX('议');
      renderResult();
    } else {
      startDay(app.day + 1);
    }
  }

  /* ============================== 最终结算 ============================== */

  function endingPollution(finalState, carry) {
    if (finalState && finalState.enemies && finalState.enemies.length) {
      var boss = null;
      finalState.enemies.forEach(function (e) {
        if (!boss && (e.isBoss || e.id === 'zhuolong')) boss = e;
      });
      if (!boss) boss = finalState.enemies[0];
      if (boss) return num(boss.pollution);
    }
    try {
      var p = engine().finalBossPollution(carry);
      if (typeof p === 'number') return clamp(p, 0, 100);
    } catch (e) {}
    return 100;
  }

  function showEnding() {
    var carry = app.carry || emptyCarry();
    var finalState = app.finalState || null;
    var id = 'standard';
    try { id = engine().finalEnding(carry, finalState) || 'standard'; } catch (e) {}
    var endings = {};
    try { endings = content().endings || {}; } catch (e) { endings = {}; }
    var ending = endings[id] || { id: id, title: '本年结束', stamp: '准', lines: [], annotation: '', tone: 'win' };
    var pollution = endingPollution(finalState, carry);
    carry.lastEndingId = id;
    app.ending = { id: id, ending: ending, pollution: pollution, flow: clamp(100 - pollution, 0, 100) };
    app.screen = 'ending';
    hidePopover();
    closeModal();
    renderEnding();
    sfx('bell');
    updateDebug();
  }
