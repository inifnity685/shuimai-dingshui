  position: absolute;
  right: 30px;
  bottom: 84px;
  width: 92px;
  transform: rotate(-8deg);
  opacity: .9;
}
/* 岁末题跋：立轴右肩的竖排款识 */
.ending__colophon {
  position: absolute;
  top: 96px;
  right: 20px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  writing-mode: vertical-rl;
  font-size: 11px;
  letter-spacing: .4em;
  line-height: 1.8;
  color: rgba(86, 83, 73, .58);
  z-index: 2;
  pointer-events: none;
}
.ending__colophon-sign {
  font-size: 9px;
  letter-spacing: .26em;
  color: rgba(168, 52, 42, .55);
  border-left: 1px solid rgba(168, 52, 42, .28);
  padding-left: 7px;
}
.tone--lose .ending__pollution b { color: #4a1010; }
.tone--lose .ending__annotation { color: var(--pollution-dark); background: rgba(110, 47, 39, .07); border-left-color: rgba(110, 47, 39, .5); }

/* ============================== 失败页 ============================== */

.screen--lose {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  overflow-y: auto;
}
.lose__stage { position: relative; width: min(720px, 100%); z-index: 2; }
.doc--lose { animation: docIn .5s var(--ease) both; }
.doc--lose .doc__title { color: var(--pollution-dark); }
.lose__outro { margin: 14px 0 10px; font-size: 13.5px; line-height: 1.9; color: var(--ink-2); text-indent: 2em; }
.lose__annotation {
  margin: 8px 0 0;
  padding: 8px 12px;
  font-size: 14px;
  color: var(--pollution-dark);
  background: rgba(110, 47, 39, .06);
  border-left: 2px solid rgba(110, 47, 39, .5);
}
.lose__actions { display: flex; gap: 14px; }
.lose__stamp {
  position: absolute;
  right: -34px;
  top: 10%;
  width: 100px;
  transform: rotate(-7deg);
  opacity: .92;
}
.lose__wash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 58%, rgba(27, 27, 24, .34), rgba(27, 27, 24, .10) 48%, transparent 70%);
  filter: blur(8px);
  animation: floodIn 1.2s var(--ease) both;
}
@keyframes floodIn {
  from { opacity: 0; transform: scale(1.15); }
  to { opacity: 1; transform: none; }
}

/* ============================== toast ============================== */

.toast-root {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 95;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 18px;
  max-width: 76vw;
  background: rgba(27, 27, 24, .9);
  color: #f2ecdf;
  border: 1px solid rgba(242, 236, 223, .18);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .3);
  font-size: 13px;
  letter-spacing: .08em;
  animation: toastIn .28s var(--ease);
}
.toast--warn { background: rgba(122, 92, 58, .95); }
.toast--bad { background: rgba(110, 47, 39, .96); }
.toast--good { background: rgba(38, 92, 104, .96); }
.toast__ink { width: 6px; height: 6px; border-radius: 50%; background: var(--cinnabar-2); flex: 0 0 auto; }
.toast.is-out { opacity: 0; transform: translateY(6px); transition: .3s; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* ============================== 动效层 ============================== */

.fx-layer {
  position: fixed;
  inset: 0;
  z-index: 45;
  pointer-events: none;
  overflow: hidden;
}
.fx-float {
  position: fixed;
  transform: translate(-50%, -50%);
  font-family: var(--font-num);
  font-size: 25px;
  font-weight: 700;
  letter-spacing: .01em;
  text-shadow: 0 2px 5px rgba(233, 226, 211, .95), 0 0 12px rgba(233, 226, 211, .8);
  animation: floatUp 1.1s var(--ease) both;
  white-space: nowrap;
}
.fx-float--good { color: var(--water); }
.fx-float--bad { color: var(--cinnabar); }
.fx-float--warn { color: var(--di); }
.fx-float--info { color: var(--ink-soft); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -20%) scale(.82); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -180%) scale(1.04); }
}
.fx-ink {
  position: fixed;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 32%, #4a4a44, #1b1b18 70%);
  opacity: .9;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  animation: inkFly .68s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes inkFly {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
  22% { opacity: .92; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.35); }
}
/* 净化涟漪：双环扩散 + 墨点垂落 */
.fx-ring {
  position: fixed;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.fx-ring i {
  position: absolute;
  left: 50%;
  top: 50%;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.fx-ring i:first-child {
  width: 26px;
  height: 26px;
  border: 2px solid rgba(47, 111, 126, .8);
  animation: ringOut .9s var(--ease-ink) both;
}
.fx-ring i:last-child {
  width: 26px;
  height: 26px;
  border: 1px solid rgba(168, 52, 42, .55);
  animation: ringOut .9s .12s var(--ease-ink) both;
}
@keyframes ringOut {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
  22% { opacity: .95; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(4.6); }
}
.fx-ring b {
  position: absolute;
  left: 50%;
  top: 40%;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(27, 27, 24, .55);
  animation: ringDrop .8s var(--ease) both;
}
@keyframes ringDrop {
  0% { opacity: 0; transform: translate(-50%, 0) scale(.4); }
  20% { opacity: .7; }
  100% { opacity: 0; transform: translate(-50%, 42px) scale(1); }
}
.fx-banner {
  position: fixed;
  left: 50%;
  top: calc(var(--top-h) + 10px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 30px;
  background: linear-gradient(90deg, transparent, rgba(242, 236, 223, .92) 22%, rgba(242, 236, 223, .92) 78%, transparent);
  animation: bannerIn 1.15s var(--ease) both;
  pointer-events: none;
  z-index: 2;
}
.fx-banner__text {
  position: relative;
  font-size: 19px;
  letter-spacing: .48em;
  text-indent: .48em;
  color: var(--ink);
  padding: 0 22px;
  white-space: nowrap;
}
.fx-banner__text::before,
.fx-banner__text::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 26px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(27, 27, 24, .5));
}
.fx-banner__text::before { left: -6px; transform: scaleX(-1); }
.fx-banner__text::after { right: -6px; }
.fx-banner__sub { font-size: 9px; letter-spacing: .4em; color: var(--cinnabar); font-style: normal; }
@keyframes bannerIn {
  0% { opacity: 0; transform: translateX(-50%) translateY(-5px); }
  14% { opacity: 1; transform: translateX(-50%) translateY(0); }
  76% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-2px); }
}
.fx-stamp {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 168px;
  transform: translate(-50%, -50%);
  animation: stampIn 1s var(--ease) both;
  filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .28));
}
.fx-stamp svg { width: 100%; height: auto; }
@keyframes stampIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(1.9) rotate(-15deg); }
  18% { opacity: .95; transform: translate(-50%, -50%) scale(1) rotate(-8deg); }
  74% { opacity: .9; transform: translate(-50%, -50%) scale(1.01) rotate(-8deg); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.03) rotate(-8deg); }
}
.fx-flood { position: fixed; inset: 0; animation: floodOut 1.5s ease-out both; }
.fx-flood__ink {
  position: absolute;
  inset: -12%;
  background: radial-gradient(ellipse at 50% 62%, rgba(27, 27, 24, .88), rgba(27, 27, 24, .42) 46%, transparent 72%);
  filter: blur(22px);
  animation: floodSwell 1.2s ease-out both;
}
.fx-flood__ink--b {
  background: radial-gradient(ellipse at 30% 40%, rgba(27, 27, 24, .6), transparent 62%);
  animation-delay: .1s;
}
@keyframes floodSwell {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: none; }
}
@keyframes floodOut { 0%, 62% { opacity: 1; } 100% { opacity: 0; } }

/* ============================== 调试面板 ============================== */

/* ============================== 窄屏 / 低高度适配 ============================== */

  .card__name { font-size: 15.5px; }
  .card__text { -webkit-line-clamp: 5; }
  .enemy__name { font-size: 19px; }
  .enemy__traits, .enemy__intent { font-size: 10px; }
  .btop { gap: 16px; }
  .bside__line { font-size: 11px; }
  .blog__item { font-size: 11px; }
  .bbottom { grid-template-columns: 116px minmax(0, 1fr) 152px; gap: 10px; padding: 7px 14px 8px; }
  .btray { font-size: 10px; gap: 3px; }
  .btn-end__label { font-size: 16px; }
  .btn-end__sub { display: none; }

  .bscene__objective { top: 8px; }
  .benemies { inset: 28px 10px 24px; }
  .enemy__art svg { max-height: 35vh; }
  .enemy__num { font-size: 23px; }
  .doc { padding: 20px 26px 18px; }
  .doc__title { font-size: 27px; }
  .doc__body { padding: 10px 0 2px; }
  .card-pop { width: 280px; }
  .modal { padding: 22px 26px 20px; }
  .menu__logo { width: min(420px, 40vw); }
  .menu__nav { gap: 9px; }
  .btn--menu { padding: 9px 16px; }
  .btn__label { font-size: 17px; }
  .menu__sub { margin-bottom: 22px; }

  .report__cell b { font-size: 23px; }

}

/* 1280×720 视口（实际内容区约 1246×623）：再收一档，保证手牌与结束回合完整可见 */
@media (max-width: 1320px) and (max-height: 740px) {

    --left-w: 182px;
    --right-w: 268px;
    --top-h: 44px;
    --card-w: 108px;
    --card-h: 152px;
  }
  .bbottom { grid-template-columns: 108px minmax(0, 1fr) 142px; gap: 8px; padding: 6px 12px 7px; }
  .bhand { gap: 5px; }
  .card { padding: 7px 7px 6px; }
  .card__name { font-size: 14.5px; }
  .card__kind { font-size: 8px; }
  .card__text { font-size: 10px; line-height: 1.55; }
  .card--policy .card__name--v { top: 34px; font-size: 15px; }
  .cost { height: 13px; padding: 0 1px; gap: 0; }
  .cost__drop { width: 2px; height: 4px; }
  .cost b { font-size: 10px; }
  .cost em { font-size: 6.5px; }
  .cost__muddy { font-size: 6px; padding-left: 1px; }
  .card__seal { font-size: 36px; }
  .btop { gap: 12px; padding: 0 12px; }
  .btop__item b { font-size: 17px; }
  .btop__turn b { font-size: 19px; }
  .bpools { padding: 6px 7px 5px; }
  .bpools__head { font-size: 9px; }

  <script>
    (function () {
      var fatalTimer = null;
      function showFatal(message) {
        try {
          var box = document.getElementById('fatal');
          var msg = document.getElementById('fatal-msg');
          if (msg) msg.textContent = String(message || '未知错误');
          if (box) box.hidden = false;
          if (!/^\[ERR\]/.test(document.title)) document.title = '[ERR] ' + document.title;
        } catch (e) {}
      }
      window.__DS_FATAL__ = showFatal;
      window.onerror = function (message, source, lineno, colno, error) {
        showFatal((error && error.stack) || (message + ' @ ' + source + ':' + lineno + ':' + colno));
        return false;
      };
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        showFatal((reason && (reason.stack || reason.message)) || String(reason));
      });
      // 防止脚本加载失败却无提示
      window.addEventListener('load', function () {
        clearTimeout(fatalTimer);
        fatalTimer = setTimeout(function () {
          if (!window.DS_UI) {
            showFatal('界面脚本未能载入：请确认 src/*.js 与 dist 单文件完整。');
          }
        }, 2500);
      });
    })();

      var x, y;
      if (edge === 0) { x = 4 + r() * 92; y = 4 + r() * 5; }
      else if (edge === 1) { x = 4 + r() * 92; y = 91 + r() * 5; }
      else if (edge === 2) { x = 4 + r() * 5; y = 4 + r() * 92; }
      else { x = 91 + r() * 5; y = 4 + r() * 92; }
      var w = 2 + r() * 5, h = 2 + r() * 4;
      chips += '<rect x="' + f(x) + '" y="' + f(y) + '" width="' + f(w) + '" height="' + f(h) + '" transform="rotate(' + f(r() * 40 - 20) + ' ' + f(x) + ' ' + f(y) + ')"/>';
    }
    var txt = '';
    if (chars.length >= 2) {
      txt = '<text x="50" y="44" text-anchor="middle" font-size="36" font-family="KaiTi,STKaiti,\'Kaiti SC\',serif" font-weight="bold">' +

          '<g fill="' + color + '">' + txt + '</g>' +
          '<g fill="' + C.paper + '" opacity=".35">' + chips + '</g>'

    /* 白文：文字与缺口作为镂空 */
    return {

        p.muddy = Math.min(n(p.water), n(p.muddy) + added);
        events.push({ t: 'addMuddy', pool: ef.pool, amount: added, source: 'card' });
        makeLog(state, events, poolName(ef.pool) + ' 浊水 +' + added + '。', 'bad');
        return;
      case 'addMax':
        p = state.pools && state.pools[ef.pool];
        if (!p) return;
        amount = n(ef.amount);
        p.cap = Math.max(1, n(p.cap) + amount);
        events.push({ t: 'cap', pool: ef.pool, amount: amount });
        makeLog(state, events, poolName(ef.pool) + ' 上限 ' + (amount >= 0 ? '+' : '') + amount + '。', amount >= 0 ? 'good' : 'warn');
        return;
      case 'moveMax':
        var pf = state.pools && state.pools[ef.from];
        var pt = state.pools && state.pools[ef.to];
        if (!pf || !pt) return;
        amount = Math.abs(n(ef.amount));
        var moved = Math.min(amount, Math.max(0, n(pf.cap) - 1));
        pf.cap = Math.max(1, n(pf.cap) - moved);
        pt.cap = n(pt.cap) + moved;
        events.push({ t: 'moveMax', from: ef.from, to: ef.to, amount: moved });
        makeLog(state, events, '上限由' + poolName(ef.from) + '移 ' + moved + ' 至' + poolName(ef.to) + '。', 'info');
        return;
      case 'reducePollutionCap':
        amount = Math.max(0, n(ef.amount));
        if (amount <= 0) return;
        var elist = aliveEnemies(state);
        for (var j = 0; j < elist.length; j++) {
          var en = elist[j];
          en.maxPollution = Math.max(10, n(en.maxPollution) - amount);
          if (n(en.pollution) > en.maxPollution) en.pollution = en.maxPollution;
        }
        events.push({ t: 'reduceCap', amount: amount });
        makeLog(state, events, '群怪浊气上限 -' + amount + '。', 'good');
        return;
      case 'discountNext':
        amount = Math.max(0, Math.floor(n(ef.amount)));
        if (amount <= 0) return;
        state.discountNext = Math.max(0, n(state.discountNext) + amount);
        makeLog(state, events, '下次出牌费用 -' + amount + '。', 'good');
        return;
      case 'flag':
        if (!ef.key) return;
        state.flags[ef.key] = ef.value;
        makeLog(state, events, '制度生效：' + ef.key + '。', 'good');
        return;
      case 'polluteAll':
        amount = scaleAmount(ef.amount, mul);
        if (amount > 0) {
          addPollutionAll(state, amount, 'card', events);
          makeLog(state, events, '超采反噬，群怪浊气 +' + amount + '。', 'bad');
        }
        return;
      default:
        return;
    }
  }

  /* ------------------------------------------------------------------ *
   * 抽牌
   * ------------------------------------------------------------------ */

  function takeFromDeck(state) {
    if (!state.deck.length) {
      if (!state.discard.length) return null;
      state.deck = state.discard.slice();
      state.discard = [];
      shuffle(state, state.deck);
    }
    return state.deck.pop() || null;
  }

  function drawCardsInto(state, count, events) {
    events = events || [];
    count = Math.max(0, Math.floor(n(count)));
    var drawn = [];
    for (var i = 0; i < count; i++) {
      var card = takeFromDeck(state);
      if (!card) break;
      if (state.hand.length >= HAND_LIMIT) {
        state.discard.push(card);
        if (events) events.push({ t: 'discard', cards: [card.id], reason: 'handLimit' });
        var def = getCardDef(card.id);
        makeLog(state, events, '手牌已满，' + (def && def.name ? def.name : card.id) + ' 归入弃牌。', 'info');
        continue;
      }
      state.hand.push(card);
      drawn.push(card.id);
    }
    if (drawn.length && events) events.push({ t: 'draw', cards: drawn });
    return events;
  }

  function drawCards(state, count) {
    var events = [];
    try {
      if (!state) return events;
      drawCardsInto(state, count, events);
    } catch (e) {
      return events;
    }
    return events;
  }

  /* ------------------------------------------------------------------ *
   * 费用
   * ------------------------------------------------------------------ */

  /* 费用覆盖判定：清水不足/浊水可补/完全不足（供 canPlay / playCard 使用） */
  function costCoverage(state, cost, useMuddy) {
    var res = { shortage: false, insufficient: false, needsMuddy: false, missing: [] };
    if (!state || !cost) return res;
    for (var i = 0; i < POOL_KEYS.length; i++) {
      var k = POOL_KEYS[i];
      var need = (cost.byPool && cost.byPool[k]) || 0;
      if (!need) continue;
      var p = state.pools[k];
      if (!p) { res.insufficient = true; continue; }
      var clean = Math.max(0, n(p.water) - n(p.muddy));
      if (clean >= need) continue;
      res.shortage = true;
      if (n(p.water) < need) {
        res.insufficient = true;
        res.missing.push({ pool: k, need: need, clean: clean, water: n(p.water), kind: 'water' });
      } else if (!useMuddy) {
        res.needsMuddy = true;
        res.missing.push({ pool: k, need: need, clean: clean, water: n(p.water), kind: 'muddy' });
      }
    }
    return res;
  }

  /* SPEC §5.11：返回结构固定为 {total, byPool, muddyByPool, warnPenalty, discount} */
  function resolveCost(state, card, opts) {
    var out = {
      total: 0,
      byPool: {},
      muddyByPool: {},
      warnPenalty: 0,
      discount: 0
    };
    try {
      if (!state || !card) return out;
      opts = opts || {};
      var raw = card.cost || {};
      var cost = {};
      var i, k;
      for (i = 0; i < POOL_KEYS.length; i++) {
        k = POOL_KEYS[i];
        if (raw[k]) cost[k] = Math.max(0, Math.floor(n(raw[k])));
      }
      var flags = state.flags || {};
      // 1) 制度：半费
      if (flags.halfCost) {
        for (i = 0; i < POOL_KEYS.length; i++) {
          k = POOL_KEYS[i];
          if (cost[k]) cost[k] = Math.ceil(cost[k] / 2);
        }
      }
      // 2) 折扣券：从费用最大的池扣减，同额按 cheng→di→ren→chan
      var dn = Math.max(0, Math.floor(n(state.discountNext)));
      if (dn > 0) {
        var bestKey = null;
        var bestVal = 0;
        for (i = 0; i < POOL_KEYS.length; i++) {
          k = POOL_KEYS[i];
          if ((cost[k] || 0) > bestVal) { bestVal = cost[k]; bestKey = k; }
        }
        if (bestKey && bestVal > 0) {
          var use = Math.min(dn, bestVal);
          cost[bestKey] -= use;
          out.discount = use;
        }
      }
      // 3) 警戒线以下：咒术卡本系取水 +1
      if (card.kind !== 'policy' && card.school && state.pools && state.pools[card.school]) {
        var sp = state.pools[card.school];
        if (n(sp.water) < n(sp.warn)) {
          cost[card.school] = Math.max(0, (cost[card.school] || 0) + 1);
          out.warnPenalty = 1;
        }
      }
      // 汇总
      for (i = 0; i < POOL_KEYS.length; i++) {
        k = POOL_KEYS[i];
        var v = cost[k] || 0;
        if (v > 0) {
          out.byPool[k] = v;
          out.total += v;
        }
      }
      // 4) 浊水补足：仅在 opts.useMuddy 时逐池计算
      if (opts.useMuddy) {
        for (i = 0; i < POOL_KEYS.length; i++) {
          k = POOL_KEYS[i];
          var need = out.byPool[k] || 0;
          if (!need) continue;
          var p = state.pools[k];
          var clean = Math.max(0, n(p.water) - n(p.muddy));
          if (clean >= need) continue;
          if (n(p.water) < need) continue;
          out.muddyByPool[k] = Math.min(need - clean, Math.max(0, Math.floor(n(p.muddy))));
        }
      }
    } catch (e) {
      // 费用解析失败时返回零费用结构，调用方会因 playCard 的前置校验拒绝
      out.total = 0;
      out.byPool = {};
      out.muddyByPool = {};
    }
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 出牌
   * ------------------------------------------------------------------ */

  function canPlay(state, handIndex, opts) {
    try {
      if (!state || state.phase !== 'battle') return { ok: false, reason: '当前不可出牌' };
      if (!(handIndex >= 0 && handIndex < state.hand.length)) return { ok: false, reason: '手牌序号无效' };
      var inst = state.hand[handIndex];
      var card = getCardDef(inst.id);
      if (!card) return { ok: false, reason: '未知卡牌' };
      if (!evalCond(state, card.requires, opts || {})) return { ok: false, reason: requiresReason(card) };
      var cost = resolveCost(state, card, opts || {});
      var cover = costCoverage(state, cost, !!(opts && opts.useMuddy));
      var missing = cover.missing.length ? cover.missing[0] : null;
      if (cover.insufficient) {
        return { ok: false, reason: (missing ? poolName(missing.pool) : '池水') + '水不足', cost: cost };
      }
      if (cover.needsMuddy) {
        return {
          ok: false,
          reason: (missing ? poolName(missing.pool) : '清水') + '清水不足，可借浊水',
          needsMuddy: true,
          cost: cost
        };
      }
      return { ok: true, cost: cost, needsMuddy: cover.shortage };
    } catch (e) {
      return { ok: false, reason: '无法出牌' };
    }
  }

  function playCard(state, handIndex, opts) {
    try {
      opts = opts || {};
      if (!state || state.phase !== 'battle') return { ok: false, error: '当前不可出牌' };
      if (!(handIndex >= 0 && handIndex < state.hand.length)) return { ok: false, error: '手牌序号无效' };
      var inst = state.hand[handIndex];
      var card = getCardDef(inst.id);
      if (!card) return { ok: false, error: '未知卡牌' };
      if (!evalCond(state, card.requires, opts)) return { ok: false, error: requiresReason(card) };
      var selectedEnemy = resolveTargetEnemy(state, opts);
      if (!selectedEnemy && needsEnemyTarget(card)) return { ok: false, error: '需要选择目标' };

      var cost = resolveCost(state, card, { useMuddy: !!opts.useMuddy });
      var cover = costCoverage(state, cost, !!opts.useMuddy);
      var missing = cover.missing.length ? cover.missing[0] : null;
      if (cover.insufficient) {
        return { ok: false, error: (missing ? poolName(missing.pool) : '池水') + '水不足', cost: cost };
      }
      if (cover.needsMuddy && !opts.useMuddy) {
        return {
          ok: false,
          error: (missing ? poolName(missing.pool) : '清水') + '清水不足，可借浊水',
          needsMuddy: true,
          cost: cost
        };
      }

      var events = [];
      var muddyUsed = 0;
      var payParts = [];
      for (var i = 0; i < POOL_KEYS.length; i++) {
        var k = POOL_KEYS[i];
        var pay = cost.byPool[k] || 0;
        if (!pay) continue;
        var p = state.pools[k];
        var mud = cost.muddyByPool[k] || 0;
        p.water = Math.max(0, n(p.water) - pay);
        if (mud > 0) p.muddy = Math.max(0, n(p.muddy) - mud);
        if (n(p.muddy) > n(p.water)) p.muddy = n(p.water);
        muddyUsed += mud;
        payParts.push(poolName(k) + ' ' + pay + ' 点' + (mud > 0 ? '（含浊水 ' + mud + ' 点）' : ''));
        events.push({ t: 'spend', pool: k, amount: pay, muddy: mud });
      }
      if (payParts.length) {
        makeLog(state, events, '取水 ' + cost.total + ' 点：' + payParts.join('，') + '。', 'info');
      }
      if (cost.discount > 0) state.discountNext = 0;
      if (muddyUsed > 0) {
        state.stats.muddyUsed += muddyUsed;
        state.muddyUsedTurn += muddyUsed;
      }

      // 支付后立即检查断水（SPEC §5.3 第 8 条）
      var payStatus = evalStatus(state);
      if (state.phase === 'lost') {
        state.hand.splice(handIndex, 1);
        state.discard.push(inst);
        state.stats.cardsPlayed += 1;
        pushAll(events, payStatus.events);
        events.push({ t: 'lose', reason: state.loseReason || 'cutoff', pool: state.losePool });
        return { ok: true, events: events };
      }

      // 效果倍率：红线减半（仅咒术卡，ignoreRed 无效化）+ 浊水减半，可叠乘
      var mul = 1;
      if (card.kind !== 'policy') {
        var school = state.pools[card.school];
        if (school && n(school.water) < n(school.red) && !(state.flags && state.flags.ignoreRed)) {
          mul *= 0.5;
        }
      }
      if (muddyUsed > 0) mul *= 0.5;

      var effects = card.effects || [];
      for (var j = 0; j < effects.length; j++) {
        var ef = effects[j];
        if (!ef) continue;
        if (!evalCond(state, ef.when, opts)) continue;
        applyEffect(state, card, ef, opts, selectedEnemy, mul, events);
      }

      // 浊水出牌代价：每点浊水 → 全体存活怪物 +1
      if (muddyUsed > 0) {
        addPollutionAll(state, muddyUsed, 'muddy', events);
        makeLog(state, events, '浊水入阵，浊气 +' + muddyUsed + '。', 'bad');
      }
      // 用水即浊气
      spendWater(state, cost.total, events);

      // 进弃牌
      state.hand.splice(handIndex, 1);
      state.discard.push(inst);
      state.stats.cardsPlayed += 1;

      pushAll(events, evalStatus(state).events);
      if (state.phase === 'won') events.push({ t: 'win', reason: state.winReason });
      else if (state.phase === 'lost') events.push({ t: 'lose', reason: state.loseReason || 'cutoff', pool: state.losePool });
      return { ok: true, events: events };
    } catch (e) {
      return { ok: false, error: errMsg(e) };
    }
  }

  /* ------------------------------------------------------------------ *
   * 用水即浊气
   * ------------------------------------------------------------------ */

  function spendWater(state, amount, events) {
    amount = Math.floor(n(amount));
    if (amount <= 0) return 0;
    var before = n(state.waterSpent);
    state.waterSpent = before + amount;
    state.waterSpentTurn = n(state.waterSpentTurn) + amount;
    var crossings = Math.floor(state.waterSpent / 10) - Math.floor(before / 10);
    if (crossings > 0) {
      addPollutionAll(state, 3 * crossings, 'waterSpent', events);
      for (var i = 0; i < crossings; i++) {
        makeLog(state, events, '水脉衰弱，浊气 +3。', 'bad');
      }
    }
    return crossings;
  }

  /* ------------------------------------------------------------------ *
   * 调剂
   * ------------------------------------------------------------------ */

  function transfer(state, opts) {
    try {
      opts = opts || {};
      if (!state || state.phase !== 'battle') return { ok: false, error: '当前不可调剂' };
      if (n(state.transfersLeft) <= 0) return { ok: false, error: '本回合调剂次数已用尽' };
      var from = opts.from;
      var to = opts.to;
      if (POOL_KEYS.indexOf(from) < 0 || POOL_KEYS.indexOf(to) < 0) return { ok: false, error: '池名无效' };
      if (from === to) return { ok: false, error: '不可同池调剂' };
      var amount = Math.floor(n(opts.amount));
      if (!(amount > 0)) return { ok: false, error: '调剂水量无效' };
      var mode = opts.mode;
      if (mode !== 'plan' && mode !== 'urgent') return { ok: false, error: '调剂方式无效' };
      var capAmount = mode === 'plan' ? 5 : 12;
      if (amount > capAmount) return { ok: false, error: '单次调剂上限 ' + capAmount + ' 点' };
      var pf = state.pools[from];
      var pt = state.pools[to];
      var cleanFrom = Math.max(0, n(pf.water) - n(pf.muddy));
      if (cleanFrom < amount) return { ok: false, error: '清水不足' };

      var lossRate;
      if (mode === 'urgent') lossRate = 0.5;
      else lossRate = (n(pf.water) > n(pf.warn) && n(pt.water) > n(pt.warn)) ? 0.1 : 0.3;
      var received = Math.max(0, Math.floor(amount * (1 - lossRate)));
      if (received > amount) received = amount;
      var loss = amount - received;

      var events = [];
      pf.water = Math.max(0, n(pf.water) - amount);
      if (n(pf.muddy) > n(pf.water)) pf.muddy = n(pf.water);

      // 直接溢出：到账超过有效上限的部分立刻转化为浊气
      var targetInfo = poolInfo(state, to);
      var room = Math.max(0, targetInfo.effCap - Math.max(0, n(pt.water)));
      var accepted = Math.min(received, room);
      var spilled = received - accepted;
      pt.water = Math.max(0, n(pt.water) + accepted);

      events.push({ t: 'transfer', from: from, to: to, amount: amount, received: accepted, loss: loss });
      makeLog(state, events, poolName(from) + '→' + poolName(to) + ' 调剂 ' + amount + ' 点，到账 ' + accepted + ' 点'
        + (loss > 0 ? '（损耗 ' + loss + ' 点）' : '') + '。', 'info');
      if (loss > 0) {
        events.push({ t: 'spend', pool: from, amount: loss, muddy: 0 });
        spendWater(state, loss, events);
      }
      if (spilled > 0) {
        pt.water = targetInfo.effCap;
        if (n(pt.muddy) > n(pt.water)) pt.muddy = n(pt.water);
        state.stats.overflow += spilled;
        addPollutionAll(state, spilled, 'overflow', events);
        events.push({ t: 'overflow', pool: to, amount: spilled });
        makeLog(state, events, poolName(to) + ' 水满溢出 ' + spilled + ' 点，浊气 +' + spilled + '。', 'bad');
      }
      state.transfersLeft = Math.max(0, n(state.transfersLeft) - 1);
      state.stats.transfers += 1;

      pushAll(events, evalStatus(state).events);
      if (state.phase === 'won') events.push({ t: 'win', reason: state.winReason });
      else if (state.phase === 'lost') events.push({ t: 'lose', reason: state.loseReason || 'cutoff', pool: state.losePool });
      return { ok: true, events: events };
    } catch (e) {
      return { ok: false, error: errMsg(e) };
    }
  }

  /* ------------------------------------------------------------------ *
   * 敌方回合
   * ------------------------------------------------------------------ */

  function absorbShield(state, amount) {
    amount = Math.max(0, Math.floor(n(amount)));
    if (amount <= 0) return 0;
    var shield = Math.max(0, n(state.shield));
    if (shield <= 0) return amount;
    var used = Math.min(shield, amount);
    state.shield = shield - used;
    return amount - used;
  }

  function traitEvent(state, events, enemy, kind, text, amount) {
    var ev = { t: 'enemyAct', enemyUid: enemy.uid, kind: kind, text: text };
    if (amount != null) ev.amount = amount;
    events.push(ev);
  }

  function applyTrait(state, enemy, tr, mod, events) {
    if (!tr || !tr.type) return;
    var p;
    var amount;
    var i;
    switch (tr.type) {
      case 'pollute':
        amount = absorbShield(state, Math.max(0, n(tr.amount) + mod));
        p = state.pools[tr.pool];
        if (!p) return;
        traitEvent(state, events, enemy, 'pollute', enemy.name + ' 侵蚀' + poolName(tr.pool) + ' ' + amount + ' 点', amount);
        if (amount <= 0) {
          makeLog(state, events, enemy.name + ' 的侵蚀被水盾化解。', 'good');
          return;
        }
        var clean = Math.max(0, n(p.water) - n(p.muddy));
        var converted = Math.min(amount, clean);
        if (converted > 0) {
          p.muddy = Math.min(n(p.water), n(p.muddy) + converted);
          events.push({ t: 'addMuddy', pool: tr.pool, amount: converted, source: 'enemy' });
          makeLog(state, events, enemy.name + ' 将' + poolName(tr.pool) + '清水 ' + converted + ' 点搅浑。', 'bad');
        }
        var rest = amount - converted;
        if (rest > 0) {
          addPollutionAll(state, rest, 'enemy', events);
          makeLog(state, events, poolName(tr.pool) + ' 已无清水，浊气 +' + rest + '。', 'bad');
        }
        return;
      case 'steal':
        amount = absorbShield(state, Math.max(0, n(tr.amount) + mod));
        p = state.pools[tr.pool];
        if (!p) return;
        var beforeWater = Math.max(0, n(p.water));
        p.water = Math.max(0, beforeWater - amount);
        if (n(p.muddy) > n(p.water)) p.muddy = n(p.water);
        var stolen = beforeWater - n(p.water);
        traitEvent(state, events, enemy, 'steal', enemy.name + ' 窃走' + poolName(tr.pool) + ' ' + stolen + ' 点', stolen);
        if (stolen > 0) makeLog(state, events, enemy.name + ' 窃走' + poolName(tr.pool) + ' ' + stolen + ' 点水。', 'bad');
        return;
      case 'eatMax':
        amount = absorbShield(state, Math.max(0, n(tr.amount) + mod));
        p = state.pools[tr.pool];
        if (!p) return;
        var beforeCap = n(p.cap);
        p.cap = Math.max(1, beforeCap - amount);
        var delta = n(p.cap) - beforeCap;
        traitEvent(state, events, enemy, 'eatMax', enemy.name + ' 吞噬' + poolName(tr.pool) + '上限 ' + (-delta) + ' 点', -delta);
        if (delta !== 0) {
          events.push({ t: 'cap', pool: tr.pool, amount: delta });
          makeLog(state, events, poolName(tr.pool) + ' 上限 ' + delta + '。', 'bad');
        }
        return;
      case 'split':
        var every = Math.max(1, Math.floor(n(tr.every) || 1));
        if (n(state.turn) % every !== 0) return;
        var maxClones = Math.max(1, Math.floor(n(tr.max) || 2));
        var existing = 0;
        for (i = 0; i < state.enemies.length; i++) {
          var c0 = state.enemies[i];
          if (c0 && c0.isClone && c0.alive && c0.cloneOf === enemy.uid) existing++;
        }
        if (existing >= maxClones) return;
        var clonePollution = Math.max(1, Math.floor(n(tr.pollution) || 18));
        state._enemyUid += 1;
        var clone = {
          uid: 'e' + state._enemyUid,
          id: 'clone',
          name: enemy.name + '·分身',
          subtitle: '',
          desc: '',
          art: 'clone',
          pollution: clonePollution,
          maxPollution: clonePollution,
          sealTurns: 0,
          alive: true,
          isClone: true,
          cloneOf: enemy.uid,
          traits: [{ type: 'occupy', pool: tr.pool, amount: Math.max(1, Math.floor(n(tr.amount) || 1)) }]
        };
        state.enemies.push(clone);
        traitEvent(state, events, enemy, 'split', enemy.name + ' 分裂出分身', 1);
        makeLog(state, events, enemy.name + ' 分裂出分身，占用' + poolName(tr.pool) + '上限。', 'bad');
        return;
      case 'sealPool':
      case 'occupy':
        // 被动特性，由 poolInfo 实时计算
        return;
      case 'systemic':
        var everySys = Math.max(1, Math.floor(n(tr.every) || 1));
        if (n(state.turn) % everySys !== 0) return;
        traitEvent(state, events, enemy, 'systemic', enemy.name + ' 翻涌，清水化浊', 1);
        for (i = 0; i < POOL_KEYS.length; i++) {
          var key = POOL_KEYS[i];
          var pp = state.pools[key];
          if (!pp) continue;
          var cleanSys = Math.max(0, n(pp.water) - n(pp.muddy));
          var conv = Math.max(0, Math.floor(cleanSys * n(tr.ratio)) + mod);
          conv = Math.min(conv, cleanSys);
          if (conv > 0) {
            pp.muddy = Math.min(n(pp.water), n(pp.muddy) + conv);
            events.push({ t: 'addMuddy', pool: key, amount: conv, source: 'systemic' });
          }
        }
        makeLog(state, events, '浊龙王翻涌，四池清水化浊。', 'bad');
        return;
      default:
        return;
    }
  }

  function clampPools(state) {
    for (var i = 0; i < POOL_KEYS.length; i++) {
      var p = state.pools[POOL_KEYS[i]];
      if (!p) continue;
      p.water = Math.max(0, n(p.water));
      p.muddy = clamp(n(p.muddy), 0, p.water);
    }
  }

  function runEnemyPhase(state, events) {
    var mod = 0;
    var debuffs = state.debuffs || [];
    for (var i = 0; i < debuffs.length; i++) mod += n(debuffs[i].amount);
    var list = (state.enemies || []).slice();
    for (var j = 0; j < list.length; j++) {
      var enemy = list[j];
      if (!enemy || !enemy.alive) continue;
      if (n(enemy.sealTurns) > 0) {
        enemy.sealTurns = Math.max(0, n(enemy.sealTurns) - 1);
        traitEvent(state, events, enemy, 'sealed', enemy.name + ' 被封印，未能行动', 0);
        makeLog(state, events, enemy.name + ' 被封印，未能行动。', 'good');
        continue;
      }
      var traits = enemy.traits || [];
      for (var t = 0; t < traits.length; t++) applyTrait(state, enemy, traits[t], mod, events);
    }
    clampPools(state);
  }

  function redlineErosion(state, events) {
    for (var i = 0; i < POOL_KEYS.length; i++) {
      var key = POOL_KEYS[i];
      var p = state.pools[key];
      if (!p) continue;
      if (n(p.water) > 0 && n(p.water) < n(p.red)) {
        p.water = Math.max(0, n(p.water) - 1);
        if (n(p.muddy) > n(p.water)) p.muddy = n(p.water);
        events.push({ t: 'redline', pool: key, amount: 1 });
        makeLog(state, events, poolName(key) + ' 跌破红线，水脉自枯 -1。', 'bad');
      }
    }
  }

  function resolveOverflow(state, events) {
    for (var i = 0; i < POOL_KEYS.length; i++) {
      var key = POOL_KEYS[i];
      var p = state.pools[key];
      if (!p) continue;
      var info = poolInfo(state, key);
      if (n(p.water) > info.effCap) {
        var spill = Math.floor(n(p.water) - info.effCap);
        p.water = info.effCap;
        if (n(p.muddy) > n(p.water)) p.muddy = n(p.water);
        state.stats.overflow += spill;
        addPollutionAll(state, spill, 'overflow', events);
        events.push({ t: 'overflow', pool: key, amount: spill });
        makeLog(state, events, poolName(key) + ' 水满溢出 ' + spill + ' 点，浊气 +' + spill + '。', 'bad');
      }
    }
  }

  /* ------------------------------------------------------------------ *
   * 胜负
   * ------------------------------------------------------------------ */

  function winningCondition(state) {
    var win = state.win || { type: 'purifyAll' };
    var list = state.enemies || [];
    var i;
    if (win.type === 'purifyAll') {
      for (i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e) continue;
        if (!e.alive) continue;
        if (n(e.pollution) > 0) return false;
      }
      return true;
    }
    if (win.type === 'purifyMain') {
      for (i = 0; i < list.length; i++) {
        var m = list[i];
        if (!m || m.isClone || !m.alive) continue;
        if (n(m.pollution) > 0) return false;
      }
      return true;
    }
    if (win.type === 'below') {
      var target = null;
      for (i = 0; i < list.length; i++) {
        if (list[i] && list[i].id === win.enemyId && list[i].alive) { target = list[i]; break; }
      }
      return !!target && n(target.pollution) <= n(win.value);
    }
    return false;
  }

  function evalStatus(state) {
    var events = [];
    if (!state) return { phase: 'battle', events: events };
    if (state.phase === 'won') return { phase: 'won', reason: state.winReason, events: events };
    if (state.phase === 'lost') return { phase: 'lost', reason: state.loseReason, events: events };
    if (winningCondition(state)) {
      var reason = (state.win && state.win.type) || 'purifyAll';
      if (reason === 'purifyMain') {
        var list = state.enemies || [];
        for (var i = 0; i < list.length; i++) {
          var e = list[i];
          if (e && e.isClone && e.alive) {
            e.alive = false;
            e.pollution = 0;
          }
        }
        makeLog(state, events, '主怪已净，分身随之消散。', 'good');
      }
      state.phase = 'won';
      state.winReason = reason;
      return { phase: 'won', reason: reason, events: events };
    }
    for (var k = 0; k < POOL_KEYS.length; k++) {
      var p = state.pools && state.pools[POOL_KEYS[k]];
      if (p && n(p.water) <= 0) {
        state.phase = 'lost';
        state.loseReason = 'cutoff';
        state.losePool = POOL_KEYS[k];
        return { phase: 'lost', reason: 'cutoff', pool: POOL_KEYS[k], events: events };
      }
    }
    return { phase: 'battle', events: events };
  }

  function checkStatus(state) {
    try {
      if (!state) return { phase: 'battle' };
      return evalStatus(state);
    } catch (e) {
      return { phase: 'battle' };
    }
  }

  /* ------------------------------------------------------------------ *
   * 回合结束
   * ------------------------------------------------------------------ */

  function endTurn(state) {
    try {
      if (!state) return { ok: false, error: '状态无效' };
      if (state.phase !== 'battle') return { ok: true, events: [] };
      var events = [];

      // 1) 先判胜负
      var st = evalStatus(state);
      if (state.phase === 'won') {
        events.push({ t: 'win', reason: state.winReason });
        return { ok: true, events: events };
      }
      if (state.phase === 'lost') {
        events.push({ t: 'lose', reason: state.loseReason || 'cutoff', pool: state.losePool });
        return { ok: true, events: events };
      }

      // 2) 敌方行动
      runEnemyPhase(state, events);
      var st2 = evalStatus(state);
      pushAll(events, st2.events);
      if (state.phase === 'won') {
        events.push({ t: 'win', reason: state.winReason });
        return { ok: true, events: events };
      }
      if (state.phase === 'lost') {
        events.push({ t: 'lose', reason: 'cutoff', pool: state.losePool });
        return { ok: true, events: events };
      }

      // 3) 红线侵蚀
      redlineErosion(state, events);
      var st3 = evalStatus(state);
      pushAll(events, st3.events);
      if (state.phase === 'won') {
        events.push({ t: 'win', reason: state.winReason });
        return { ok: true, events: events };
      }
      if (state.phase === 'lost') {
        events.push({ t: 'lose', reason: 'cutoff', pool: state.losePool });
        return { ok: true, events: events };
      }

      // 4) 溢出
      resolveOverflow(state, events);
      var st4 = evalStatus(state);
      pushAll(events, st4.events);
      if (state.phase === 'won') {
        events.push({ t: 'win', reason: state.winReason });
        return { ok: true, events: events };
      }
      if (state.phase === 'lost') {
        events.push({ t: 'lose', reason: 'cutoff', pool: state.losePool });
        return { ok: true, events: events };
      }

      // 5) 结余奖励：整回合未用浊水则补牌
      if (n(state.muddyUsedTurn) === 0 && n(state.flags.blessNoMuddyDraw) > 0) {
        var bonus = Math.min(HAND_LIMIT, Math.floor(n(state.flags.blessNoMuddyDraw)));
        drawCardsInto(state, bonus, events);
        makeLog(state, events, '未汲浊水，水脉稍复，补牌 ' + bonus + ' 张。', 'good');
        state.flags.blessNoMuddyDraw = 0;
      }

      // 6) 回合收尾（SPEC §5.3 第 6 条）
      state.shield = 0;
      state.flags.halfCost = false;
      state.flags.ignoreRed = false;
      state.flags.blessNoMuddyDraw = 0;
      state.muddyUsedTurn = 0;
      state.waterSpentTurn = 0;
      state.discountNext = 0;
      if (state.debuffs && state.debuffs.length) {
        for (var db = 0; db < state.debuffs.length; db++) state.debuffs[db].turns = n(state.debuffs[db].turns) - 1;
        state.debuffs = state.debuffs.filter(function (x) { return n(x.turns) > 0; });
      }

      // 7) 回合推进与抽牌
      state.turn = n(state.turn) + 1;
      if (state.turn > n(state.turnLimit)) {
        state.phase = 'lost';
        state.loseReason = 'timeout';
        state.losePool = null;
        events.push({ t: 'lose', reason: 'timeout' });
        makeLog(state, events, '回合耗尽，未及处置。', 'bad');
        return { ok: true, events: events };
      }
      state.transfersLeft = 2;
      var day = getDayDef(state);
      var drawCount = day && day.drawPerTurn != null ? n(day.drawPerTurn) : 2;
      drawCardsInto(state, drawCount, events);
      events.push({ t: 'turn', turn: state.turn });
      makeLog(state, events, '第 ' + state.turn + ' 回合。', 'info');

      var st5 = evalStatus(state);
      pushAll(events, st5.events);
      if (state.phase === 'won') events.push({ t: 'win', reason: state.winReason });
      return { ok: true, events: events };
    } catch (e) {
      return { ok: false, error: errMsg(e) };
    }
  }

  /* ------------------------------------------------------------------ *
   * 创建战斗
   * ------------------------------------------------------------------ */

  function createGame(dayNumber, carry, opts) {
    try {
      var content = getContent();
      if (!content) return { ok: false, error: '缺少 DS_CONTENT' };
      var days = content.days || [];
      var day = days[dayNumber - 1];
      if (!day) return { ok: false, error: '无效的天数：' + dayNumber };
      opts = opts || {};
      var c0 = normalizeCarry(carry);
      var seed = opts.seed != null ? (opts.seed | 0) : (12345 + (dayNumber - 1) * 1000);
      var state = {
        version: VERSION,
        day: dayNumber,
        phase: 'battle',
        turn: 1,
        turnLimit: Math.max(1, Math.floor(n(day.turnLimit) || 12)),
        pools: {},
        deck: [],
        hand: [],
        discard: [],
        enemies: [],
        shield: 0,
        debuffs: [],
        discountNext: 0,
        flags: { halfCost: false, ignoreRed: false, blessNoMuddyDraw: 0 },
        transfersLeft: 2,
        waterSpent: 0,
        waterSpentTurn: 0,
        muddyUsedTurn: 0,
        rng: seed,
        stats: { purified: 0, cleansed: 0, overflow: 0, transfers: 0, cardsPlayed: 0, muddyUsed: 0 },
        log: [],
        carry: deepCopy(c0),
        scenarioId: dayNumber,
        seed: seed,
        win: deepCopy(day.win || { type: 'purifyAll' }),
        winReason: null,
        loseReason: null,
        losePool: null,
        _cardUid: 0,
        _enemyUid: 0
      };

      for (var i = 0; i < POOL_KEYS.length; i++) {
        var key = POOL_KEYS[i];
        var src = (day.pools && day.pools[key]) || {};
        var cap = Math.max(1, Math.floor(n(src.cap) + n(c0.maxDelta[key])));
        var water = Math.max(0, n(src.water));
        var muddy = clamp(n(src.muddy), 0, water);
        state.pools[key] = {
          water: water,
          cap: cap,
          warn: Math.max(0, n(src.warn)),
          red: Math.max(0, n(src.red)),
          muddy: muddy
        };
      }
      // 第 7 天：存水（reserve）注入定城池，至多 +20
      if (dayNumber === 7) {
        var bonusWater = clamp(Math.floor(n(c0.reserve)), 0, 20);
        state.pools.cheng.water = Math.max(0, n(state.pools.cheng.water) + bonusWater);
      }

      // 怪物
      var dayEnemies = day.enemies || [];
      for (var j = 0; j < dayEnemies.length; j++) {
        var entry = dayEnemies[j] || {};
        var tpl = (content.enemies && content.enemies[entry.id]) || {};
        var maxPoll = entry.maxPollution != null ? n(entry.maxPollution)
          : (tpl.maxPollution != null ? n(tpl.maxPollution) : 100);
        if (!(maxPoll > 0)) maxPoll = 100;
        var pollution = entry.pollution != null ? n(entry.pollution)
          : (tpl.pollution != null ? n(tpl.pollution) : 0);
        var useDebt = !!(entry.useCarryDebt || tpl.useCarryDebt);
        if (useDebt) {
          var bossPollution = finalBossPollution(c0);
          pollution = bossPollution;
          maxPoll = Math.max(bossPollution, 100);
        }
        pollution = clamp(pollution, 0, maxPoll);
        state._enemyUid += 1;
        state.enemies.push({
          uid: 'e' + state._enemyUid,
          id: entry.id,
          name: tpl.name || entry.name || entry.id,
          subtitle: tpl.subtitle || '',
          desc: tpl.desc || '',
          flavor: tpl.flavor || '',
          art: tpl.art || entry.art || entry.id,
          pollution: pollution,
          maxPollution: Math.max(1, Math.floor(maxPoll)),
          sealTurns: 0,
          alive: true,
          isClone: false,
          isBoss: !!tpl.isBoss,
          traits: deepCopy(tpl.traits || entry.traits || [])
        });
      }

      // 牌组
      var deckIds = day.deck || [];
      for (var d = 0; d < deckIds.length; d++) {
        var id = deckIds[d];
        if (!getCardDef(id)) continue;
        state._cardUid += 1;
        state.deck.push({ uid: 'c' + state._cardUid, id: id });
      }
      shuffle(state, state.deck);
      var handSize = Math.max(0, Math.floor(day.handSize != null ? n(day.handSize) : 5));
      drawCardsInto(state, handSize, []);

      makeLog(state, null, day.title ? (day.title + ' · 开战') : ('第 ' + dayNumber + ' 天 · 开战'), 'info');
      clampPools(state);
      /* 开局即结算初始溢出：避免跨日 maxDelta 压低上限后 water > effCap 悬空，
         被玩家用出牌规避「溢出转浊气」规则 */
      resolveOverflow(state, []);
      return { ok: true, state: state };
    } catch (e) {
      return { ok: false, error: errMsg(e) };
    }
  }

  /* ------------------------------------------------------------------ *
   * 结算 / 抉择 / 终局
   * ------------------------------------------------------------------ */

  function finishBattle(state) {
    try {
      var c0 = normalizeCarry(state && state.carry);
      if (!state || !state.pools) return c0;
      var cleanTotal = cleanTotalOf(state);
      var muddyTotal = muddyTotalOf(state);
      var pollutionLeft = 0;
      var list = state.enemies || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i] && list[i].alive) pollutionLeft += Math.max(0, n(list[i].pollution));
      }
      var day = getDayDef(state) || {};
      var dayDebt = Math.round(muddyTotal * 0.5) + n(day.debtBase);
      var c = deepCopy(c0);
      c.day = n(state.day) + 1;
      c.debt = Math.max(0, c.debt + dayDebt - Math.floor(cleanTotal / 30));
      c.reserve = Math.max(0, c.reserve + Math.floor(cleanTotal / 10));
      c.score = c.score + 100 + cleanTotal * 2 + Math.max(0, 50 - muddyTotal) * 2;
      var entry = {
        day: n(state.day),
        turns: n(state.turn),
        win: state.phase === 'won',
        pollutionLeft: pollutionLeft,
        muddyLeft: muddyTotal,
        cleanLeft: cleanTotal,
        waterSpent: n(state.waterSpent)
      };
      c.history = (c.history || []).concat([entry]);
      c.choiceLog = c.choiceLog || [];
      return c;
    } catch (e) {
      return normalizeCarry(state && state.carry);
    }
  }

  function applyChoiceEffects(carry, effects) {
    var c = normalizeCarry(deepCopy(carry || {}));
    var log = [];
    try {
      var list = effects || [];
      for (var i = 0; i < list.length; i++) {
        var ef = list[i];
        if (!ef || !ef.type) continue;
        switch (ef.type) {
          case 'maxDelta':
            if (ef.pool && c.maxDelta[ef.pool] != null) {
              c.maxDelta[ef.pool] += n(ef.amount);
              log.push(poolName(ef.pool) + ' 上限 ' + (n(ef.amount) >= 0 ? '+' : '') + n(ef.amount));
            }
            break;
          case 'debt':
            c.debt = Math.max(0, c.debt + n(ef.amount));
            log.push('积欠 +' + n(ef.amount));
            break;
          case 'reserve':
            c.reserve = Math.max(0, c.reserve + n(ef.amount));
            log.push('存水 ' + (n(ef.amount) >= 0 ? '+' : '') + n(ef.amount));
            break;
          case 'flag':
            if (ef.key) c.flags[ef.key] = ef.value;
            log.push('制度：' + ef.key);
            break;
          case 'score':
            c.score += n(ef.amount);
            log.push('政绩 ' + (n(ef.amount) >= 0 ? '+' : '') + n(ef.amount));
            break;
          /* poolNow / enemyNow 只在「战前抉择」（applyPreChoice）里真正生效 —— 那时战局已开。
             战后抉择走本函数时战局已散，没有可改的池子与怪物，故此处仅记一笔：
             内容作者若想让某效果即时落到池子/怪物上，请用 applyPreChoice 通道。 */
          case 'poolNow':
          case 'enemyNow':
            log.push('（须经战前抉择方可即时生效，战后批示不落此条）');
            break;
          default:
            log.push('未知效果：' + ef.type);
            break;
        }
      }
    } catch (e) {
      log.push('抉择结算异常：' + errMsg(e));
    }
    return { carry: c, log: log };
  }

  function applyPreChoice(state, choice, optionId) {
    try {
      if (!state) return { ok: false, error: '状态无效' };
      var options = (choice && choice.options) || [];
      var option = null;
      for (var i = 0; i < options.length; i++) {
        if (options[i] && options[i].id === optionId) { option = options[i]; break; }
      }
      if (!option) return { ok: false, error: '无效选项' };
      var events = [];
      makeLog(state, events, (choice && choice.title ? choice.title + '：' : '') + (option.label || optionId), 'info');
      var effects = option.effects || [];
      for (var j = 0; j < effects.length; j++) {
        var ef = effects[j];
        if (!ef) continue;
        if (ef.type === 'poolNow') {
          var p = state.pools && state.pools[ef.pool];
          if (!p) continue;
          var amount = n(ef.amount);
          if (amount >= 0) {
            // 与卡牌 addWater 同一路径：超过 effCap 立即按 §5.5 溢出（每点全怪 pollution+1）
            addWaterToPool(state, ef.pool, amount, events);
          } else {
            p.water = Math.max(0, n(p.water) + amount);
            if (n(p.muddy) > n(p.water)) p.muddy = n(p.water);
            events.push({ t: 'spend', pool: ef.pool, amount: -amount, muddy: 0 });
            makeLog(state, events, poolName(ef.pool) + ' 减水 ' + (-amount) + '。', 'warn');
          }
        } else if (ef.type === 'enemyNow') {
          var target = null;
          var list = state.enemies || [];
          for (var k = 0; k < list.length; k++) {
            if (list[k] && list[k].id === ef.enemyId && list[k].alive) { target = list[k]; break; }
          }
          if (!target) continue;
          var delta = n(ef.pollution);
          if (delta < 0) {
            purifyEnemy(state, target, -delta, events, '批示');
          } else if (delta > 0) {
            addPollutionAll(state, delta, 'card', events, function (e) { return e === target; });
            makeLog(state, events, target.name + ' 污染值 +' + delta + '。', 'bad');
          }
        }
      }
      pushAll(events, evalStatus(state).events);
      return { ok: true, events: events };
    } catch (e) {
      return { ok: false, error: errMsg(e) };
    }
  }

  function bossPollution(state, carry) {
    if (state && state.enemies) {
      var fallback = null;
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e && e.id === 'zhuolong') {
          if (e.alive) return Math.max(0, Math.round(n(e.pollution)));
          fallback = e;
        }
      }
      if (fallback) return Math.max(0, Math.round(n(fallback.pollution)));
    }
    return finalBossPollution(carry || (state && state.carry));
  }

  function muddyStats(state) {
    var waterTotal = waterTotalOf(state);
    var muddyTotal = muddyTotalOf(state);
    var ratio = waterTotal > 0 ? muddyTotal / waterTotal : 0;
    var sum = 0;
    var count = 0;
    for (var i = 0; i < POOL_KEYS.length; i++) {
      var info = poolInfo(state, POOL_KEYS[i]);
      if (info.water > 0) { sum += info.muddy / info.water; count += 1; }
    }
    return {
      waterTotal: waterTotal,
      muddyTotal: muddyTotal,
      ratio: ratio,
      avgPoolRatio: count ? sum / count : ratio
    };
  }

  function finalEnding(carry, state) {
    try {
      var c = carry || (state && state.carry) || {};
      if (state) {
        if (state.loseReason === 'timeout' || (state.phase === 'lost' && state.loseReason === 'timeout')) return 'timeout';
        if (state.loseReason === 'cutoff') return 'cutoff';
        for (var i = 0; i < POOL_KEYS.length; i++) {
          var p = state.pools && state.pools[POOL_KEYS[i]];
          if (p && n(p.water) <= 0) return 'cutoff';
        }
      }
      var pollution = bossPollution(state, c);
      if (pollution > 50) return 'overload';
      var stats = state ? muddyStats(state) : { ratio: 0, avgPoolRatio: 0 };
      /* 考绩（score）此前只累积不参与判定；现作为「上上」的一票否决：
         浊气低、池子清，但若七日考绩不足 —— 说明中途靠重试或浊水硬扛 —— 只给「达标」。
         基准：六战日每日常规约 230 分，全线通关约 1400+；1200 为宽容线。 */
      if (pollution <= 35 && stats.avgPoolRatio < 0.2 && n(c.score) >= SCORE_EXCELLENT) return 'excellent';

  /* ------------------------------------------------------------------ *
   * 摘要 / 克隆
   * ------------------------------------------------------------------ */

  function summarize(state) {
    try {
      var pools = eachPoolInfo(state);
      var cleanTotal = 0;
      var muddyTotal = 0;
      var waterTotal = 0;
      for (var i = 0; i < POOL_KEYS.length; i++) {
        cleanTotal += pools[POOL_KEYS[i]].clean;
        muddyTotal += pools[POOL_KEYS[i]].muddy;
        waterTotal += pools[POOL_KEYS[i]].water;
      }
      var pollutionTotal = 0;
      var list = (state && state.enemies) || [];
      var enemies = [];
      for (var j = 0; j < list.length; j++) {
        var e = list[j];
        if (!e) continue;
        if (e.alive) pollutionTotal += Math.max(0, n(e.pollution));

          uid: e.uid,
          id: e.id,
          name: e.name,
          art: e.art,
          pollution: n(e.pollution),

        muddyRatio: 0, cleanTotal: 0, muddyTotal: 0, pollutionTotal: 0,
        shield: 0, transfersLeft: 0, waterSpent: 0, win: null
      };
    }
  }

  function cloneState(state) {
    try {
      return deepCopy(state);
    } catch (e) {
      return null;
    }
  }

  /* ------------------------------------------------------------------ *
   * 对外 API（SPEC §5.11）
   * ------------------------------------------------------------------ */

  var API = {
    version: VERSION,
    POOL_KEYS: POOL_KEYS.slice(),
    createGame: createGame,
    poolInfo: poolInfo,
    resolveCost: resolveCost,
    canPlay: canPlay,
    playCard: playCard,
    transfer: transfer,
    endTurn: endTurn,
    checkStatus: checkStatus,
    finishBattle: finishBattle,
    applyChoiceEffects: applyChoiceEffects,
    applyPreChoice: applyPreChoice,
    finalBossPollution: finalBossPollution,
    scoreExcellent: SCORE_EXCELLENT,
    finalEnding: finalEnding,
    summarize: summarize,
    drawCards: drawCards,
    cloneState: cloneState,
    spendWater: spendWater
  };

  ROOT.DS_ENGINE = API;
  if (typeof ROOT.DS_VERSION === 'undefined') ROOT.DS_VERSION = VERSION;
})();

  <script>/* audio.js */
/* =============================================================================
 * 《定水》声景 · WebAudio 全合成（零外部音频文件）
 * 水声（棕噪 + 低通 + 慢 LFO）/ 远钟 / 古琴拨弦 / 木鱼 / 水滴 / 浊气闷响 / 卷轴声
 * 首次用户手势后启动；偏好存 localStorage；?noaudio=1 强制关闭。
 * ========================================================================== */
(function () {
  'use strict';
  var g = typeof globalThis !== 'undefined' ? globalThis : window;
  var STORE = 'dingshui.audio.v1';
  var ctx = null, master = null, waterOn = false, timer = null;
  var enabled = true, nextBell = 0;

  function loadPref() {
    try {
      var v = window.localStorage.getItem(STORE);
      if (v === '0' || v === '1') enabled = v === '1';
    } catch (e) {}
  }
  function savePref() {
    try { window.localStorage.setItem(STORE, enabled ? '1' : '0'); } catch (e) {}
  }
  loadPref();

  function ensureCtx() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
    } catch (e) { ctx = null; }
    return ctx;
  }

  /* 水声床：棕噪过低通，LFO 缓慢起伏如浪 */
  function startWater() {
    if (waterOn || !ctx) return;
    waterOn = true;
    try {
      var len = Math.floor(ctx.sampleRate * 4);
      var buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var ch = 0; ch < 2; ch++) {
        var data = buf.getChannelData(ch);
        var last = 0;
        for (var i = 0; i < len; i++) {
          var white = Math.random() * 2 - 1;
          last = (last + 0.02 * white) / 1.02;
          data[i] = last * 3.2;
        }
      }
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 300;
      lp.Q.value = 0.4;
      var wg = ctx.createGain();
      wg.gain.value = 0.03;
      src.connect(lp); lp.connect(wg); wg.connect(master);
      var lfo = ctx.createOscillator();
      lfo.frequency.value = 0.07;
      var lfoG = ctx.createGain();
      lfoG.gain.value = 0.02;
      lfo.connect(lfoG); lfoG.connect(wg.gain);
      src.start(); lfo.start();
    } catch (e) {}
  }

  /* 远钟：随机 20~50 秒一记 */
  function tick() {
    if (!ctx || !enabled) return;
    var now = ctx.currentTime;
    if (now >= nextBell) {
      bell();
      nextBell = now + 20 + Math.random() * 30;
    }
  }

  function bell() {
    if (!ready()) return;
    var t = ctx.currentTime;
    var partials = [1, 2.02, 2.98, 4.1];
    for (var i = 0; i < partials.length; i++) {
      try {
        var o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = 110 * partials[i];
        var g1 = ctx.createGain();
        var amp = 0.085 / (i + 1);
        g1.gain.setValueAtTime(0, t);
        g1.gain.linearRampToValueAtTime(amp, t + 0.02);
        g1.gain.exponentialRampToValueAtTime(0.0005, t + 3.2 - i * 0.5);
        o.connect(g1); g1.connect(master);
        o.start(t); o.stop(t + 3.4);
      } catch (e) {}
    }
  }

  /* 古琴拨弦：D 宫五声（D G A C D） */
  var PENTA = [146.83, 196.00, 220.00, 261.63, 293.66];
  function pluck() {
    if (!ready()) return;
    var t = ctx.currentTime;
    var f = PENTA[Math.floor(Math.random() * PENTA.length)];
    if (Math.random() < 0.3) f *= 2;
    try {
      var o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = f;
      var o2 = ctx.createOscillator();
      o2.type = 'sine';
      o2.frequency.value = f * 2.01;
      var g1 = ctx.createGain(), g2 = ctx.createGain();
      g1.gain.setValueAtTime(0.15, t);
      g1.gain.exponentialRampToValueAtTime(0.0008, t + 1.6);
      g2.gain.setValueAtTime(0.045, t);
      g2.gain.exponentialRampToValueAtTime(0.0005, t + 0.7);
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2300;
      o.connect(g1); o2.connect(g2); g1.connect(lp); g2.connect(lp); lp.connect(master);
      o.start(t); o2.start(t);
      o.stop(t + 1.7); o2.stop(t + 0.8);
    } catch (e) {}
  }

  /* 木鱼：回合交割 */
  function knock() {
    if (!ready()) return;
    var t = ctx.currentTime;
    try {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(430, t);
      o.frequency.exponentialRampToValueAtTime(170, t + 0.09);
      var g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.2, t);
      g1.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      o.connect(g1); g1.connect(master);
      o.start(t); o.stop(t + 0.15);
    } catch (e) {}
  }

  /* 水滴：净化 */
  function drop() {
    if (!ready()) return;
    var t = ctx.currentTime;
    try {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(880 + Math.random() * 320, t);
      o.frequency.exponentialRampToValueAtTime(280, t + 0.16);
      var g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.11, t);
      g1.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g1); g1.connect(master);
      o.start(t); o.stop(t + 0.22);
    } catch (e) {}
  }

  /* 浊气闷响 */
  function thud() {
    if (!ready()) return;
    var t = ctx.currentTime;
    try {
      var len = Math.floor(ctx.sampleRate * 0.18);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 150;
      var g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.45, t);
      g1.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      src.connect(lp); lp.connect(g1); g1.connect(master);
      src.start(t);
    } catch (e) {}
  }

  /* 卷轴展开 / 墨洇 */
  function sweep() {
    if (!ready()) return;
    var t = ctx.currentTime;
    try {
      var len = Math.floor(ctx.sampleRate * 0.8);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = 0.8;
      bp.frequency.setValueAtTime(300, t);
      bp.frequency.exponentialRampToValueAtTime(2600, t + 0.55);
      var g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.001, t);
      g1.gain.exponentialRampToValueAtTime(0.09, t + 0.18);
      g1.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      src.connect(bp); bp.connect(g1); g1.connect(master);
      src.start(t);
    } catch (e) {}
  }

  function ready() {
    return !!(ctx && enabled && ctx.state !== 'closed');
  }

  var DS_AUDIO = {
    version: '1.0.0',
    isEnabled: function () { return enabled; },
    setEnabled: function (on) {
      enabled = !!on;
      savePref();
      if (enabled) { this.start(); }
      else if (ctx && ctx.state === 'running') {
        try { ctx.suspend(); } catch (e) {}
      }
    },
    /* 首次用户手势时调用 */
    start: function () {
      if (!enabled) return;
      if (!ensureCtx()) return;
      try { if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
      startWater();
      if (!timer) {
        nextBell = ctx.currentTime + 8 + Math.random() * 20;
        timer = setInterval(tick, 4000);
      }
    },
    pluck: pluck,
    knock: knock,
    drop: drop,
    bell: bell,
    thud: thud,
    sweep: sweep
  };

  g.DS_AUDIO = DS_AUDIO;
})();

  /* ============================== toast / modal / fatal ============================== */

  function toast(message, kind) {
    var root = app.toastRoot;
    if (!root) return;
    var node = document.createElement('div');
    node.className = 'toast toast--' + (kind || 'info');
    node.innerHTML = '<span class="toast__ink"></span><span class="toast__text">' + esc(message) + '</span>';
    root.appendChild(node);
    while (root.children.length > 3) root.removeChild(root.firstChild);
    setTimeout(function () {
      node.classList.add('is-out');
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 320);
    }, 2400);
  }

  function openModal(innerHTML, cls) {
    if (!app.overlay) return;
    closePopover();
    /* 记下打开前焦点，关闭时还原（键盘用户不会掉到背景里） */
    try { app.modalReturnFocus = document.activeElement; } catch (e) { app.modalReturnFocus = null; }
    app.overlay.innerHTML =
      '<div class="modal-mask" data-act="modal-mask">' +
        '<div class="modal ' + (cls || '') + '" role="dialog" aria-modal="true">' +
          '<button type="button" class="modal__close" data-act="modal-close" aria-label="关闭">×</button>' +
          innerHTML +
        '</div>' +
      '</div>';
    /* 焦点移入弹层：优先第一个主操作按钮，退回关闭按钮 */
    try {
      var box = $('.modal', app.overlay);
      var first = box && (box.querySelector('.modal__actions .btn:not([disabled])') ||
        box.querySelector('.btn:not([disabled])') ||
        box.querySelector('.modal__close'));
      if (first) first.focus();
    } catch (e) {}
  }
  function closeModal() {
    if (app.overlay) app.overlay.innerHTML = '';
    /* 还原焦点 */
    try {
      var back = app.modalReturnFocus;
      if (back && back.focus && document.contains(back)) back.focus();
    } catch (e) {}
    app.modalReturnFocus = null;
  }
  function modalOpen() { return !!(app.overlay && app.overlay.firstElementChild); }

  function fatal(err) {
    var msg = (err && (err.stack || err.message)) || String(err);
    if (typeof g.__DS_FATAL__ === 'function') { g.__DS_FATAL__(msg); return; }
    try {
      var box = document.getElementById('fatal');
      var pre = document.getElementById('fatal-msg');
      if (pre) pre.textContent = msg;
      if (box) box.hidden = false;
      if (!/^\[ERR\]/.test(document.title)) document.title = '[ERR] ' + document.title;
    } catch (e) { toast('墨污遮眼：' + msg, 'bad'); }
  }

  function applyPreChoice(state, choice, optionId) {
    try {
      var E = engine();
      if (typeof E.applyPreChoice === 'function') return E.applyPreChoice(state, choice, optionId);
    } catch (e) {}
    /* 引擎未提供时的手工兜底 */
    var opt = null;
    (choice.options || []).forEach(function (o) { if (o.id === optionId) opt = o; });
    if (!opt) return { ok: false, error: '无此选项' };
    (opt.effects || []).forEach(function (ef) {
      if (ef.type === 'poolNow' && state.pools[ef.pool]) state.pools[ef.pool].water = Math.max(0, state.pools[ef.pool].water + num(ef.amount));
      if (ef.type === 'enemyNow' && state.enemies && state.enemies[0]) {
        state.enemies[0].pollution = clamp(state.enemies[0].pollution + num(ef.pollution), 0, state.enemies[0].maxPollution);
      }
    });
    return { ok: true, events: [] };
  }

  function choosePreOption(optionId) {
    var pc = app.pendingPreChoice;
    if (!pc) return;
    var res = applyPreChoice(app.state, pc.choice, optionId);
    if (res && res.ok === false) { toast(res.error || '此令难行', 'warn'); return; }
    playEvents(res && res.events);
    app.pendingPreChoice = null;
    closeModal();
    startBattleFromState();
  }

function maybeBattleGuide() {
  if (!app || app.screen !== 'battle' || !app.state || app.day !== 1 || app.autoplay) return;
  if (app.params && app.params.noguide === '1') return;
  try { if (window.localStorage.getItem('dingshui.guide.v1') === '1') return; } catch (e) {}
  if (document.getElementById('battle-guide')) return;
  var steps = [
    { sel: '.bpools', title: '先看四池', text: '四只水盂是费用池：成、地、人、产。卡牌左上角的数字就是费用；某池见底会断水。' },
    { sel: '.bhand', title: '点手牌出牌', text: '点一张牌，再选池或怪物。牌面粗体是核心效果，例如「净化 5 点」「封印 2 回合」。' },
    { sel: '.benemies', title: '盯住浊气', text: '怪物身上的数字是浊气。把它压到 0，或完成本日目标，就能过关。' },
    { sel: '.btn-end', title: '结束回合', text: '费用用完就结束回合。敌方会行动并加重浊气；护甲可以挡一部分。' }
  ];
  var idx = 0;
  var ov = document.createElement('div');
  ov.id = 'battle-guide';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', '新手战斗引导');
  ov.innerHTML = '<div class="bg-spot"></div><div class="bg-card"><div class="bg-kicker">新手 · 第 1 天</div><div class="bg-title"></div><p class="bg-text"></p><div class="bg-dots"></div><div class="bg-actions"><button type="button" class="bg-skip">跳过</button><button type="button" class="bg-next">下一步 →</button></div></div>';
  document.body.appendChild(ov);
  var spot = ov.querySelector('.bg-spot');
  var card = ov.querySelector('.bg-card');
  var titleEl = ov.querySelector('.bg-title');
  var textEl = ov.querySelector('.bg-text');
  var dots = ov.querySelector('.bg-dots');
  var nextBtn = ov.querySelector('.bg-next');
  dots.innerHTML = steps.map(function () { return '<i></i>'; }).join('');
  function finish() {
    try { window.localStorage.setItem('dingshui.guide.v1', '1'); } catch (e) {}
    window.removeEventListener('resize', layout);
    ov.remove();
  }
  function layout() {
    var step = steps[idx];
    var target = step && document.querySelector(step.sel);
    if (!target) { idx++; if (idx >= steps.length) { finish(); return; } render(); return; }
    var r = target.getBoundingClientRect();
    if (!r.width || !r.height) { idx++; if (idx >= steps.length) { finish(); return; } render(); return; }
    var pad = 8;
    spot.style.left = Math.max(0, r.left - pad) + 'px';
    spot.style.top = Math.max(0, r.top - pad) + 'px';
    spot.style.width = Math.min(window.innerWidth, r.width + pad * 2) + 'px';
    spot.style.height = Math.min(window.innerHeight, r.height + pad * 2) + 'px';
    card.classList.toggle('is-top', r.top > window.innerHeight * 0.55);
  }
  function render() {
    if (idx >= steps.length) { finish(); return; }
    var step = steps[idx];
    titleEl.textContent = step.title;
    textEl.textContent = step.text;
    Array.prototype.forEach.call(dots.children, function (d, i) { d.className = i === idx ? 'on' : ''; });
    nextBtn.textContent = idx === steps.length - 1 ? '开始 ✓' : '下一步 →';
    layout();
  }
  nextBtn.onclick = function () { idx++; if (idx >= steps.length) { finish(); } else { render(); } };
  ov.querySelector('.bg-skip').onclick = finish;
  window.addEventListener('resize', layout);
  render();
}
