  /* ============================== 流程入口 ============================== */

  function startNewGame() {
    app.carry = emptyCarry();
    app.save = null;
    clearSave();
    app.day = 1;
    app.state = null;
    app.snapshot = null;
    app.result = null;
    app.ending = null;
    app.negotiation = null;
    app.autoplayDone = false;
    startDay(1);
  }

  function continueGame() {
    var save = readSave();
    if (!save || !save.carry) { toast('无档可续', 'info'); showMenu(); return; }
    app.carry = clone(save.carry);
    app.carry.day = clamp(num(save.day) || num(save.carry.day) || 1, 1, 7);
    app.save = save;
    startDay(app.carry.day);
  }

  function startDay(n) {
    var days = null;
    try { days = content().days; } catch (err) { toast('内容数据未载入', 'bad'); return; }
    if (!days || !days.length) { toast('七日水情未载入', 'bad'); return; }
    n = clamp(n, 1, days.length);
    if (!app.carry) app.carry = (app.save && app.save.carry) ? clone(app.save.carry) : emptyCarry();
    app.day = n;
    app.carry.day = n;
    app.state = null;
    app.snapshot = null;
    app.result = null;
    app.ending = null;
    app.negotiation = null;
    app.loseInfo = null;
    app.pendingPreChoice = null;
    app.target = null;
    app.phaseHandled = false;
    saveProgress();
    showBriefing();
  }

  /* ============================== 调试面板 ============================== */

  function showDebug() {
    if (!app.debug) return;
    var old = document.getElementById('debug-panel');
    if (old) old.parentNode.removeChild(old);
    var panel = document.createElement('div');
    panel.id = 'debug-panel';
    panel.className = 'debug-panel';
    var dayBtns = '';
    for (var i = 1; i <= 7; i++) {
      dayBtns += '<button type="button" class="debug-day" data-act="debug-day" data-day="' + i + '">' + i + '</button>';
    }
    panel.innerHTML =
      '<div class="debug-panel__head"><span>调试 · 水脉司</span><b id="debug-screen">' + esc(app.screen) + '</b></div>' +
      '<div class="debug-panel__days">' + dayBtns + '</div>' +
      '<div class="debug-panel__row">' +
        '<button type="button" data-act="debug-menu">主菜单</button>' +
        '<button type="button" data-act="debug-clear">清档</button>' +
      '</div>' +
      '<div class="debug-panel__meta" id="debug-meta"></div>';
    document.body.appendChild(panel);
    updateDebug();
  }

  function updateDebug() {
    if (!app.debug) return;
    var screenEl = document.getElementById('debug-screen');
    if (screenEl) screenEl.textContent = app.screen;
    var el = document.getElementById('debug-meta');
    if (!el) return;
    var bits = ['day ' + app.day, 'seed ' + (app.seed == null ? '—' : app.seed)];
    if (app.carry) bits.push('debt ' + num(app.carry.debt), 'score ' + num(app.carry.score));
    if (app.autoplay) bits.push('autoplay ' + app.autoplaySteps);
    if (app.autoplayDone) bits.push('autoplay done');
    el.textContent = bits.join(' · ');
  }

  function debugJump(n) {
    if (!app.carry) {
      var save = readSave();
      app.carry = save && save.carry ? clone(save.carry) : emptyCarry();
    }
    app.carry.day = clamp(n, 1, 7);
    app.pendingPreChoice = null;
    startDay(clamp(n, 1, 7));
  }

  /* ============================== QA · 直达屏幕 ============================== */

  function openScreenParam() {
    var screen = app.screenParam || 'menu';
    var day = app.dayParam || (screen === 'negotiation' ? 5 : (screen === 'ending' ? 7 : 1));
    if (!app.carry) app.carry = (app.save && app.save.carry) ? clone(app.save.carry) : emptyCarry();
    if (app.debtOverride != null) app.carry.debt = app.debtOverride;
    app.day = clamp(day, 1, 7);
    try {
      if (screen === 'menu') { showMenu(); return; }
      if (screen === 'brief') { startDay(app.day); return; }
      if (screen === 'battle') { jumpToBattle(app.day); return; }
      if (screen === 'result') { simulateResult(app.day); return; }
      if (screen === 'negotiation') { app.day = 5; app.carry.day = 5; saveProgress(); startNegotiation(dayData(5)); return; }
      if (screen === 'nego-summary') { simulateNegoSummary(); return; }
      if (screen === 'ending') { simulateEnding(); return; }
      if (screen === 'lose') { simulateLose(app.day); return; }
      if (screen === 'prechoice') { simulatePreChoice(app.day); return; }
      startDay(app.day);
    } catch (e) { fatal(e); }
  }

  function simulatePreChoice(day) {
    app.day = clamp(day, 1, 7);
    app.carry.day = app.day;
    saveProgress();
    var dd = dayData(app.day);
    if (!dd || !dd.preChoice) { jumpToBattle(app.day); return; }
    showBriefing();
    var r = engine().createGame(app.day, app.carry, gameOptions());
    if (!r || !r.ok) { toast((r && r.error) || '无法开局', 'bad'); return; }
    app.state = r.state;
    app.phaseHandled = false;
    app.pendingPreChoice = { choice: dd.preChoice, optionId: null };
    showPreChoiceModal();
  }

  function simulateNegoSummary() {
    app.day = 5;
    app.carry = app.carry || emptyCarry();
    app.carry.day = 5;
    saveProgress();
    startNegotiation(dayData(5));
    var n = app.negotiation;
    if (!n) return;
    var guard = 0;
    while (n.phase !== 'summary' && guard++ < 24) {
      if (n.phase === 'round') {
        var rd = n.data.rounds[n.round];
        if (rd && rd.options && rd.options.length) chooseNegoOption(rd.options[0].id);
        else { n.phase = 'summary'; break; }
      } else if (n.phase === 'reply') {
        negoNext();
      } else {
        break;
      }
    }
    renderNegotiation();
  }

  function simulateLose(day) {
    app.carry.day = day;
    saveProgress();
    var r = engine().createGame(day, app.carry, gameOptions());
    if (!r || !r.ok) { toast((r && r.error) || '无法开局', 'bad'); return; }
    var st = r.state;
    st.pools.cheng.water = 0;
    st.phase = 'lost';
    st._lostReason = 'cutoff';
    app.state = st;
    app.snapshot = { carry: clone(app.carry), state: clone(st) };
    app.screen = 'battle';
    loseBattle();
  }

  function jumpToBattle(day) {
    app.carry.day = day;
    saveProgress();
    var r = engine().createGame(day, app.carry, gameOptions());
    if (!r || !r.ok) { toast((r && r.error) || '无法开局', 'bad'); return; }
    app.state = r.state;
    app.snapshot = { carry: clone(app.carry), state: clone(app.state) };
    app.phaseHandled = false;
    showBattle();
  }

  function simulateResult(day) {
    app.carry.day = day;
    saveProgress();
    var r = engine().createGame(day, app.carry, gameOptions());
    if (!r || !r.ok) { toast((r && r.error) || '无法开局', 'bad'); return; }
    var st = r.state;
    (st.enemies || []).forEach(function (e) { e.pollution = 0; e.alive = true; });
    st.phase = 'won';
    if (st.stats) { st.stats.purified = 48; st.stats.cleansed = 6; }
    st.turn = 7;
    st.waterSpent = 34;
    app.state = st;
    app.snapshot = null;
    winBattle();
  }

  function simulateEnding() {
    app.carry.day = 7;
    var r = engine().createGame(7, app.carry, gameOptions());
    if (!r || !r.ok) { toast((r && r.error) || '无法开局', 'bad'); return; }
    var st = r.state;
    var boss = null;
    (st.enemies || []).forEach(function (e) { if (!boss && (e.isBoss || e.id === 'zhuolong')) boss = e; });
    if (!boss && st.enemies && st.enemies.length) boss = st.enemies[0];
    if (boss) boss.pollution = clamp(44 + num(app.carry.debt), 20, 100);
    st.phase = 'won';
    st.turn = 11;
    app.state = st;
    app.finalState = st;
    try { app.carry = engine().finishBattle(st) || app.carry; } catch (e2) {}
    showEnding();
  }

  /* ============================== 自动冒烟 ============================== */

  function startAutoplay() {
    if (app.autoplayTimer) { clearTimeout(app.autoplayTimer); app.autoplayTimer = null; }
    app.autoplay = true;
    app.autoplayDone = false;
    app.autoplaySteps = 0;
    app.autoplayTimer = setTimeout(autoplayTick, 140);
  }

  function autoplayTick() {
    if (!app.autoplay || app.autoplayDone) return;
    app.autoplaySteps += 1;
    if (app.autoplaySteps > 900) { stopAutoplay('timeout'); return; }
    var wait = 340;
    try { wait = autoplayStep() || 340; }
    catch (e) {
      stopAutoplay('error');
      toast('自动演算中断：' + ((e && e.message) || e), 'bad');
      return;
    }
    updateDebug();
    app.autoplayTimer = setTimeout(autoplayTick, wait);
  }

  function stopAutoplay(reason) {
    if (app.autoplayTimer) { clearTimeout(app.autoplayTimer); app.autoplayTimer = null; }
    app.autoplay = false;
    if (reason === 'done' || reason === 'timeout') {
      app.autoplayDone = true;
      try { document.body.setAttribute('data-autoplay', 'done'); } catch (e) {}
    }
    updateDebug();
  }

  function autoplayStep() {
    if (app.pendingPreChoice) {
      var pc = app.pendingPreChoice;
      var opt0 = (pc.choice.options || [])[0];
      if (opt0) { choosePreOption(opt0.id); return 460; }
    }
    switch (app.screen) {
      case 'menu': startNewGame(); return 420;
      case 'briefing': briefGo(); return 520;
      case 'battle': return autoplayBattle();
      case 'result': return autoplayResult();
      case 'negotiation': return autoplayNego();
      case 'lose': app.autoplayDone = true; stopAutoplay('done'); return 0;
      case 'ending': app.autoplayDone = true; stopAutoplay('done'); return 0;
      default: return 420;
    }
  }

  function autoplaySafeCost(ev) {
    var st = app.state;
    if (!st || !ev || !ev.cost) return true;
    var by = ev.cost.byPool || {};
    for (var k in by) {
      if (!has(by, k)) continue;
      var p = st.pools[k];
      if (!p) continue;
      /* 自动冒烟目标：不把池子打到断绝（水位严格大于 0） */
      if (num(p.water) - num(by[k]) <= 0) return false;
    }
    return true;
  }

  function autoplayCondOK(st, cond) {
    if (!cond) return true;
    if (cond.pool && cond.line) {
      var p = st.pools[cond.pool];
      if (!p) return false;
      var line = cond.line === 'warn' ? num(p.warn) : num(p.red);
      if (cond.cmp === 'below') { if (!(num(p.water) < line)) return false; }
      else if (!(num(p.water) > line)) return false;
    }
    if (cond.pool && cond.muddyAbove != null) {
      if (!(num(st.pools[cond.pool] && st.pools[cond.pool].muddy) > num(cond.muddyAbove))) return false;
    }
    if (cond.anyPoolBelowRed) {
      var any = false;
      POOL_KEYS.forEach(function (k) { var p = st.pools[k]; if (p && num(p.water) < num(p.red)) any = true; });
      if (!any) return false;
    }
    if (cond.targetPollutionAbove != null) {
      var t = (st.enemies || []).filter(function (e) { return e.alive; })[0];
      if (!t || !(num(t.pollution) > num(cond.targetPollutionAbove))) return false;
    }
    return true;
  }

  function autoplayBattle() {
    var st = app.state;
    if (!st) return 420;
    if (st.phase === 'won') {
      if (!app.phaseHandled) { app.phaseHandled = true; winBattle(); }
      return 600;
    }
    if (st.phase === 'lost') {
      app.autoplayDone = true;
      stopAutoplay('done');
      return 0;
    }
    var alive = (st.enemies || []).filter(function (e) { return e.alive && num(e.pollution) > 0; });
    var hand = st.hand || [];
    var candidates = [];
    for (var i = 0; i < hand.length; i++) {
      var ev = evalCard(i);
      if (!ev.playable || ev.cutoffPool) continue;
      if (!autoplaySafeCost(ev)) continue;
      if (ev.target === 'enemy' && !alive.length) continue;
      var def = ev.def || {};
      var purge = 0;
      var enableFlag = false;
      ((def.effects) || []).forEach(function (ef) {
        if (!autoplayCondOK(st, ef.when)) return;
        if (ef.type === 'purify') {
          var times = ef.target === 'all' ? Math.max(1, alive.length) : 1;
          purge += num(ef.amount) * times;
        }
        if (ef.type === 'flag' && (ef.key === 'halfCost' || ef.key === 'ignoreRed') && !(st.flags && st.flags[ef.key])) enableFlag = true;
      });
      if (purge <= 0 && !enableFlag) continue;
      var score = purge * 10 - num(ev.cost && ev.cost.total) * 2 + (enableFlag ? 200 : 0);
      candidates.push({ i: i, ev: ev, score: score });
    }
    candidates.sort(function (a, b) { return b.score - a.score; });
    if (candidates.length) {
      var pick = candidates[0];
      var idx = pick.i;
      var pcost = pick.ev;
      if (pcost.target === 'none') { doPlay(idx, { useMuddy: pcost.useMuddy }); return 360; }
      if (pcost.target === 'enemy') {
        if (alive.length) { doPlay(idx, { enemyUid: alive[0].uid, useMuddy: pcost.useMuddy }); return 360; }
      }
      if (pcost.target === 'pool') {
        var key = POOL_KEYS.slice().sort(function (a, b) {
          var pa = st.pools[a], pb = st.pools[b];
          return (num(pa.water) / Math.max(1, num(pa.cap))) - (num(pb.water) / Math.max(1, num(pb.cap)));
        })[0];
        doPlay(idx, { pool: key, useMuddy: pcost.useMuddy });
        return 360;
      }
    }
    /* 手牌将满仍无净化牌：打掉最便宜的杂牌腾手牌，避免后续关键牌被弃 */
    if (autoplayDumpHand()) return 340;
    endTurn();
    return 560;
  }

  function autoplayDumpHand() {
    var st = app.state;
    if (!st || (st.hand || []).length < 7) return false;
    var options = [];
    (st.hand || []).forEach(function (inst, i) {
      var ev = evalCard(i);
      if (!ev.playable || ev.cutoffPool) return;
      if (!autoplaySafeCost(ev)) return;
      if (ev.target === 'enemy' && !(st.enemies || []).some(function (e) { return e.alive && num(e.pollution) > 0; })) return;
      var def = ev.def || {};
      var harmful = false;
      (def.effects || []).forEach(function (ef) {
        if (ef.type === 'addMuddy' || ef.type === 'polluteAll') harmful = true;
        if (ef.type === 'addMax' && num(ef.amount) < 0) harmful = true;
      });
      if (harmful) return;
      options.push({ i: i, cost: num(ev.cost && ev.cost.total), target: ev.target, useMuddy: ev.useMuddy, enemyOnly: ev.target === 'enemy' });
    });
    options.sort(function (a, b) { return a.cost - b.cost; });
    if (!options.length) return false;
    var o = options[0];
    var alive = (st.enemies || []).filter(function (e) { return e.alive && num(e.pollution) > 0; });
    if (o.target === 'enemy') {
      if (!alive.length) return false;
      doPlay(o.i, { enemyUid: alive[0].uid, useMuddy: o.useMuddy });
      return true;
    }
    if (o.target === 'pool') {
      var key = POOL_KEYS[0];
      doPlay(o.i, { pool: key, useMuddy: o.useMuddy });
      return true;
    }
    doPlay(o.i, { useMuddy: o.useMuddy });
    return true;
  }

  function autoplayResult() {
    var r = app.result;
    if (!r) return 420;
    if (r.phase !== 'chosen') {
      if (r.choice && r.choice.options && r.choice.options.length) {
        chooseOption(r.choice.options[0].id);
        return 560;
      }
      r.phase = 'chosen';
      r.reply = '';
      renderResult();
      return 340;
    }
    if (r.day >= 7) { showEnding(); return 520; }
    var nextDay = r.day + 1;
    startDay(nextDay);
    if (r.day === 1) {
      app.autoplayDone = true;
      stopAutoplay('done');
      return 0;
    }
    return 500;
  }

  function autoplayNego() {
    var n = app.negotiation;
    if (!n) return 420;
    if (n.phase === 'round') {
      var rd = n.data.rounds[n.round];
      if (rd && rd.options && rd.options.length) { chooseNegoOption(rd.options[0].id); return 560; }
      n.phase = 'summary';
      renderNegotiation();
      return 340;
    }
    if (n.phase === 'reply') { negoNext(); return 460; }
    if (n.phase === 'summary') { finishNegotiation(); return 520; }
    return 420;
  }

  /* ============================== 动效 ============================== */

  /* 尊重"减少动效"偏好：CSS 侧已有覆盖，这里拦住 JS 生成的浮动墨点 */
  function noMotion() {
    try {
      if (document.documentElement.classList.contains('no-anim')) return true;
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { return false; }
  }

  function fxAppend(node, ms) {
    if (!app.fx) return;
    if (noMotion()) return;
    app.fx.appendChild(node);
    setTimeout(function () {
      if (node && node.parentNode) node.parentNode.removeChild(node);
    }, ms || 760);
  }

  function floatAt(rect, text, kind) {
    if (!rect) return;
    var d = document.createElement('span');
    d.className = 'fx-float fx-float--' + (kind || 'good');
    d.textContent = text;
    d.style.left = (rect.left + rect.width / 2) + 'px';
    d.style.top = (rect.top + rect.height * 0.34) + 'px';
    fxAppend(d, 1150);
  }
  function floatOnEnemy(uid, text, kind) {
    var el = $('.enemy[data-enemy-uid="' + uid + '"]', app.root);
    if (el) floatAt(el.getBoundingClientRect(), text, kind);
  }
  function floatOnPool(key, text, kind) {
    var el = $('.pool--' + key, app.root);
    if (el) floatAt(el.querySelector('.pool__jar').getBoundingClientRect(), text, kind);
  }
  function floatOnTop(text, kind) {
    var el = app.el.poll;
    if (el) floatAt(el.getBoundingClientRect(), text, kind);
  }

  function inkSplash(fromRect, toRect) {
    if (!fromRect || !toRect) return;
    var dx = (toRect.left + toRect.width / 2) - (fromRect.left + fromRect.width / 2);
    var dy = (toRect.top + toRect.height / 2) - (fromRect.top + fromRect.height / 2);
    for (var i = 0; i < 9; i++) {
      var dot = document.createElement('i');
      dot.className = 'fx-ink';
      dot.style.left = (fromRect.left + fromRect.width / 2) + 'px';
      dot.style.top = (fromRect.top + fromRect.height / 2) + 'px';
      dot.style.setProperty('--dx', (dx + (Math.random() - 0.5) * 90) + 'px');
      dot.style.setProperty('--dy', (dy + (Math.random() - 0.5) * 90) + 'px');
      dot.style.setProperty('--s', (0.5 + Math.random() * 1.3).toFixed(2));
      fxAppend(dot, 720);
    }
  }

  /* 净化涟漪：在指定元素处扩散双环，墨点垂落 */
  function purifyRing(rect) {
    if (!rect) return;
    var node = document.createElement('div');
    node.className = 'fx-ring';
    node.style.left = (rect.left + rect.width / 2) + 'px';
    node.style.top = (rect.top + rect.height * 0.42) + 'px';
    var html = '<i></i><i></i>';
    for (var i = 0; i < 5; i++) {
      var x = (Math.random() - 0.5) * rect.width * 0.7;
      html += '<b style="margin-left:' + x.toFixed(1) + 'px;animation-delay:' + (0.1 + Math.random() * 0.35).toFixed(2) + 's"></b>';
    }
    node.innerHTML = html;
    fxAppend(node, 1000);
  }

  function shakeEnemy(uid) {
    var el = $('.enemy[data-enemy-uid="' + uid + '"]', app.root);
    if (!el) return;
    el.classList.remove('is-hit');
    void el.offsetWidth;
    el.classList.add('is-hit');
    setTimeout(function () { el.classList.remove('is-hit'); }, 460);
  }
  function shakeScene() {
    var el = app.el.scene;
    if (!el) return;
    el.classList.remove('is-shake');
    void el.offsetWidth;
    el.classList.add('is-shake');
    setTimeout(function () { el.classList.remove('is-shake'); }, 480);
  }
  function flashPool(key) {
    var el = $('.pool--' + key, app.root);
    if (!el) return;
    el.classList.remove('is-flash');
    void el.offsetWidth;
    el.classList.add('is-flash');
    setTimeout(function () { el.classList.remove('is-flash'); }, 620);
  }

  function banner(text, sub) {
    var node = document.createElement('div');
    node.className = 'fx-banner';
    node.innerHTML = '<span class="fx-banner__text">' + esc(text) + '</span>' +
      (sub ? '<em class="fx-banner__sub">' + esc(sub) + '</em>' : '');
    fxAppend(node, 1300);
  }

  function stampFX(text) {
    var node = document.createElement('div');
    node.className = 'fx-stamp';
    node.innerHTML = artStamp(text);
    fxAppend(node, 1100);
    sfx('pluck');
  }

  function inkFlood() {
    var node = document.createElement('div');
    node.className = 'fx-flood';
    node.innerHTML = '<span class="fx-flood__ink"></span><span class="fx-flood__ink fx-flood__ink--b"></span>';
    fxAppend(node, 1500);
  }

  function playEvents(events) {
    if (!events || !events.length) return;
    events.forEach(function (ev) {
      if (!ev || !ev.t) return;
      try {
        switch (ev.t) {
          case 'purify': {
            floatOnEnemy(ev.enemyUid, '-' + num(ev.amount), 'good');
            var pe = $('.enemy[data-enemy-uid="' + ev.enemyUid + '"]', app.root);
            if (pe) purifyRing(pe.getBoundingClientRect());
            sfx('drop');
            break;
          }
          case 'pollution': floatOnEnemy(ev.enemyUid, '+' + Math.abs(num(ev.amount)), 'bad'); sfx('thud'); break;
          case 'cleanse': floatOnPool(ev.pool, '浊 -' + num(ev.amount), 'good'); sfx('drop'); break;
          case 'addWater': floatOnPool(ev.pool, '水 +' + num(ev.amount), 'good'); sfx('drop'); break;
          case 'addMuddy': floatOnPool(ev.pool, '浊 +' + num(ev.amount), 'bad'); sfx('thud'); break;
          case 'cap': floatOnPool(ev.pool, '上限 ' + (num(ev.amount) > 0 ? '+' : '') + num(ev.amount), num(ev.amount) > 0 ? 'good' : 'warn'); break;
          case 'moveMax':
            floatOnPool(ev.from, '上限 -' + num(ev.amount), 'warn');
            floatOnPool(ev.to, '上限 +' + num(ev.amount), 'good');
            break;
          case 'spend': {
            var p = $('.pool--' + ev.pool, app.root);
            if (p) floatAt(p.querySelector('.pool__jar').getBoundingClientRect(), '-' + num(ev.amount) + (num(ev.muddy) ? '浊' : ''), num(ev.muddy) ? 'warn' : 'info');
            break;
          }
          case 'shield': floatOnTop('护甲 +' + num(ev.amount), 'good'); sfx('pluck'); break;
          case 'seal': floatOnEnemy(ev.enemyUid, '封 ' + num(ev.turns) + ' 回合', 'good'); sfx('knock'); break;
          case 'debuff': floatOnTop('干扰 ' + num(ev.amount), 'good'); break;
          case 'enemyAct': shakeEnemy(ev.enemyUid); sfx('thud'); break;
          case 'redline': flashPool(ev.pool); break;
          case 'overflow': shakeScene(); sfx('thud'); break;
          case 'transfer': {
            floatOnPool(ev.from, '-' + num(ev.amount), 'warn');
            floatOnPool(ev.to, '+' + num(ev.received), 'good');
            break;
          }
          case 'turn': if (num(ev.turn) > 1) banner('第 ' + num(ev.turn) + ' 回合', ''); break;
          case 'win': stampFX('准'); break;
          case 'lose': inkFlood(); break;
          case 'log': break;
          default: break; /* 未知事件：忽略 */
        }
      } catch (e) { /* 动效失败不影响流程 */ }
    });
  }

  /* ============================== 交互 ============================== */

  function onDocClick(e) {
    var target = e.target;
    if (!target || !target.closest) return;
    var actEl = target.closest('[data-act]');
    if (!actEl) return;
    var act = actEl.getAttribute('data-act');
    if (!act) return;
    switch (act) {
      case 'modal-mask':
        if (e.target === actEl) closeModal();
        break;
      case 'modal-close':
        closeModal();
        break;
      case 'new': startNewGame(); break;
      case 'continue': continueGame(); break;
      case 'rules': showRules(); break;
      case 'about': showAbout(); break;
      case 'audio': {
        var on = audioToggle();
        var labels = document.querySelectorAll('[data-act="audio"]');
        for (var li = 0; li < labels.length; li++) labels[li].textContent = on ? '声 · 开' : '声 · 关';
        break;
      }
      case 'brief-go': briefGo(); break;
      case 'pre-opt': choosePreOption(actEl.getAttribute('data-opt')); break;
      case 'card': onCardClick(num(actEl.getAttribute('data-idx'))); break;
      case 'play-card': {
        var idx = num(actEl.getAttribute('data-idx'));
        var ev = evalCard(idx);
        tryPlay(idx, { useMuddy: ev.useMuddy });
        break;
      }
      case 'enemy-info': onEnemyClick(actEl.getAttribute('data-enemy-uid')); break;
      case 'pool-info': onPoolClick(actEl.getAttribute('data-pool')); break;
      case 'transfer': openTransferModal(actEl.getAttribute('data-pool')); break;
      case 'end-turn': endTurn(); break;
      case 'tr-from': app.transfer.from = actEl.getAttribute('data-k'); renderTransferModal(); break;
      case 'tr-to': app.transfer.to = actEl.getAttribute('data-k'); renderTransferModal(); break;
      case 'tr-mode': app.transfer.mode = actEl.getAttribute('data-mode'); renderTransferModal(); break;
      case 'tr-confirm': confirmTransfer(); break;
      case 'cutoff-yes': {
        var pc = app.pendingPlay;
        closeModal();
        app.pendingPlay = null;
        if (pc) {
          var oc = clone(pc.opts || {});
          oc.cutoffConfirmed = true;
          tryPlay(pc.handIndex, oc);
        }
        break;
      }
      case 'muddy-yes': {
        var pm = app.pendingPlay;
        closeModal();
        app.pendingPlay = null;
        if (pm) {
          var om = clone(pm.opts || {});
          om.useMuddy = true;
          om.muddyConfirmed = true;
          tryPlay(pm.handIndex, om);
        }
        break;
      }
      case 'choice': chooseOption(actEl.getAttribute('data-opt')); break;
      case 'result-next': nextAfterResult(); break;
      case 'result-ending': showEnding(); break;
      case 'retry': retryDay(); break;
      case 'menu': showMenu(); break;
      case 'ending-done':
        clearSave();
        app.carry = emptyCarry();
        app.autoplayDone = true;
        if (app.autoplay) stopAutoplay('done');
        showMenu();
        break;
      case 'nego-opt': chooseNegoOption(actEl.getAttribute('data-opt')); break;
      case 'nego-next': negoNext(); break;
      case 'nego-done': finishNegotiation(); break;
      case 'debug-day': debugJump(num(actEl.getAttribute('data-day'))); break;
      case 'debug-menu': showMenu(); break;
      case 'debug-clear': clearSave(); toast('档已清', 'info'); updateDebug(); break;
      default: break;
    }
  }

  function onDocInput(e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute('data-act') === 'tr-range') {
      app.transfer.amount = clamp(num(el.value), 1, app.transfer.mode === 'urgent' ? 12 : 5);
      updateTransferModalValues();
    }
  }

  function onMouseOver(e) {
    if (app.screen !== 'battle') return;
    var t = e.target;
    if (!t || !t.closest) return;
    var card = t.closest('.card');
    if (!card) return;
    var idx = num(card.getAttribute('data-idx'));
    if (app.popIndex === idx) return;
    showPopover(idx, card);
  }

  function onMouseOut(e) {
    if (app.screen !== 'battle') return;
    var t = e.target;
    if (!t || !t.closest) return;
    var card = t.closest('.card');
    if (!card) return;
    var to = e.relatedTarget;
    if (to && to.closest && to.closest('.card') === card) return;
    if (app.popIndex != null && num(card.getAttribute('data-idx')) === app.popIndex) hidePopover();
  }

  function onKeyDown(e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      if (modalOpen()) { closeModal(); return; }
      if (app.target) { cancelTarget(); return; }
      hidePopover();
      return;
    }
    /* 键盘激活：role="button" 的怪物 / 水盂等可点元素支持 Enter / 空格 */
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      var el = document.activeElement;
      if (el && el.getAttribute && el.getAttribute('role') === 'button' && el.getAttribute('data-act')) {
        e.preventDefault();
        el.click();
      }
      return;
    }
    /* 弹层内的焦点陷阱：Tab 不跑到背景 */
    if (e.key === 'Tab' && modalOpen()) trapFocus(e);
  }

  function trapFocus(e) {
    try {
      var box = $('.modal', app.overlay);
      if (!box) return;
      var items = box.querySelectorAll('button:not([disabled]), [tabindex="0"], input, select, a[href]');
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      var active = document.activeElement;
      if (e.shiftKey && (active === first || !box.contains(active))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (active === last || !box.contains(active))) { e.preventDefault(); first.focus(); }
    } catch (err) {}
  }

  function onContextMenu(e) {
    if (app.screen !== 'battle' && !modalOpen()) return;
    if (!app.root) return;
    e.preventDefault();
    if (modalOpen()) { closeModal(); return; }
    cancelTarget();
    hidePopover();
  }

  /* ============================== 启动 ============================== */

  function bootApp() {
    if (app.reset) clearSave();
    /* QA：?noanim=1 关闭全部动效，便于无头截图获得稳定画面 */
    if (app.params && app.params.noanim === '1') {
      try { document.documentElement.classList.add('no-anim'); } catch (e) {}
    }
    /* QA：?noaudio=1 强制关闭声景 */
    if (app.params && app.params.noaudio === '1') {
      try { if (audioApi() && audioApi().setEnabled) audioApi().setEnabled(false); } catch (e) {}
    }
    app.save = readSave();
    var savedCarry = app.save && app.save.carry ? clone(app.save.carry) : null;
    app.carry = savedCarry || emptyCarry();
    if (app.debtOverride != null) app.carry.debt = app.debtOverride;
    if (app.debug && app.screenParam) openScreenParam();
    else if (app.debug && app.dayParam) startDay(app.dayParam);
    else if (app.autoplay) { startNewGame(); startAutoplay(); }
    else showMenu();
    if (app.debug) showDebug();
    /* QA：?debug=1&modal=rules|about|transfer 直接打开弹层，便于无头截图 */
    if (app.debug && app.params && app.params.modal) {
      var m = app.params.modal;
      if (m === 'rules') showRules();
      else if (m === 'about') showAbout();
      else if (m === 'transfer') openTransferModal();
    }
    /* QA：?debug=1&screen=battle&pop=N 强制打开第 N 张牌的详情浮层 */
    if (app.debug && app.params && app.params.pop != null && app.screen === 'battle') {
      var pidx = num(app.params.pop);
      var pel = $('.card[data-idx="' + pidx + '"]', app.root);
      if (pel) showPopover(pidx, pel);
    }
    /* QA：?debug=1&screen=result&day=N&choose=<optionId> 自动批示，便于检查抉择反馈 */
    if (app.debug && app.params && app.params.choose && app.screen === 'result') {
      chooseOption(app.params.choose);
    }
    document.body.setAttribute('data-ds-ready', '1');
    qaProbe();
  }

  /* QA：?debug=1&probe=1 时把关键布局盒写入 body[data-probe]，供无头 --dump-dom 读取 */
  function qaProbe() {
    if (!app.params || app.params.probe !== '1') return;
    function measure() {
      try {
        var vw = document.documentElement.clientWidth;
        var vh = document.documentElement.clientHeight;
        var sels = ['.screen--battle', '.bbottom', '.bhand', '.card', '.card__text', '.btn-end',
          '.bpools', '.bscene', '.bside', '.bscene .enemy__art svg', '.bside__line', '.blog__item', '.screen--brief .doc'];
        var out = ['vw=' + vw, 'vh=' + vh, 'scroll=' + document.documentElement.scrollWidth + 'x' + document.documentElement.scrollHeight];
        sels.forEach(function (sel) {
          var el = document.querySelector(sel);
          if (!el) { out.push(sel + ':MISSING'); return; }
          var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
          out.push(sel + '[' + Math.round(r.x) + ',' + Math.round(r.y) + ',' + Math.round(r.width) + ',' + Math.round(r.height) + ']' +
            ' fs=' + cs.fontSize + ' lh=' + cs.lineHeight + ' ov=' + cs.overflow);
        });
        if (app.state) {
          var st = app.state;
          out.push('state=' + st.phase + ' turn=' + st.turn + '/' + st.turnLimit + ' spent=' + st.waterSpent +
            ' flags=' + JSON.stringify(st.flags || {}));
          out.push('pools=' + POOL_KEYS.map(function (k) {
            var p = st.pools[k];
            return k + ':' + p.water + '/' + p.cap + '(m' + p.muddy + ')';
          }).join(','));
          out.push('enemies=' + (st.enemies || []).map(function (e) { return e.id + ':' + e.pollution + '/' + e.maxPollution; }).join(','));
          out.push('hand=' + (st.hand || []).map(function (c) { return c.id; }).join(','));
          out.push('deck=' + (st.deck || []).length + ' discard=' + (st.discard || []).length);
          out.push('log=' + (st.log || []).slice(-18).map(function (l) { return (l.turn || 0) + ':' + l.text; }).join(' / '));
        }
        out.push('screen=' + app.screen);
        document.body.setAttribute('data-probe', out.join(' | '));
      } catch (e) {}
    }
    measure();
    setInterval(measure, 700);
  }

  function init() {
    app.root = document.getElementById('app');
    app.fx = document.getElementById('fx-layer');
    app.overlay = document.getElementById('overlay-root');
    app.toastRoot = document.getElementById('toast-root');
    if (!app.root) { fatal(new Error('界面挂载点 #app 缺失')); return; }
    document.addEventListener('click', onDocClick);
    document.addEventListener('input', onDocInput);
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('contextmenu', onContextMenu);
    document.addEventListener('mouseover', onMouseOver);
    document.addEventListener('mouseout', onMouseOut);
    /* 声景：首次用户手势后启动（浏览器自动播放限制） */
    if (!(app.params && app.params.noaudio === '1')) {
      document.addEventListener('pointerdown', audioStart, { once: true });
      document.addEventListener('keydown', audioStart, { once: true });
    }
    parseParams();
    try { bootApp(); } catch (e) { fatal(e); }
  }

  var DS_UI = {
    version: VERSION,
    init: init,
    /* 供 QA / 调试使用 */
    getApp: function () { return app; },
    startDay: startDay,
    showMenu: showMenu,
    playFirstCard: function () { return autoplayBattle(); }
  };
  g.DS_UI = DS_UI;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();


  </script>

<div id="device-hint" hidden>
  <div class="dh-box" role="dialog" aria-modal="true" aria-label="窄屏体验提示">
    <h2>请使用桌面 / 横屏体验</h2>
    <p>《定水》采用三栏卡牌战局：左侧四池、中间战局、右侧战报。当前窗口宽度不足，界面会被裁切。请使用桌面浏览器，或横屏并把窗口放大到 1100px 以上。</p>
    <button type="button" id="device-hint-continue">仍要进入</button>
  </div>
</div>
<script>
(function () {
  var box = document.getElementById('device-hint');
  if (!box) return;
  var btn = document.getElementById('device-hint-continue');
  var dismissed = false;
  try { dismissed = sessionStorage.getItem('dingshui.narrow.ok') === '1'; } catch (e) {}
  function sync() {
    if (window.innerWidth >= 1100) { box.hidden = true; return; }
    box.hidden = dismissed;
  }
  btn.onclick = function () {
    dismissed = true;
    try { sessionStorage.setItem('dingshui.narrow.ok', '1'); } catch (e) {}
    box.hidden = true;
  };
  window.addEventListener('resize', sync);
  sync();
})();
</script>
