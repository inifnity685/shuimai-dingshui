<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9e2d3">
  <meta name="description" content="《定水》——水墨志怪卡牌。四水四定，七天，一座水脉之城。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='10' width='80' height='80' fill='%23a8342a'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23f5efe2' font-family='Kaiti,STKaiti,serif'%3E%E5%AE%9A%3C/text%3E%3C/svg%3E">
  <title>定水 · 四水四定</title>
  <style>
/* =============================================================================
 * 《定水》样式 · 宣纸 / 墨渍 / 朱批 / 四水四定
 * 仅使用本地字体栈与内联 CSS/SVG（data URI），无外部资源。
 * ========================================================================== */

/* ============================== 基础与色板 ============================== */

/* 色板取自传统画颜料：焦浓重淡清五墨 / 朱砂 / 石青 / 石绿 / 赭石 / 藤黄 / 花青 */
:root {
  --paper: #ece5d3;
  --paper-2: #f5efe2;
  --paper-3: #dacfba;
  --ink: #1b1b18;
  --ink-2: #2c2c26;
  --ink-soft: #55523f;
  --ink-faint: #7a6f5a;
  --ink-5: #a89c82;
  --water: #2f6f7e;
  --water-2: #5a9aa6;
  --azurite: #3b7f8f;
  --malachite: #3f6b4f;
  --gamboge: #c08f3e;
  --indigo: #375a7a;
  --cinnabar: #a8342a;
  --cinnabar-2: #c14a35;
  --pollution: #4a3b2c;
  --pollution-dark: #6e2f27;
  --muddy: #6b7452;
  --di: #8a6742;
  --ren: #b8a97f;
  --chan: #3b3b38;

  --font-kai: "Kaiti SC", "KaiTi", "STKaiti", "Kaiti TC", "FangSong", "Songti SC", "SimSun", serif;
  --font-song: "Songti SC", "STSong", "FangSong", "SimSun", "Nimbus Roman", serif;
  --font-num: Georgia, "Times New Roman", "Songti SC", serif;

  --ease: cubic-bezier(.2, .7, .3, 1);
  --ease-ink: cubic-bezier(.16, .84, .28, 1);

  --left-w: 206px;
  --right-w: 300px;
  --top-h: 54px;
  --card-w: 130px;
  --card-h: 186px;

  --paper-noise: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23n)' opacity='0.30'/%3E%3C/svg%3E");
  --paper-fibers:
    repeating-linear-gradient(92deg, rgba(120, 105, 80, .035) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(2deg, rgba(120, 105, 80, .022) 0 1px, transparent 1px 7px);
  /* 竹帘纹：宣纸抄纸帘床留下的竖纹 */
  --paper-lines:
    repeating-linear-gradient(89.5deg, rgba(120, 105, 80, .05) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(0.5deg, rgba(120, 105, 80, .028) 0 1px, transparent 1px 26px);
  /* 墨晕：大块沉淀墨渍（淡墨） */
  --ink-wash: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='720' height='720'%3E%3Cg fill='%231b1b18'%3E%3Cellipse cx='120' cy='150' rx='150' ry='90' opacity='.05'/%3E%3Cellipse cx='560' cy='560' rx='180' ry='110' opacity='.045'/%3E%3Cellipse cx='620' cy='110' rx='90' ry='60' opacity='.035'/%3E%3Cellipse cx='210' cy='620' rx='110' ry='70' opacity='.04'/%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  /* 祥云纹：卷云轴承带 */
  --cloud-band: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='144' height='28'%3E%3Cg fill='none' stroke='%231b1b18' stroke-width='1.3' stroke-linecap='round' opacity='.38'%3E%3Cpath d='M14 22 q-2 -10 7 -11 q5 -1 6 5 q1 5 -4 6 q-6 1 -9 0 Z'/%3E%3Cpath d='M14 22 q-10 -1 -11 -8'/%3E%3Cpath d='M86 22 q-2 -10 7 -11 q5 -1 6 5 q1 5 -4 6 q-6 1 -9 0 Z'/%3E%3Cpath d='M86 22 q-10 -1 -11 -8'/%3E%3Cpath d='M50 9 q6 -4 11 0 q4 3 0 6 q-5 3 -11 0 q-4 -3 0 -6 Z' opacity='.6'/%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  /* 回纹：雷纹承带 */
  --fret-band: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='28' height='28'%3E%3Cpath d='M3 25 V7 H21 V19 H11 V13 H17' fill='none' stroke='%231b1b18' stroke-width='1.4' opacity='.4'/%3E%3C%2Fsvg%3E");
  /* 冰裂纹：瓷釉开片（水盂用） */
  --crackle: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='160' height='160'%3E%3Cg stroke='%231b1b18' stroke-width='.7' fill='none' opacity='.16'%3E%3Cpath d='M12 0 L34 58 L18 96 L52 160'/%3E%3Cpath d='M52 0 L44 44 L86 74 L70 160'/%3E%3Cpath d='M96 0 L128 30 L108 68 L140 160'/%3E%3Cpath d='M140 0 L152 52 L128 110 L160 160'/%3E%3Cpath d='M0 24 L44 44 M0 88 L18 96 M86 74 L128 30 M108 68 L152 52'/%3E%3C%2Fg%3E%3C%2Fsvg%3E");
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-kai);
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, select {
  font-family: inherit;
  color: inherit;
}

button { cursor: pointer; }

b, strong { font-weight: 700; }

svg { display: block; }

::selection { background: rgba(168, 52, 42, .22); }

:focus-visible { outline: 2px solid rgba(168, 52, 42, .55); outline-offset: 2px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(27, 27, 24, .22); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(27, 27, 24, .35); }

.app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--paper);
}
/* 四角压深：宣纸装裱的天地头 */
.app::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  background: radial-gradient(ellipse 120% 108% at 50% 46%, transparent 62%, rgba(74, 59, 44, .10) 100%);
}

/* 纸底：多层渐变 + 噪点 + 竹帘纹 + 墨晕 */
.screen__paper {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse at 18% 10%, rgba(255, 253, 246, .62), transparent 55%),
    radial-gradient(ellipse at 82% 88%, rgba(120, 105, 80, .12), transparent 62%),
    var(--ink-wash),
    var(--paper-noise),
    var(--paper-lines),
    var(--paper-fibers),
    linear-gradient(162deg, #f1ebdd 0%, #ece5d3 46%, #e2dac7 100%);
  background-blend-mode: normal, multiply, normal, multiply, multiply, normal, normal;
}

.screen {
  position: absolute;
  inset: 0;
  isolation: isolate;
  animation: screenIn .42s var(--ease);
}

@keyframes screenIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ============================== 通用按钮 ============================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 22px;
  background: rgba(242, 236, 223, .72);
  border: 1px solid rgba(27, 27, 24, .34);
  color: var(--ink);
  font-size: 15px;
  letter-spacing: .16em;
  transition: transform .2s var(--ease), background .2s, border-color .2s, box-shadow .2s;
  box-shadow: 0 4px 12px rgba(27, 27, 24, .08);
}
.btn:hover {
  background: rgba(255, 253, 246, .92);
  border-color: rgba(27, 27, 24, .55);
  box-shadow: 0 8px 20px rgba(27, 27, 24, .14);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

.btn--ink {
  background: linear-gradient(175deg, #33332e, #1b1b18);
  color: #f2ecdf;
  border-color: #1b1b18;
  box-shadow: 0 8px 22px rgba(27, 27, 24, .3), inset 0 1px 0 rgba(255, 255, 255, .12);
}
.btn--ink:hover {
  background: linear-gradient(175deg, #3d3d37, #232320);
  color: #fffaf0;
  border-color: #1b1b18;
}
.btn--ghost { background: transparent; border-color: rgba(27, 27, 24, .3); }
.btn--danger {
  background: linear-gradient(175deg, #b23c30, #8f2c23);
  border-color: #6e2f27;
  color: #f6ecdd;
}
.btn--danger:hover { background: linear-gradient(175deg, #c14a35, #9a3127); color: #fff6e8; }
.btn--go { padding: 12px 28px; font-size: 17px; letter-spacing: .24em; }
.btn__arrow { font-style: normal; opacity: .7; transition: transform .2s; }
.btn--go:hover .btn__arrow { transform: translateX(4px); }

/* ============================== 印章 / 分割 ============================== */

.ds-stamp {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 2px 3px rgba(110, 47, 39, .18));
  opacity: .92;
}
.fallback-stamp {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  height: 72px;
  border: 3px solid var(--cinnabar);
  color: var(--cinnabar);
  font-size: 34px;
  transform: rotate(-5deg);
}
.ds-divider { width: 100%; height: 10px; opacity: .8; }
.fallback-divider { display: block; height: 1px; background: rgba(27, 27, 24, .3); }
.fallback-logo {
  font-size: clamp(84px, 12vw, 150px);
  letter-spacing: .18em;
  color: var(--ink);
  text-indent: .18em;
}
.fallback-enemy {
  width: 100%;
  aspect-ratio: 260 / 220;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(27, 27, 24, .35);
  font-size: 26px;
  border: 1px dashed rgba(27, 27, 24, .2);
}
.fallback-backdrop {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 70%, rgba(27, 27, 24, .10), transparent 65%);
}
.fallback-official {
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 50% 40%, rgba(44, 44, 40, .7), rgba(44, 44, 40, .1) 70%);
}

/* ============================== 公文 ============================== */

.doc {
  position: relative;
  background-color: var(--paper-2);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255, 253, 246, .8), transparent 55%),
    radial-gradient(ellipse at 90% 100%, rgba(120, 105, 80, .12), transparent 60%),
    var(--paper-noise),
    var(--paper-fibers);
  background-blend-mode: normal, multiply, multiply, normal;
  border: 1px solid rgba(27, 27, 24, .28);
  box-shadow:
    0 26px 60px rgba(27, 27, 24, .18),
    0 2px 0 rgba(255, 253, 246, .6) inset,
    inset 0 0 110px rgba(139, 120, 86, .10);
  padding: 26px 34px 22px;
}

.doc__head { position: relative; }
.doc__redhead {
  color: var(--cinnabar);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .32em;
  text-align: center;
  border-bottom: 2px solid rgba(168, 52, 42, .82);
  padding-bottom: 8px;
  position: relative;
}
.doc__redhead::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -6px;
  height: 5px;
  background: var(--fret-band) repeat-x center / auto 5px;
  opacity: .32;
}
.doc__redhead.is-bad { color: var(--pollution-dark); border-bottom-color: rgba(110, 47, 39, .85); }
.doc__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--ink-faint);
  padding: 8px 2px 0;
}
.doc__no { color: var(--cinnabar); }
.doc__body { position: relative; padding: 14px 0 4px; }
.doc__title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: .18em;
  margin: 4px 0 2px;
  text-indent: .1em;
  position: relative;
  padding-bottom: 10px;
}
/* 标题双线：一粗一细，如卷轴题名下的界栏 */
.doc__title::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 5px;
  background:
    linear-gradient(90deg, rgba(27, 27, 24, .38), rgba(27, 27, 24, .12) 70%, transparent),
    linear-gradient(90deg, rgba(168, 52, 42, .5), transparent 40%);
  background-size: 100% 2px, 100% 1px;
  background-position: 0 0, 0 4px;
  background-repeat: no-repeat;
}
.doc__sub {
  font-size: 13px;
  color: var(--ink-soft);
  letter-spacing: .18em;
  margin: 0 0 12px;
}
.doc__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-top: 1px solid rgba(27, 27, 24, .22);
  padding-top: 14px;
  margin-top: 14px;
}
.doc__foot--center { justify-content: center; }

/* ============================== 主菜单 ============================== */

.screen--menu {
  display: flex;
  align-items: center;
  justify-content: center;
}
.menu__inner {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(-10px);
}
.menu__logo {
  width: min(480px, 44vw);
  filter: drop-shadow(0 16px 26px rgba(27, 27, 24, .16));
  animation: logoIn 1s var(--ease) both;
}
.menu__logo svg, .menu__logo .fallback-logo { width: 100%; height: auto; }
@keyframes logoIn {
  from { opacity: 0; transform: translateY(14px) scale(.985); }
  to { opacity: 1; transform: none; }
}
.menu__sub {
  margin: -4px 0 14px;
  font-size: 15px;
  letter-spacing: .52em;
  color: var(--ink-soft);
  text-indent: .52em;
}
.menu__rule { width: 230px; margin: 0 0 20px; opacity: .7; }
.menu__nav {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 342px;
}
.btn--menu {
  position: relative;
  display: grid;
  grid-template-columns: 38px 1fr auto;
  grid-template-areas: "mark label hint";
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 11px 18px;
  text-align: left;
  background: rgba(242, 236, 223, .48);
  border: 1px solid rgba(27, 27, 24, .22);
  box-shadow: none;
  letter-spacing: 0;
  transition: background .22s, border-color .22s, transform .22s var(--ease), box-shadow .22s;
}
.btn--menu:hover {
  background: rgba(255, 253, 246, .88);
  border-color: rgba(27, 27, 24, .48);
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(27, 27, 24, .12);
}
.btn__mark {
  grid-area: mark;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--paper-2);
  background: var(--cinnabar);
  font-size: 15px;
  letter-spacing: 0;
  transform: rotate(-3deg);
  box-shadow: inset 0 0 0 1px rgba(255, 253, 246, .25);
  opacity: .9;
}
.btn__label {
  grid-area: label;
  font-size: 19px;
  letter-spacing: .24em;
}
.btn__hint {
  grid-area: hint;
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: .08em;
  text-align: right;
}
.menu__footline {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 342px;
  margin-top: 20px;
  font-size: 10px;
  letter-spacing: .3em;
  color: rgba(122, 108, 70, .72);
  text-indent: .3em;
}
.menu__footline i {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(27, 27, 24, .28));
}
.menu__footline i:last-child { background: linear-gradient(90deg, rgba(27, 27, 24, .28), transparent); }
.menu__mount {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 32vh;
  pointer-events: none;
  background:
    radial-gradient(ellipse 56% 100% at 18% 128%, rgba(27, 27, 24, .13), transparent 70%),
    radial-gradient(ellipse 46% 100% at 74% 136%, rgba(27, 27, 24, .10), transparent 70%),
    linear-gradient(180deg, transparent 40%, rgba(27, 27, 24, .05) 100%);
}
.menu__mount svg {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: auto;
  animation: mountIn 1.6s var(--ease) both;
}
.menu__mount .fallback-mountains { position: absolute; inset: 0; }
@keyframes mountIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
/* 题跋：竖排款识，右悬如画卷题记 */
.menu__colophon {
  position: absolute;
  top: 16%;
  right: 5.5%;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  writing-mode: vertical-rl;
  animation: colophonIn 1.2s .5s var(--ease) both;
}
.menu__colophon-text {
  font-size: 13px;
  letter-spacing: .42em;
  line-height: 1.9;
  color: rgba(86, 83, 73, .68);
}
.menu__colophon-sign {
  font-size: 10px;
  letter-spacing: .3em;
  color: rgba(168, 52, 42, .62);
  border-left: 1px solid rgba(168, 52, 42, .3);
  padding-left: 8px;
}
@keyframes colophonIn {
  from { opacity: 0; transform: translateX(10px); }
  to { opacity: 1; transform: none; }
}
.menu__foot {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20px;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 34px;
  font-size: 11px;
  color: rgba(86, 83, 73, .8);
  letter-spacing: .1em;
}
.menu__tagline { color: rgba(122, 108, 70, .9); letter-spacing: .06em; }
.menu__sound {
  padding: 3px 12px;
  background: transparent;
  border: 1px solid rgba(27, 27, 24, .3);
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--ink-soft);
  transition: background .2s, color .2s, border-color .2s;
}
.menu__sound:hover { background: rgba(255, 253, 246, .7); border-color: rgba(27, 27, 24, .55); color: var(--ink); }
.menu__seal {
  position: absolute;
  top: 15%;
  right: 14%;
  width: 108px;
  z-index: 2;
  transform: rotate(7deg);
  opacity: .82;
  animation: sealIn .9s .35s var(--ease) both;
}
@keyframes sealIn {
  from { opacity: 0; transform: rotate(16deg) scale(1.35); }
  to { opacity: .82; transform: rotate(7deg) scale(1); }
}
.menu__side {
  position: absolute;
  top: 19%;
  left: 7%;
  writing-mode: vertical-rl;
  font-size: 13px;
  letter-spacing: .55em;
  color: rgba(86, 83, 73, .55);
  z-index: 2;
}
.menu__wash {
  position: absolute;
  pointer-events: none;
  filter: blur(30px);
  opacity: .24;
  background: radial-gradient(ellipse at center, var(--ink) 0%, rgba(27, 27, 24, .35) 45%, transparent 70%);
}
.menu__wash--a { width: 50vw; height: 44vh; left: -12vw; bottom: -14vh; transform: rotate(12deg); }
.menu__wash--b { width: 38vw; height: 34vh; right: -8vw; top: -8vh; transform: rotate(-9deg); opacity: .17; }

/* ============================== 水情简报 ============================== */

.screen--brief {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 40px 30px 40px;
}
.brief__stage {
  position: relative;
  z-index: 2;
  width: min(760px, 100%);
  max-height: calc(100vh - 60px);
  display: flex;
}
.brief__sidebar {
  position: absolute;
  left: 4.5%;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  z-index: 2;
  opacity: .8;
}
.brief__side-rule {
  width: 1px;
  height: 64px;
  background: linear-gradient(180deg, transparent, rgba(27, 27, 24, .42), transparent);
}
.brief__vertical {
  writing-mode: vertical-rl;
  font-size: 14px;
  letter-spacing: .5em;
  color: rgba(86, 83, 73, .78);
}
.brief__vertical--sub {
  font-size: 10px;
  letter-spacing: .62em;
  color: rgba(168, 52, 42, .62);
}
.doc--brief {
  width: 100%;
  overflow-y: auto;
  animation: docIn .55s var(--ease) both;
}
@keyframes docIn {
  from { opacity: 0; transform: translateY(16px) rotate(.2deg); }
  to { opacity: 1; transform: none; }
}
.brief__title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}
.brief__stamp {
  position: absolute;
  right: -4px;
  bottom: -10px;
  width: 94px;
  transform: rotate(-7deg);
  opacity: .92;
  animation: sealIn .7s .2s var(--ease) both;
}
.brief__order { padding-right: 112px; }
.brief__flag {
  display: inline-block;
  margin-left: 12px;
  padding: 0 6px;
  font-size: 10px;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .4);
  letter-spacing: .1em;
}
/* 简报引子：当日题记，斜体淡墨，与公文正文区分 */
.brief__intro {
  margin: 8px 0 0;
  padding: 7px 0 7px 12px;
  border-left: 2px solid rgba(27, 27, 24, .2);
  font-size: 12.5px;
  line-height: 1.85;
  letter-spacing: .02em;
  color: var(--ink-soft);
  font-style: italic;
}
.brief__lines {
  list-style: none;
  margin: 10px 0 4px;
  padding: 0;
}
.brief__line {
  position: relative;
  padding: 5px 0 5px 22px;
  font-size: 15px;
  line-height: 1.65;
  letter-spacing: .04em;
  color: var(--ink-2);
  animation: lineIn .5s var(--ease) both;
  animation-delay: calc(.05s + var(--i, 0) * .07s);
}
.brief__line::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  width: 12px;
  height: 12px;
  background: radial-gradient(circle at 40% 40%, rgba(27, 27, 24, .8), rgba(27, 27, 24, .15) 70%);
  border-radius: 50%;
  filter: blur(.6px);
}
@keyframes lineIn {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: none; }
}
.brief__rule { margin: 10px 0 12px; opacity: .45; }
.brief__annotation {
  font-size: 14px;
  line-height: 1.8;
  color: var(--cinnabar);
  background: rgba(168, 52, 42, .05);
  border-left: 2px solid rgba(168, 52, 42, .55);
  padding: 8px 12px;
  margin: 0 0 8px;
}
.brief__mark {
  display: inline-block;
  margin-right: 8px;
  padding: 0 4px;
  font-size: 11px;
  color: var(--paper-2);
  background: var(--cinnabar);
  transform: rotate(-2deg);
}
.brief__order {
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: .14em;
  margin: 0;
  text-indent: 2em;
}
.brief__carry {
  display: flex;
  gap: 22px;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .12em;
}
.brief__carry b {
  font-family: var(--font-num);
  font-size: 15px;
  color: var(--ink);
  margin-left: 3px;
}

/* ============================== 战斗 · 布局 ============================== */

.screen--battle {
  display: grid;
  grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
  grid-template-rows: var(--top-h) minmax(0, 1fr) auto;
  grid-template-areas:
    "top top top"
    "pools scene side"
    "bottom bottom bottom";
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
.screen--battle > * { position: relative; }

/* ---------- 顶栏 ---------- */

.btop {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 0 18px;
  background: linear-gradient(180deg, rgba(242, 236, 223, .96), rgba(233, 226, 211, .92));
  border-bottom: 1px solid rgba(27, 27, 24, .26);
  z-index: 6;
}
.btop::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -3px;
  height: 3px;
  background: linear-gradient(90deg,
    transparent, rgba(27, 27, 24, .13) 18%, rgba(168, 52, 42, .38) 50%, rgba(27, 27, 24, .13) 82%, transparent);
  pointer-events: none;
}
.btop__day { display: flex; align-items: baseline; gap: 9px; }
.btop__kicker { font-size: 11px; letter-spacing: .22em; color: var(--ink-faint); }
.btop__chapter { font-size: 21px; letter-spacing: .22em; }
.btop__item {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 11px;
  letter-spacing: .16em;
  color: var(--ink-soft);
}
.btop__item b {
  font-family: var(--font-num);
  font-size: 19px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0;
}
.btop__item .btop__dim { font-family: var(--font-num); font-size: 12px; opacity: .6; }
.btop__turn b { font-size: 22px; }
.btop__spacer { flex: 1; }
.btop__objective b { font-family: var(--font-kai); font-size: 14px; letter-spacing: .1em; color: var(--cinnabar); }
.btop__btn {
  padding: 4px 12px;
  background: transparent;
  border: 1px solid rgba(27, 27, 24, .32);
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--ink-soft);
  transition: .2s;
}
.btop__btn:hover { background: rgba(255, 253, 246, .8); border-color: rgba(27, 27, 24, .55); color: var(--ink); }
.btop__save {
  font-size: 10px;
  letter-spacing: .1em;
  color: var(--ink-faint);
  border-left: 1px solid rgba(27, 27, 24, .22);
  padding-left: 14px;
}

/* ---------- 左栏 · 四池水盂 ---------- */

.bpools {
  grid-area: pools;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 9px 9px 7px;
  border-right: 1px solid rgba(27, 27, 24, .15);
  background: linear-gradient(180deg, rgba(242, 236, 223, .28), rgba(216, 205, 184, .12));
}
.bpools__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--ink-faint);
  border-bottom: 1px solid rgba(27, 27, 24, .16);
  padding: 0 2px 5px;
  margin-bottom: 7px;
}
.bpools__head b { font-family: var(--font-num); font-weight: 400; color: var(--cinnabar); letter-spacing: .05em; }
.bpools__grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
}
.pool {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 0;
  padding: 3px 0 0;
  border-radius: 5px;
  cursor: pointer;
  transition: background .2s;
}
.pool:hover { background: rgba(255, 253, 246, .55); }
.pool__name {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  line-height: 1.1;
  margin-bottom: 4px;
}
.pool__short { font-size: 17px; letter-spacing: 0; color: var(--ink); }
.pool__full { display: block; font-size: 8px; color: var(--ink-faint); letter-spacing: .02em; white-space: nowrap; }
.pool__jar {
  position: relative;
  flex: 1;
  min-height: 0;
  width: min(44px, 100%);
  border-radius: 5px 5px 9px 9px;
  background:
    linear-gradient(180deg, rgba(255, 253, 246, .62), rgba(120, 105, 80, .10));
  border: 1px solid rgba(27, 27, 24, .34);
  box-shadow:
    inset 0 0 14px rgba(27, 27, 24, .12),
    inset 0 0 0 1px rgba(255, 253, 246, .25),
    0 2px 5px rgba(27, 27, 24, .10);
  overflow: hidden;
}
/* 冰裂纹釉面 + 左侧釉光 */
.pool__jar::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background:
    var(--crackle),
    linear-gradient(92deg, rgba(255, 255, 255, .16) 0%, transparent 22%, transparent 78%, rgba(27, 27, 24, .07) 100%);
  background-size: 90px 90px, 100% 100%;
  mix-blend-mode: multiply;
  opacity: .8;
}
.pool__clean {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0;
  background: linear-gradient(180deg, #7db6c0 0%, #4b8b99 26%, #2f6f7e 72%, #1f4a55 100%);
  transition: height .5s var(--ease);
  z-index: 1;
}
.pool__clean::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -2px;
  height: 3px;
  background: rgba(255, 253, 246, .35);
  filter: blur(1px);
}
.pool__muddy {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0;
  background-image:
    radial-gradient(ellipse at 22% 18%, rgba(255, 253, 246, .10), transparent 45%),
    repeating-radial-gradient(ellipse at 50% 110%, rgba(47, 58, 36, .35) 0 2px, transparent 2px 7px),
    linear-gradient(180deg, #7c845f 0%, #656e4d 40%, #4f573d 100%);
  opacity: .94;
  transition: height .5s var(--ease), bottom .5s var(--ease);
  z-index: 2;
  animation: muddyDrift 7s ease-in-out infinite;
}
@keyframes muddyDrift {
  0%, 100% { background-position: 0 0, 0 0, 0 0; }
  50% { background-position: 0 0, 2px 3px, 0 0; }
}
.pool__ripple {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 18%);
  mix-blend-mode: soft-light;
  opacity: .55;
}
.pool__warn,
.pool__red,
.pool__eff {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 4;
  pointer-events: none;
  transition: bottom .3s var(--ease);
}
.pool__warn { border-top: 1px dashed rgba(168, 52, 42, .62); }
.pool__warn i { display: none; }
.pool__red { border-top: 2px solid rgba(168, 52, 42, .92); }
.pool__red i { display: none; }
.pool__eff { border-top: 1px dotted rgba(27, 27, 24, .5); }
.pool__eff i {
  position: absolute;
  left: 1px;
  top: -9px;
  font-size: 7px;
  font-style: normal;
  line-height: 1;
  color: rgba(27, 27, 24, .55);
  background: rgba(242, 236, 223, .8);
}
.pool__nums {
  margin-top: 4px;
  font-family: var(--font-num);
  font-size: 12px;
  line-height: 1.1;
  color: var(--ink);
  white-space: nowrap;
}
.pool__nums b { font-size: 15px; font-weight: 700; }
.pool__nums span { font-size: 9px; opacity: .62; }
.pool__lines {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  font-size: 10px;
  line-height: 1.3;
  color: var(--ink-faint);
  white-space: nowrap;
}
.pool__lines .is-warn { color: rgba(168, 52, 42, .85); }
.pool__lines .is-red { color: var(--pollution-dark); }
.pool__sub {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  font-size: 10px;
  line-height: 1.3;
  color: var(--ink-faint);
  white-space: nowrap;
}
.pool__muddy-num { color: var(--muddy); }
.pool__eff-num { color: rgba(27, 27, 24, .6); }
.pool__btn {
  margin-top: 3px;
  width: 100%;
  max-width: 46px;
  padding: 1px 0;
  font-size: 9px;
  letter-spacing: .06em;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid rgba(27, 27, 24, .25);
  transition: .2s;
}
.pool__btn:hover { background: var(--cinnabar); border-color: var(--cinnabar); color: var(--paper-2); }

.pool.is-below-warn .pool__nums b { color: var(--cinnabar); }
.pool.is-below-red .pool__jar {
  box-shadow:
    0 0 0 1px rgba(168, 52, 42, .55),
    0 0 18px rgba(168, 52, 42, .38),
    inset 0 0 14px rgba(27, 27, 24, .12);
  animation: poolTremor 2.6s ease-in-out infinite;
}
@keyframes poolTremor {
  0%, 92%, 100% { transform: translateX(0); }
  93% { transform: translateX(-.6px); }
  95% { transform: translateX(.6px); }
  97% { transform: translateX(-.4px); }
}
.pool.is-empty .pool__nums b { color: var(--pollution-dark); }
.pool.is-overflow .pool__jar { outline: 1px dashed rgba(110, 47, 39, .6); outline-offset: 1px; }
.pool.is-flash .pool__jar { animation: poolFlash .6s ease-out; }
@keyframes poolFlash {
  0% { box-shadow: 0 0 0 2px rgba(168, 52, 42, .9), 0 0 26px rgba(168, 52, 42, .5); }
  100% { box-shadow: 0 0 0 1px rgba(168, 52, 42, .2), 0 0 0 rgba(168, 52, 42, 0); }
}

/* 目标选择：水盂朱框 */
.screen--battle.is-targeting-pool .pool::after {
  content: "";
  position: absolute;
  inset: 1px 0 34px;
  border: 2px solid rgba(168, 52, 42, .75);
  border-radius: 5px;
  pointer-events: none;
  animation: framePulse 1.1s ease-in-out infinite;
}
@keyframes framePulse {
  0%, 100% { opacity: .35; }
  50% { opacity: .95; }
}

/* ---------- 中部 · 战局 ---------- */

.bscene {
  grid-area: scene;
  position: relative;
  min-height: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255, 253, 246, .5), transparent 62%),
    linear-gradient(180deg, rgba(233, 226, 211, .2), rgba(216, 205, 184, .28));
}
.bscene__art {
  position: absolute;
  inset: 0;
  opacity: .52;
  filter: saturate(.82) contrast(.96);
}
.bscene__art svg { width: 100%; height: 100%; }
.bscene__art .fallback-backdrop { position: absolute; inset: 0; }
.bscene::before,
.bscene::after {
  content: "";
  position: absolute;
  z-index: 1;
  pointer-events: none;
  filter: blur(20px);
}
.bscene::before {
  left: -8%;
  top: -6%;
  width: 46%;
  height: 56%;
  background: radial-gradient(ellipse at 42% 42%, rgba(27, 27, 24, .11), transparent 68%);
}
.bscene::after {
  right: -10%;
  bottom: -12%;
  width: 52%;
  height: 58%;
  background: radial-gradient(ellipse at 55% 55%, rgba(47, 111, 126, .09), transparent 68%);
}
.bscene__veil {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 42%, transparent 28%, rgba(233, 226, 211, .42) 100%),
    linear-gradient(180deg, rgba(233, 226, 211, .45), transparent 22%, transparent 78%, rgba(216, 205, 184, .4));
}
.bscene__objective {
  position: absolute;
  left: 16px;
  top: 12px;
  z-index: 3;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--ink-soft);
  max-width: 70%;
}
.bscene__obj-kicker {
  font-size: 9px;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .35);
  padding: 0 4px;
  letter-spacing: .16em;
  white-space: nowrap;
}
.bscene__hint {
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  z-index: 3;
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--cinnabar);
  opacity: 0;
  transition: opacity .25s;
}
.bscene__hint:not(:empty) { opacity: .9; }
.screen--battle.is-targeting-enemy .bscene__hint::after,
.screen--battle.is-targeting-pool .bscene__hint::after { content: ""; }

.benemies {
  position: absolute;
  inset: 34px 12px 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(4px, 1.6vw, 34px);
  z-index: 2;
}
.benemies__empty {
  margin: auto;
  font-size: 14px;
  letter-spacing: .3em;
  color: rgba(86, 83, 73, .55);
}
.enemy {
  position: relative;
  flex: 1 1 0;
  min-width: 150px;
  max-width: clamp(230px, 21vw, 345px);
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform .25s var(--ease), filter .3s;
}
.enemy:hover { transform: translateY(-3px); }
.enemy__art {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 16px 20px rgba(27, 27, 24, .3));
}
/* 图鉴托底：淡墨圆光 + 墨线环，如年画/山海经图式的托底 */
.enemy__art::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 48%;
  width: 88%;
  aspect-ratio: 1 / .92;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 44%, rgba(255, 253, 246, .46), rgba(232, 224, 205, .10) 60%, transparent 74%);
  border: 1px solid rgba(27, 27, 24, .13);
  box-shadow: inset 0 0 44px rgba(120, 105, 80, .12);
  z-index: -1;
}
.enemy__art::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 48%;
  width: 70%;
  aspect-ratio: 1 / .92;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px dashed rgba(27, 27, 24, .09);
  z-index: -1;
}
.enemy__art svg {
  width: 100%;
  height: auto;
  max-height: 38vh;
  animation: enemyBreathe 6.5s ease-in-out infinite;
}
@keyframes enemyBreathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-4px) scale(1.012); }
}
.enemy__stain {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 78%;
  height: 40%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at 50% 60%, rgba(27, 27, 24, .72), rgba(27, 27, 24, .18) 60%, transparent 72%);
  filter: blur(3px);
  opacity: 0;
  transition: opacity .4s;
}
.enemy__plate { text-align: center; margin-top: -12px; }
.enemy__name {
  font-size: 21px;
  letter-spacing: .2em;
  color: var(--ink);
  text-indent: .2em;
  text-shadow: 0 1px 0 rgba(242, 236, 223, .7);
}
.enemy__clone-tag {
  font-size: 9px;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .4);
  padding: 0 3px;
  margin-left: 5px;
  vertical-align: middle;
  letter-spacing: .1em;
}
.enemy__sub {
  font-size: 10.5px;
  color: var(--ink-faint);
  letter-spacing: .08em;
  margin-top: 1px;
}
.enemy__poll {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 90%;
  margin-top: 4px;
}
.enemy__bar {
  position: relative;
  flex: 1;
  height: 10px;
  background: linear-gradient(180deg, #d8cdb8, #c7bca3);
  border: 1px solid rgba(27, 27, 24, .4);
  border-radius: 2px;
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(27, 27, 24, .25);
}
.enemy__bar i {
  display: block;
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #6e2f27, #4a3b2c 55%, #4a3b2c);
  transition: width .55s var(--ease);
}
.enemy__num {
  font-family: var(--font-num);
  font-size: 27px;
  font-weight: 700;
  line-height: 1;
  color: var(--pollution-dark);
  min-width: 36px;
  text-align: right;
  text-shadow: 0 1px 0 rgba(242, 236, 223, .6);
}
.enemy__traits {
  max-width: 96%;
  margin-top: 3px;
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--ink-soft);
  text-align: center;
  letter-spacing: .02em;
}
.enemy__intent {
  margin-top: 1px;
  font-size: 10.5px;
  letter-spacing: .04em;
  color: var(--cinnabar);
  text-align: center;
}
.enemy__seal {
  position: absolute;
  top: -2px;
  right: 0;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  color: var(--cinnabar);
  border: 2px solid rgba(168, 52, 42, .85);
  background: rgba(242, 236, 223, .72);
  transform: rotate(7deg);
  font-size: 13px;
  letter-spacing: 0;
  box-shadow: inset 0 0 0 1px rgba(168, 52, 42, .25);
}
.enemy__seal b { font-family: var(--font-num); font-size: 15px; }
.enemy__seal[hidden] { display: none; }
.enemy.is-sealed .enemy__art { filter: drop-shadow(0 10px 14px rgba(27, 27, 24, .25)) grayscale(.35); opacity: .8; }

/* Boss（第 7 天浊龙王）：墨像略收，名称与副题落在独立纸签上，避免压字 */
.enemy--boss .enemy__art { margin-top: 6px; }
.enemy--boss .enemy__art svg { max-height: 33vh; }
.enemy--boss .enemy__plate {
  position: relative;
  z-index: 2;
  margin-top: -16px;
  min-width: 160px;
  padding: 5px 22px 4px;
  background-color: rgba(242, 236, 223, .95);
  background-image: var(--paper-noise);
  background-blend-mode: multiply;
  border-top: 1px solid rgba(27, 27, 24, .22);
  border-bottom: 1px solid rgba(27, 27, 24, .22);
  box-shadow: 0 6px 16px rgba(27, 27, 24, .10);
}
.enemy--boss .enemy__name { font-size: 21px; letter-spacing: .26em; }
.enemy--boss .enemy__sub { margin-top: 2px; }

.enemy.is-hit { animation: enemyHit .42s var(--ease); }
@keyframes enemyHit {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-5px, 2px) rotate(-.6deg); }
  55% { transform: translate(4px, -2px) rotate(.5deg); }
  80% { transform: translate(-2px, 1px); }
  100% { transform: translate(0, 0); }
}

/* 死亡 → 墨渍 */
.enemy.is-dead { cursor: default; }
.enemy.is-dead .enemy__art svg { opacity: .10; filter: blur(2px); animation: none; }
.enemy.is-dead .enemy__stain { opacity: 1; }
.enemy.is-dead .enemy__plate,
.enemy.is-dead .enemy__poll,
.enemy.is-dead .enemy__traits,
.enemy.is-dead .enemy__intent { opacity: .28; }
.enemy.is-dead .enemy__name { text-decoration: line-through; text-decoration-color: rgba(27, 27, 24, .3); }

/* 目标选择：怪物朱框 */
.screen--battle.is-targeting-enemy .enemy:not(.is-dead) { cursor: crosshair; }
.screen--battle.is-targeting-enemy .enemy:not(.is-dead)::before {
  content: "";
  position: absolute;
  inset: -4px -3px 42%;
  border: 2px solid rgba(168, 52, 42, .8);
  pointer-events: none;
  animation: framePulse 1.1s ease-in-out infinite;
}

.bscene.is-shake { animation: sceneShake .46s ease-in-out; }
@keyframes sceneShake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-6px, 3px); }
  45% { transform: translate(5px, -3px); }
  70% { transform: translate(-3px, 2px); }
  90% { transform: translate(2px, -1px); }
}
.screen--battle.is-lost .bscene__veil {
  background: radial-gradient(ellipse at 50% 50%, rgba(27, 27, 24, .42), rgba(27, 27, 24, .78) 100%);
  transition: background .8s;
}

/* ---------- 右栏 · 水情简报与战报 ---------- */

.bside {
  grid-area: side;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-left: 1px solid rgba(27, 27, 24, .15);
}
.bside__doc {
  position: relative;
  margin: 9px 9px 0;
  padding: 9px 11px 10px;
  background-color: rgba(242, 236, 223, .7);
  background-image: var(--paper-noise), var(--paper-lines), var(--paper-fibers);
  background-blend-mode: multiply;
  border: 1px solid rgba(27, 27, 24, .2);
  box-shadow: 0 3px 10px rgba(27, 27, 24, .06);
}
/* 红头公文：回纹压边 */
.bside__redhead {
  color: var(--cinnabar);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .3em;
  text-align: center;
  border-bottom: 1.5px solid rgba(168, 52, 42, .8);
  padding-bottom: 4px;
  position: relative;
}
.bside__redhead::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -5px;
  height: 4px;
  background: var(--fret-band) repeat-x center / auto 4px;
  opacity: .35;
}
.bside__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 6px 0 5px;
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--ink-soft);
}
.bside__stamp { width: 44px; flex: 0 0 auto; transform: rotate(6deg); }
.bside__line {
  margin: 3px 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--ink-2);
  letter-spacing: .01em;
}
.bside__annotation {
  margin: 7px 0 0;
  padding-top: 6px;
  border-top: 1px dashed rgba(27, 27, 24, .24);
  font-size: 10.5px;
  line-height: 1.65;
  color: var(--ink-faint);
  font-style: italic;
}
.bside__logwrap {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  margin: 8px 9px 9px;
}
.bside__loghead {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: .26em;
  color: var(--ink-soft);
  padding-bottom: 3px;
}
.bside__rule {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(27, 27, 24, .32), transparent);
}
.blog {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  margin: 0;
  padding: 0 4px 0 0;
  list-style: none;
  scroll-behavior: smooth;
}
.blog__item {
  display: flex;
  gap: 6px;
  padding: 4px 3px;
  font-size: 11.5px;
  line-height: 1.6;
  border-bottom: 1px dotted rgba(27, 27, 24, .12);
  animation: logIn .3s var(--ease);
}
.blog__item:last-child {
  background: linear-gradient(90deg, rgba(168, 52, 42, .08), transparent 78%);
  border-left: 2px solid rgba(168, 52, 42, .55);
  padding-left: 4px;
}
.blog__item:last-child .blog__text { color: var(--ink); }
@keyframes logIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: none; }
}
.blog__turn {
  flex: 0 0 15px;
  font-family: var(--font-num);
  font-size: 10px;
  color: rgba(122, 108, 70, .85);
  text-align: right;
  padding-top: 1px;
}
.blog__item--good .blog__text { color: var(--water); }
.blog__item--bad .blog__text { color: var(--pollution-dark); }
.blog__item--warn .blog__text { color: var(--di); }
.blog__item--info .blog__text { color: #3b3b38; }

/* ---------- 底栏 · 手牌 ---------- */

.bbottom {
  grid-area: bottom;
  display: grid;
  grid-template-columns: 122px minmax(0, 1fr) 160px;
  align-items: stretch;
  gap: 12px;
  padding: 9px 16px 10px;
  background:
    linear-gradient(180deg, rgba(216, 205, 184, .25), rgba(242, 236, 223, .96) 34%);
  border-top: 1px solid rgba(27, 27, 24, .26);
  z-index: 5;
  min-height: 0;
}
.bbottom::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -2px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(27, 27, 24, .16), transparent);
  pointer-events: none;
}
.btray {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--ink-soft);
  letter-spacing: .06em;
}
.btray--left { align-items: flex-start; }
.btray--right { align-items: flex-end; text-align: right; }
.btray__row { display: flex; align-items: baseline; gap: 3px; white-space: nowrap; }
.btray__row b {
  font-family: var(--font-num);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0;
}
.btray__sep { opacity: .35; margin: 0 1px; }
.btray__transfer {
  margin-top: 2px;
  padding: 2px 10px;
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid rgba(27, 27, 24, .3);
  transition: .2s;
}
.btray__transfer:hover { background: var(--cinnabar); border-color: var(--cinnabar); color: var(--paper-2); }
.btray__hint {
  min-height: 15px;
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--ink-faint);
}
.hint--cinnabar { color: var(--cinnabar); }
.btn-end {
  position: relative;
  width: 100%;
  padding: 8px 10px 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  color: #f5ecdc;
  background: linear-gradient(178deg, #b23c30, #8f2c23 70%, #7d271f);
  border: 1px solid #63251e;
  box-shadow:
    0 7px 18px rgba(110, 47, 39, .32),
    inset 0 1px 0 rgba(255, 255, 255, .18);
  transition: transform .2s var(--ease), background .2s, box-shadow .2s;
  overflow: hidden;
}
.btn-end::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, .16), transparent 45%),
    var(--paper-noise);
  background-blend-mode: overlay, multiply;
  opacity: .5;
  pointer-events: none;
}
.btn-end:hover {
  transform: translateY(-1px);
  background: linear-gradient(178deg, #be4638, #9a3127 70%, #88291f);
  box-shadow: 0 10px 22px rgba(110, 47, 39, .4), inset 0 1px 0 rgba(255, 255, 255, .2);
}
.btn-end:active { transform: translateY(0); }
.btn-end__label { font-size: 17px; letter-spacing: .3em; text-indent: .3em; line-height: 1.35; }
.btn-end__sub { font-size: 8.5px; letter-spacing: .18em; opacity: .7; }
.btn-end.is-disabled,
.btn-end[disabled] { filter: grayscale(.55); opacity: .55; cursor: not-allowed; transform: none; }

.bhand {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 8px;
  min-height: 0;
  height: auto;
  padding: 0 2px;
}
.bhand__empty {
  margin: auto;
  font-size: 12px;
  letter-spacing: .2em;
  color: rgba(86, 83, 73, .55);
}

/* ---------- 卡牌 ---------- */

.card {
  position: relative;
  flex: 0 0 auto;
  width: var(--card-w);
  height: var(--card-h);
  padding: 9px 9px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  background-color: #f3ecdd;
  background-image:
    radial-gradient(ellipse at 22% 4%, rgba(255, 253, 246, .9), transparent 52%),
    radial-gradient(ellipse at 90% 96%, rgba(120, 105, 80, .14), transparent 58%),
    var(--paper-noise),
    var(--paper-lines),
    var(--paper-fibers);
  background-blend-mode: normal, multiply, multiply, multiply, normal;
  border: 1px solid rgba(27, 27, 24, .34);
  border-radius: 3px;
  color: var(--ink);
  box-shadow:
    0 5px 12px rgba(27, 27, 24, .16),
    inset 0 0 26px rgba(139, 120, 86, .12);
  overflow: hidden;
  transition: transform .24s var(--ease), box-shadow .24s, border-color .24s, filter .24s;
}
/* 框景角饰：左上 / 右下朱砂括线，如签纸押角 */
.card::before,
.card::after {
  content: "";
  position: absolute;
  width: 11px;
  height: 11px;
  z-index: 3;
  pointer-events: none;
  border: 0 solid rgba(168, 52, 42, .55);
}
.card::before { left: 4px; top: 4px; border-top-width: 1px; border-left-width: 1px; }
.card::after { right: 4px; bottom: 4px; border-right-width: 1px; border-bottom-width: 1px; }
.card:hover {
  transform: translateY(-10px) rotate(-.5deg);
  box-shadow: 0 18px 28px rgba(27, 27, 24, .26), inset 0 0 26px rgba(139, 120, 86, .1);
  border-color: rgba(27, 27, 24, .58);
  z-index: 6;
}
.card:active { transform: translateY(-6px) scale(.995); }
.card.is-disabled {
  filter: grayscale(.8) brightness(.95);
  opacity: .62;
  cursor: not-allowed;
}
.card.is-disabled:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(27, 27, 24, .16); }
.card.is-targeting {
  transform: translateY(-14px);
  border-color: var(--cinnabar);
  box-shadow:
    0 0 0 2px rgba(168, 52, 42, .55),
    0 16px 28px rgba(27, 27, 24, .24);
  z-index: 7;
}
.card--enter { animation: cardIn .26s var(--ease); }
@keyframes cardIn {
  from { opacity: .3; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.card__wash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 82% 82%, rgba(27, 27, 24, .06), transparent 55%),
    radial-gradient(ellipse at 12% 88%, rgba(27, 27, 24, .05), transparent 46%);
}
.card__schoolbar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--school, var(--water));
  box-shadow: inset -1px 0 0 rgba(255, 253, 246, .3);
}
.card--school-cheng { --school: #2f6f7e; }
.card--school-di { --school: #8a6742; }
.card--school-ren { --school: #b8a97f; }
.card--school-chan { --school: #3b3b38; }
.card--school-policy { --school: #a8342a; }

.card__cost {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 3px;
  padding-left: 1px;
  min-height: 16px;
}
.cost {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  padding: 0 2px;
  height: 15px;
  background: rgba(47, 111, 126, .10);
  border: 1px solid rgba(27, 27, 24, .24);
  border-radius: 7px;
  line-height: 1;
  cursor: help;
}
.cost__drop {
  width: 3px;
  height: 5px;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: var(--water);
  transform: rotate(8deg);
}
.cost--cheng .cost__drop { background: #2f6f7e; }
.cost--di .cost__drop { background: #8a6742; }
.cost--ren .cost__drop { background: #b8a97f; }
.cost--chan .cost__drop { background: #3b3b38; }
.cost b {
  font-family: var(--font-num);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink);
}
.cost em {
  font-style: normal;
  font-size: 7px;
  color: var(--ink-soft);
  opacity: .8;
}
.cost__muddy {
  font-style: normal;
  font-size: 6.5px;
  line-height: 1;
  color: #55603f;
  border-left: 1px solid rgba(79, 87, 61, .45);
  padding-left: 1px;
  margin-left: 0;
}
.cost.has-muddy { background: rgba(107, 116, 82, .18); border-color: rgba(79, 87, 61, .55); }
.cost.is-up { background: rgba(168, 52, 42, .13); border-color: rgba(168, 52, 42, .5); }
.cost.is-up b { color: var(--cinnabar); }
.cost.is-down { background: rgba(47, 111, 126, .16); }
.card__cost-free { font-size: 9px; color: var(--ink-faint); }

.card__seal {
  position: absolute;
  right: 6px;
  bottom: 3px;
  z-index: 0;
  font-size: 44px;
  line-height: 1;
  color: rgba(27, 27, 24, .09);
  font-weight: 700;
  pointer-events: none;
  user-select: none;
}
.card__name {
  position: relative;
  z-index: 2;
  margin-top: 1px;
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: .1em;
  line-height: 1.25;
}
.card__kind {
  position: relative;
  z-index: 2;
  font-size: 8.5px;
  letter-spacing: .1em;
  color: var(--ink-faint);
}
.card__text {
  position: relative;
  z-index: 2;
  flex: 1;
  margin-top: 1px;
  font-size: clamp(10px, .76vw, 11px);
  line-height: 1.55;
  color: #3b3b38;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
}
.card__tags {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  margin-top: 1px;
}
.card__tags i {
  font-style: normal;
  font-size: 8px;
  line-height: 11px;
  letter-spacing: .02em;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .3);
  background: rgba(168, 52, 42, .06);
  padding: 0 2px;
}
.card__reason {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 3;
  height: 17px;
  line-height: 17px;
  padding: 0 4px;
  font-size: 9px;
  letter-spacing: .04em;
  text-align: center;
  color: #efe7d6;
  background: rgba(27, 27, 24, .74);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card.is-disabled { padding-bottom: 22px; }
.card.is-disabled .card__text { -webkit-line-clamp: 4; }

/* 制度卡：红头公文 */
.card--policy {
  border: 1.5px solid rgba(168, 52, 42, .58);
  background-image:
    radial-gradient(ellipse at 22% 4%, rgba(255, 253, 246, .85), transparent 52%),
    var(--paper-noise),
    var(--paper-fibers);
}
.card--policy::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(168, 52, 42, .28);
  pointer-events: none;
  z-index: 1;
}
.card__redhead {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 16px;
  z-index: 2;
  background: linear-gradient(180deg, #ab372c, #8f2c23);
  color: #f2ecdf;
  font-size: 8.5px;
  letter-spacing: .62em;
  text-indent: .62em;
  text-align: center;
  line-height: 16px;
}
.card--policy .card__cost { margin-top: 15px; }
.card--policy .card__name--v {
  position: absolute;
  top: 38px;
  right: 9px;
  z-index: 2;
  writing-mode: vertical-rl;
  font-size: 17px;
  letter-spacing: .12em;
  line-height: 1;
  max-height: 96px;
}
.card--policy .card__kind { margin-top: 1px; padding-right: 25px; }
.card--policy .card__text { padding-right: 26px; -webkit-line-clamp: 5; }
.card--policy .card__seal {
  left: 8px;
  right: auto;
  bottom: 7px;
  font-size: 20px;
  color: rgba(168, 52, 42, .55);
  border: 1px solid rgba(168, 52, 42, .35);
  padding: 0 3px;
  line-height: 22px;
}
.card--policy .card__tags { padding-right: 22px; }
.card--policy .card__reason { background: rgba(110, 47, 39, .88); }

/* ============================== 卡牌详情浮层 ============================== */

.card-pop {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 70;
  width: 286px;
  padding: 14px 16px 12px;
  pointer-events: none;
  background-color: #f5efe2;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255, 253, 246, .9), transparent 55%),
    var(--paper-noise),
    var(--paper-fibers);
  background-blend-mode: normal, multiply, normal;
  border: 1px solid rgba(27, 27, 24, .42);
  box-shadow: 0 18px 44px rgba(27, 27, 24, .3), inset 0 0 40px rgba(139, 120, 86, .1);
  animation: popIn .18s var(--ease);
}
.card-pop[hidden] { display: none; }
@keyframes popIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: none; }
}
.pop__head { position: relative; }
.pop__kind {
  font-size: 9px;
  letter-spacing: .18em;
  color: var(--ink-faint);
}
.pop__seal {
  position: absolute;
  right: 0;
  top: -4px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid rgba(168, 52, 42, .7);
  color: var(--cinnabar);
  font-size: 17px;
  transform: rotate(6deg);
  opacity: .85;
}
.pop__name {
  margin: 3px 0 8px;
  font-size: 21px;
  letter-spacing: .14em;
  font-weight: 700;
}
.pop__cost {
  list-style: none;
  margin: 0 0 8px;
  padding: 6px 0;
  border-top: 1px solid rgba(27, 27, 24, .16);
  border-bottom: 1px solid rgba(27, 27, 24, .16);
}
.pop__cost li {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 11px;
  line-height: 1.7;
  color: var(--ink-soft);
}
.pop__cost li span { flex: 0 0 auto; }
.pop__cost li b {
  font-family: var(--font-num);
  font-size: 14px;
  color: var(--ink);
  margin-left: auto;
}
.pop__cost li em {
  flex: 0 0 auto;
  font-style: normal;
  font-size: 9px;
  color: var(--cinnabar);
  min-width: 0;
}
.pop__cost li.is-warn span { color: var(--cinnabar); }
.pop__text {
  margin: 7px 0 0;
  font-size: 12px;
  line-height: 1.65;
  color: var(--ink-2);
}
.pop__flavor {
  margin: 6px 0 0;
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--ink-faint);
  font-style: italic;
}
.pop__tokens { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.pop__token {
  font-size: 9px;
  letter-spacing: .05em;
  padding: 0 4px;
  border: 1px solid rgba(27, 27, 24, .25);
  color: var(--ink-soft);
}
.pop__token.is-red { color: var(--cinnabar); border-color: rgba(168, 52, 42, .4); background: rgba(168, 52, 42, .05); }
.pop__token.is-bad { color: var(--pollution-dark); border-color: rgba(110, 47, 39, .45); background: rgba(110, 47, 39, .06); }
.pop__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 9px;
  padding-top: 7px;
  border-top: 1px dashed rgba(27, 27, 24, .22);
}
.pop__ok { font-size: 11px; color: var(--water); letter-spacing: .08em; }
.pop__no { font-size: 11px; color: var(--cinnabar); letter-spacing: .04em; }
.pop__tip { font-size: 10px; color: var(--ink-faint); }
.pop__play {
  display: inline-flex;
  align-items: center;
  padding: 4px 16px;
  font-size: 12px;
  letter-spacing: .18em;
  text-indent: .18em;
  color: var(--paper-2);
  background: var(--cinnabar);
  border: 1px solid var(--pollution-dark);
  box-shadow: inset 0 0 0 1px rgba(255, 253, 246, .22);
  transition: background .18s, transform .18s var(--ease);
}
.pop__play:hover { background: var(--cinnabar-2); transform: translateY(-1px); }

/* ============================== 弹层 ============================== */

.modal-mask {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
  background: rgba(27, 27, 24, .5);
  backdrop-filter: blur(2px);
  animation: maskIn .24s var(--ease);
}
@keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  position: relative;
  width: min(660px, 94vw);
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px 34px 24px;
  background-color: #f3ecdd;
  background-image:
    radial-gradient(ellipse at 18% 0%, rgba(255, 253, 246, .9), transparent 55%),
    radial-gradient(ellipse at 88% 100%, rgba(120, 105, 80, .12), transparent 60%),
    var(--ink-wash),
    var(--paper-noise),
    var(--paper-lines),
    var(--paper-fibers);
  background-blend-mode: normal, multiply, normal, multiply, multiply, normal;
  border: 1px solid rgba(27, 27, 24, .4);
  box-shadow: 0 34px 90px rgba(0, 0, 0, .38), inset 0 0 90px rgba(139, 120, 86, .1);
  animation: modalIn .32s var(--ease);
}
/* 云纹承带：弹层上下缘的祥云压边 */
.modal::before,
.modal::after {
  content: "";
  position: absolute;
  left: 16px;
  right: 16px;
  height: 13px;
  background: var(--cloud-band) repeat-x center / auto 13px;
  opacity: .4;
  pointer-events: none;
}
.modal::before { top: 7px; }
.modal::after { bottom: 7px; transform: rotate(180deg); }
@keyframes modalIn {
  from { opacity: 0; transform: translateY(14px) scale(.99); }
  to { opacity: 1; transform: none; }
}
.modal--rules { width: min(780px, 94vw); }
.modal--transfer { width: min(720px, 94vw); }
.modal--choice { width: min(640px, 94vw); }
.modal--detail { width: min(620px, 94vw); }
.modal--cutoff { width: min(480px, 92vw); }
.modal__close {
  position: absolute;
  top: 8px;
  right: 10px;
  width: 30px;
  height: 30px;
  padding: 0;
  font-size: 20px;
  line-height: 1;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid transparent;
  transition: .2s;
  z-index: 3;
}
.modal__close:hover { color: var(--cinnabar); border-color: rgba(168, 52, 42, .4); }
.modal__head { padding-right: 24px; }
.modal__kicker {
  display: inline-block;
  margin-bottom: 6px;
  font-size: 10px;
  letter-spacing: .3em;
  color: var(--cinnabar);
}
.modal__head h2 {
  margin: 0 0 4px;
  font-size: 26px;
  letter-spacing: .16em;
  font-weight: 700;
}
.modal__prompt {
  margin: 0 0 14px;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--ink-soft);
}
.modal__foot {
  margin: 14px 0 0;
  font-size: 10.5px;
  color: var(--ink-faint);
  letter-spacing: .08em;
}
.modal__actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid rgba(27, 27, 24, .2);
}
.modal__more {
  position: sticky;
  bottom: -24px;
  z-index: 2;
  display: none;
  margin: 8px 0 -24px;
  padding: 22px 0 8px;
  text-align: center;
  pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(243, 236, 221, .96) 58%, #f3ecdd);
}
.modal.is-scrollable .modal__more { display: block; }
.modal__more span {
  font-size: 10px;
  letter-spacing: .32em;
  color: var(--cinnabar);
  text-indent: .32em;
}

/* 规则 / 关于 */
.rules { columns: 2; column-gap: 34px; margin-top: 4px; }
.rules__sec { break-inside: avoid; margin: 0 0 12px; }
.rules__sec h3 {
  margin: 0 0 4px;
  font-size: 14px;
  letter-spacing: .14em;
  color: var(--cinnabar);
  border-bottom: 1px dashed rgba(168, 52, 42, .3);
  padding-bottom: 3px;
}
.rules__sec p {
  margin: 3px 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--ink-2);
}
.rules__empty { color: var(--ink-faint); }
.about__tagline {
  font-size: 15px;
  line-height: 1.8;
  color: var(--cinnabar);
  letter-spacing: .06em;
  padding: 8px 0;
  border-top: 1px solid rgba(27, 27, 24, .18);
  border-bottom: 1px solid rgba(27, 27, 24, .18);
}
.about h3 {
  margin: 16px 0 4px;
  font-size: 13px;
  letter-spacing: .2em;
  color: var(--ink-soft);
}
.about ul { margin: 0; padding-left: 18px; }
.about li { font-size: 11.5px; line-height: 1.8; color: var(--ink-2); }
.about p { font-size: 11.5px; color: var(--ink-soft); }

/* 赴任前抉择 */
.preopts { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.preopt {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 13px 16px 13px 52px;
  text-align: left;
  background: rgba(242, 236, 223, .6);
  border: 1px solid rgba(27, 27, 24, .3);
  transition: .2s var(--ease);
}
.preopt:hover {
  background: rgba(255, 253, 246, .9);
  border-color: var(--cinnabar);
  transform: translateY(-1px);
  box-shadow: 0 10px 24px rgba(27, 27, 24, .14);
}
.preopt__no {
  position: absolute;
  left: 15px;
  top: 15px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .5);
  font-size: 13px;
  transform: rotate(-3deg);
}
.preopt__label { font-size: 16px; letter-spacing: .1em; }
.preopt__detail { font-size: 11.5px; color: var(--ink-soft); line-height: 1.6; }

/* 断水确认 */
.cutoff { margin-top: 6px; padding: 12px 14px; background: rgba(168, 52, 42, .06); border-left: 2px solid rgba(168, 52, 42, .6); }
.cutoff p { margin: 3px 0; font-size: 12.5px; line-height: 1.7; }
.cutoff__warn { color: var(--cinnabar); font-weight: 700; }
/* 借浊确认：以浊色（赭绿）区别于断水的朱红 */
.modal--muddy .modal__kicker { color: var(--pollution-dark); }
.modal--muddy .cutoff { background: rgba(107, 116, 82, .09); border-left-color: rgba(107, 116, 82, .7); }
.modal--muddy .cutoff__warn { color: var(--pollution-dark); }

/* 详情 */
.detail { display: flex; gap: 20px; margin-top: 4px; }
.detail__art {
  flex: 0 0 190px;
  align-self: flex-start;
  filter: drop-shadow(0 8px 14px rgba(27, 27, 24, .2));
}
.detail__art svg { width: 100%; height: auto; }
.detail__body { flex: 1; min-width: 0; }
.detail__stat {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  color: var(--ink-soft);
  border-bottom: 1px dotted rgba(27, 27, 24, .15);
  padding: 3px 0;
}
.detail__stat b { margin-left: auto; font-size: 13px; color: var(--ink); letter-spacing: .04em; }
.detail__stat b.is-ink { color: var(--cinnabar); }
.detail__stat em { font-style: normal; color: var(--ink-faint); font-family: var(--font-num); }
.detail__traits { margin: 8px 0 0; padding-left: 16px; }
.detail__traits li { font-size: 11px; line-height: 1.7; color: var(--ink-2); }
.detail__desc { font-size: 11.5px; line-height: 1.7; color: var(--ink-2); margin: 9px 0 0; }
.detail__flavor { font-size: 10.5px; line-height: 1.6; color: var(--ink-faint); font-style: italic; margin: 4px 0 0; }
.detail__body--wide { flex: 1; }
.detail__dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
.detail__dl > div {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px dotted rgba(27, 27, 24, .16);
  font-size: 12px;
  color: var(--ink-soft);
}
.detail__dl dd { margin: 0; font-family: var(--font-num); font-weight: 700; color: var(--ink); }

/* ============================== 调剂弹层 ============================== */

.transfer { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
.transfer__row { display: flex; gap: 12px; align-items: center; }
.transfer__label {
  flex: 0 0 26px;
  font-size: 13px;
  color: var(--cinnabar);
  letter-spacing: .1em;
  text-align: center;
  border: 1px solid rgba(168, 52, 42, .35);
  line-height: 24px;
}
.transfer__chips { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 6px 4px 5px;
  background: rgba(242, 236, 223, .5);
  border: 1px solid rgba(27, 27, 24, .26);
  transition: .18s;
}
.chip:hover { background: rgba(255, 253, 246, .9); border-color: rgba(27, 27, 24, .5); }
.chip.is-on { background: rgba(47, 111, 126, .12); border-color: var(--water); box-shadow: inset 0 0 0 1px rgba(47, 111, 126, .3); }
.chip__short { font-size: 17px; line-height: 1.1; }
.chip__name { font-size: 9px; color: var(--ink-soft); letter-spacing: .06em; }
.chip__num { font-family: var(--font-num); font-size: 10px; color: var(--ink-faint); }
.transfer__amount { padding: 10px 14px; background: rgba(27, 27, 24, .04); border: 1px solid rgba(27, 27, 24, .16); }
.transfer__amount-head { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.transfer__amount-head b { margin-left: auto; font-family: var(--font-num); font-size: 26px; color: var(--ink); }
.transfer__amount-head em { font-style: normal; font-size: 11px; color: var(--ink-faint); }
.transfer__amount input[type="range"] {
  width: 100%;
  margin: 6px 0 0;
  accent-color: var(--cinnabar);
  cursor: pointer;
}
.transfer__amount-ticks { display: flex; justify-content: space-between; font-family: var(--font-num); font-size: 9px; color: var(--ink-faint); }
.transfer__modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 12px;
  text-align: left;
  background: rgba(242, 236, 223, .5);
  border: 1px solid rgba(27, 27, 24, .26);
  transition: .18s;
}
.mode:hover { background: rgba(255, 253, 246, .9); }
.mode.is-on { background: rgba(168, 52, 42, .08); border-color: var(--cinnabar); }
.mode b { font-size: 13px; letter-spacing: .1em; }
.mode small { font-size: 10px; color: var(--ink-faint); }
.transfer__preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 10px 0 0;
  border-top: 1px dashed rgba(27, 27, 24, .22);
}
.transfer__preview > div { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.transfer__preview span { font-size: 10px; color: var(--ink-faint); letter-spacing: .12em; }
.transfer__preview b { font-family: var(--font-num); font-size: 22px; color: var(--ink); }
.transfer__preview b.is-bad { color: var(--cinnabar); }
.transfer__warn {
  margin: 0;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--cinnabar);
  background: rgba(168, 52, 42, .06);
  border-left: 2px solid rgba(168, 52, 42, .5);
}
.transfer__warn.is-bad { color: var(--pollution-dark); }

/* ============================== 胜利结算 + 核心抉择 ============================== */

.screen--result {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
  overflow-y: auto;
}
.result__stage {
  display: grid;
  grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr);
  gap: 26px;
  width: min(1120px, 100%);
  align-items: stretch;
}
.doc--report {
  max-height: calc(100vh - 52px);
  overflow-y: auto;
  animation: docIn .5s var(--ease) both;
}
.doc--report .doc__title { font-size: 28px; }
.report__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 12px 0 10px;
  background: rgba(27, 27, 24, .18);
  border: 1px solid rgba(27, 27, 24, .18);
}
.report__cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 13px;
  background: rgba(242, 236, 223, .92);
}
.report__cell span { font-size: 10px; letter-spacing: .16em; color: var(--ink-faint); }
.report__cell b {
  font-family: var(--font-num);
  font-size: 27px;
  line-height: 1.1;
  color: var(--ink);
}
.report__outro {
  margin: 10px 0 4px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-2);
  text-indent: 2em;
}
.report__line {
  margin: 3px 0;
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--ink-faint);
}
.report__carry {
  margin-top: 12px;
  padding: 8px 12px;
  display: flex;
  align-items: baseline;
  gap: 12px;
  background: rgba(47, 111, 126, .07);
  border-left: 2px solid rgba(47, 111, 126, .5);
}
.report__carry span { font-size: 10px; letter-spacing: .2em; color: var(--water); white-space: nowrap; }
.report__carry b { font-size: 12px; letter-spacing: .05em; color: var(--ink-2); font-weight: 400; }
.report__stamp {
  position: absolute;
  right: 30px;
  bottom: 22px;
  width: 84px;
  transform: rotate(-9deg);
  opacity: .9;
}
.result__side { display: flex; align-items: center; }
.choice {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 24px 24px 26px;
  background: linear-gradient(168deg, rgba(245, 239, 226, .62), rgba(233, 226, 211, .34));
  border: 1px solid rgba(27, 27, 24, .18);
  border-top: 2px solid rgba(168, 52, 42, .55);
  box-shadow: 0 14px 34px rgba(27, 27, 24, .08);
}
.choice__head h2 { margin: 4px 0 6px; font-size: 25px; letter-spacing: .14em; }
.choice__head p { margin: 0; font-size: 13px; line-height: 1.75; color: var(--ink-soft); }
.choice__kicker {
  display: inline-block;
  font-size: 10px;
  letter-spacing: .34em;
  color: var(--cinnabar);
  border-bottom: 1px solid rgba(168, 52, 42, .4);
  padding-bottom: 2px;
}
.choice__opts { display: flex; flex-direction: column; gap: 12px; }
.choice__opt {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 15px 18px 26px 56px;
  text-align: left;
  background-color: rgba(245, 239, 226, .92);
  background-image: var(--paper-noise);
  background-blend-mode: multiply;
  border: 1px solid rgba(27, 27, 24, .3);
  box-shadow: 0 10px 22px rgba(27, 27, 24, .12);
  transition: .22s var(--ease);
}
.choice__opt:hover {
  transform: translateY(-2px);
  border-color: var(--cinnabar);
  box-shadow: 0 16px 30px rgba(27, 27, 24, .18);
}
/* 悬停：朱砂笔触自左扫出 + 编号印章落朱 */
.choice__opt::after {
  content: "";
  position: absolute;
  left: 56px;
  right: 18px;
  bottom: 22px;
  height: 1px;
  background: linear-gradient(90deg, var(--cinnabar), rgba(168, 52, 42, .15));
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .3s var(--ease);
}
.choice__opt:hover::after { transform: scaleX(1); }
.choice__opt:hover .choice__no {
  background: var(--cinnabar);
  color: var(--paper-2);
  border-color: var(--pollution-dark);
}
.choice__no {
  position: absolute;
  left: 16px;
  top: 16px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .5);
  font-size: 14px;
  transform: rotate(-4deg);
}
.choice__label { font-size: 17px; letter-spacing: .09em; font-weight: 700; }
.choice__detail { font-size: 11.5px; line-height: 1.6; color: var(--ink-soft); }
.choice__go {
  position: absolute;
  right: 14px;
  bottom: 8px;
  font-size: 9px;
  letter-spacing: .34em;
  color: var(--cinnabar);
}
.choice--done {
  padding: 22px 24px;
  background-color: rgba(242, 236, 223, .9);
  background-image: var(--paper-noise);
  background-blend-mode: multiply;
  border: 1px solid rgba(27, 27, 24, .26);
  box-shadow: 0 14px 34px rgba(27, 27, 24, .12);
  gap: 12px;
}
.choice__reply {
  margin: 4px 0 0;
  padding: 8px 0 8px 14px;
  border-left: 2px solid rgba(168, 52, 42, .5);
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink-2);
  text-indent: 0;
}
.choice__picked { margin: 0; font-size: 11px; letter-spacing: .12em; color: var(--cinnabar); }
.choice__next { margin-top: 8px; display: flex; justify-content: flex-end; }
.choice--none { align-items: center; justify-content: center; text-align: center; gap: 16px; }
.choice--none p { margin: 0; font-size: 13px; color: var(--ink-faint); }

/* ============================== 第 5 天 · 谈判 ============================== */

.screen--negotiation {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 40px 26px;
  overflow-y: auto;
}.nego__top {
  width: min(1080px, 100%);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 12px;
  border-bottom: 2px solid rgba(27, 27, 24, .22);
}
.nego__kicker { font-size: 10px; letter-spacing: .34em; color: var(--cinnabar); }
.nego__title-block h1 { margin: 4px 0 2px; font-size: 28px; letter-spacing: .2em; font-weight: 700; }
.nego__title-block p { margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--ink-soft); }
.nego__progress { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.nego__progress-label { font-size: 10px; letter-spacing: .18em; color: var(--ink-faint); }
.nego__dots { display: flex; gap: 6px; }
.nego__dots i { width: 18px; height: 3px; background: rgba(27, 27, 24, .18); }
.nego__dots i.is-on { background: var(--cinnabar); }
.nego__dots i.is-done { background: rgba(47, 111, 126, .7); }
.nego {
  width: min(1080px, 100%);
  flex: 1;
  display: grid;
  grid-template-columns: 268px minmax(0, 1fr);
  align-items: center;
  gap: 40px;
  margin-top: 10px;
  padding-bottom: 24px;
}
.nego__who {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 20px 16px 16px;
  background-color: rgba(242, 236, 223, .55);
  background-image: var(--paper-noise);
  background-blend-mode: multiply;
  border: 1px solid rgba(27, 27, 24, .2);
}
.nego__art { width: 196px; height: 248px; display: flex; align-items: center; justify-content: center; }
.nego__art svg { width: 100%; height: 100%; }
.nego__dept { font-size: 20px; letter-spacing: .3em; color: var(--cinnabar); text-indent: .3em; }
.nego__speaker { font-size: 10.5px; letter-spacing: .1em; color: var(--ink-faint); }
.nego__logwrap { width: 100%; margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(27, 27, 24, .2); }
.nego__loghead { font-size: 9px; letter-spacing: .3em; color: var(--ink-faint); }
.nego__log { list-style: none; margin: 4px 0 0; padding: 0; }
.nego__logitem {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 5px 0;
  border-bottom: 1px dotted rgba(27, 27, 24, .14);
}
.nego__logdept { font-size: 10.5px; color: var(--ink-faint); letter-spacing: .1em; }
.nego__logchoice { font-size: 11.5px; color: var(--ink-2); font-weight: 400; }
.nego__logreply { margin: 0; font-size: 10.5px; line-height: 1.65; color: var(--ink-faint); font-style: italic; }
.nego__log--side .nego__logitem { flex-direction: row; align-items: baseline; gap: 6px; }
.nego__body { display: flex; flex-direction: column; min-height: 0; }
.nego__intro { margin: 0 0 16px; font-size: 12.5px; line-height: 1.8; color: var(--ink-soft); letter-spacing: .04em; }
.nego__demand {
  position: relative;
  margin: 0 0 22px;
  padding: 12px 0 12px 22px;
  border-left: 3px solid var(--cinnabar);
  font-size: 23px;
  line-height: 1.7;
  letter-spacing: .04em;
  color: var(--ink);
}
.nego__opts { display: flex; flex-direction: column; gap: 12px; }
.nego__opt {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  text-align: left;
  background-color: rgba(245, 239, 226, .85);
  background-image: var(--paper-noise);
  background-blend-mode: multiply;
  border: 1px solid rgba(27, 27, 24, .28);
  transition: .2s var(--ease);
}
.nego__opt:hover {
  transform: translateX(3px);
  border-color: var(--cinnabar);
  box-shadow: 0 10px 24px rgba(27, 27, 24, .14);
}
.nego__opt-no {
  flex: 0 0 26px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .5);
  font-size: 13px;
  transform: rotate(-3deg);
}
.nego__opt-body { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.nego__opt-label { font-size: 15px; letter-spacing: .08em; }
.nego__opt-detail { font-size: 11px; line-height: 1.6; color: var(--ink-soft); }
.nego__opt-go { font-size: 9px; letter-spacing: .3em; color: var(--cinnabar); }
.nego__reply {
  padding: 18px 20px;
  background-color: rgba(242, 236, 223, .8);
  background-image: var(--paper-noise);
  background-blend-mode: multiply;
  border: 1px solid rgba(27, 27, 24, .24);
  box-shadow: 0 12px 28px rgba(27, 27, 24, .1);
  animation: docIn .4s var(--ease);
}
.nego__reply-kicker { font-size: 9px; letter-spacing: .3em; color: var(--cinnabar); }
/* 水债纵深：把谈判代价换算到第七日 Boss 起手 */
.nego__debt {
  margin: 7px 0 4px;
  padding: 5px 10px;
  font-size: 11px;
  letter-spacing: .04em;
  color: var(--ink-soft);
  background: rgba(107, 116, 82, .1);
  border-left: 2px solid rgba(107, 116, 82, .6);
}
.nego__reply blockquote {
  margin: 8px 0 16px;
  font-size: 19px;
  line-height: 1.8;
  letter-spacing: .04em;
  color: var(--ink-2);
  border-left: 2px solid rgba(168, 52, 42, .4);
  padding-left: 14px;
}
.nego__summary {
  width: min(1080px, 100%);
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
  padding-bottom: 24px;
}
.nego__summary-doc {
  max-width: 760px;
  margin: 0 auto;
  padding: 26px 32px;
  background-color: rgba(242, 236, 223, .9);
  background-image: var(--paper-noise), var(--paper-fibers);
  background-blend-mode: multiply;
  border: 1px solid rgba(27, 27, 24, .26);
  box-shadow: 0 20px 50px rgba(27, 27, 24, .14);
}
.nego__summary-title { margin: 0 0 8px; font-size: 24px; letter-spacing: .24em; text-indent: .12em; }
.nego__outro { font-size: 13px; line-height: 1.9; color: var(--ink-2); text-indent: 2em; }
.nego__risks { margin-top: 16px; padding-top: 10px; border-top: 1px dashed rgba(27, 27, 24, .22); }
.nego__risks h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: .3em; color: var(--cinnabar); }
.nego__risks ul { margin: 0; padding-left: 18px; }
.nego__risks li { font-size: 12px; line-height: 1.75; color: var(--ink-soft); }
.nego__carry {
  margin-top: 14px;
  padding: 8px 12px;
  font-size: 11.5px;
  letter-spacing: .06em;
  color: var(--water);
  background: rgba(47, 111, 126, .07);
  border-left: 2px solid rgba(47, 111, 126, .5);
}
.nego__summary-foot { margin-top: 18px; display: flex; justify-content: flex-end; }

/* ============================== 最终结算 ============================== */

.screen--ending {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
  overflow-y: auto;
}
.ending__stage { width: min(880px, 100%); }
.doc--ending { position: relative; animation: docIn .55s var(--ease) both; }
.ending__hero {
  display: grid;
  /* 三栏：浊气 / 流量 / 考绩 */
  grid-template-columns: minmax(0, .85fr) minmax(0, 1.05fr) minmax(0, .75fr);
  gap: 24px;
  align-items: end;
  margin: 4px 0 14px;
  padding: 14px 0;
  border-top: 1px solid rgba(27, 27, 24, .2);
  border-bottom: 1px solid rgba(27, 27, 24, .2);
}
.ending__hero-label { display: block; font-size: 10px; letter-spacing: .26em; color: var(--ink-faint); margin-bottom: 2px; }
.ending__pollution { position: relative; display: flex; align-items: baseline; gap: 4px; padding-right: 60px; }
.ending__pollution b {
  font-family: var(--font-num);
  font-size: 62px;
  line-height: 1;
  color: var(--pollution-dark);
  letter-spacing: -.02em;
}
.ending__pollution em { font-family: var(--font-num); font-style: normal; font-size: 18px; color: var(--ink-faint); }
.ending__redline {
  position: absolute;
  right: 0;
  bottom: 6px;
  font-size: 10px;
  font-style: normal;
  letter-spacing: .1em;
  color: var(--cinnabar);
  border: 1px solid rgba(168, 52, 42, .45);
  padding: 1px 4px;
  transform: rotate(-3deg);
}
.ending__flow { display: flex; flex-direction: column; gap: 3px; }
/* 七日考绩 */
.ending__score {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-right: 8px;
}
.ending__score b {
  font-family: var(--font-num);
  font-size: 30px;
  line-height: 1;
  color: var(--ink);
}
.ending__score-note {
  font-size: 9.5px;
  font-style: normal;
  letter-spacing: .08em;
  color: var(--ink-faint);
}
.tone--lose .ending__score b { color: #4a1010; }
.ending__bar {
  position: relative;
  height: 16px;
  background: linear-gradient(180deg, #ded4bf, #cdc1a7);
  border: 1px solid rgba(27, 27, 24, .34);
  overflow: visible;
}
.ending__bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #6fa8b3, #2f6f7e);
  transition: width .8s var(--ease);
}
.ending__bar em {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 2px;
  background: var(--cinnabar);
  opacity: .8;
}
.ending__flow-num { font-family: var(--font-num); font-size: 15px; color: var(--water); }
.ending__lines { list-style: none; margin: 8px 0 12px; padding: 0; }
.ending__lines li {
  position: relative;
  padding: 4px 0 4px 18px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-2);
  letter-spacing: .04em;
}
.ending__lines li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 11px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(168, 52, 42, .8), rgba(168, 52, 42, .2) 70%);
}
.ending__tablewrap { margin: 8px 0 4px; overflow-x: auto; }
.ending__table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  color: var(--ink-2);
}
.ending__table caption {
  caption-side: top;
  text-align: left;
  font-size: 11px;
  letter-spacing: .26em;
  color: var(--ink-faint);
  padding-bottom: 5px;
}
.ending__table th {
  font-weight: 400;
  font-size: 10.5px;
  letter-spacing: .12em;
  color: var(--ink-faint);
  text-align: right;
  border-bottom: 1px solid rgba(27, 27, 24, .24);
  padding: 4px 6px;
}
.ending__table th:first-child { text-align: left; }
.ending__table td {
  font-family: var(--font-num);
  text-align: right;
  padding: 4px 6px;
  border-bottom: 1px dotted rgba(27, 27, 24, .14);
}
.ending__table td:first-child { text-align: left; font-family: var(--font-kai); color: var(--ink-soft); }
.ending__annotation {
  margin: 12px 0 0;
  padding: 8px 12px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--cinnabar);
  background: rgba(168, 52, 42, .05);
  border-left: 2px solid rgba(168, 52, 42, .5);
}
.ending__stamp {
